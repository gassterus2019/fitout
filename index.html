const PAGE_SIZES = [["20", 20], ["50", 50], ["100", 100], ["Semua", 0]];
function Logs({ logs }) {
  const [size, setSize] = useState(20);
  const [page, setPage] = useState(1);
  const [q, setQ] = useState("");
  const filtered = useMemo(() => {
    const s = q.trim().toLowerCase();
    if (!s) return logs;
    return logs.filter((l) => [l.actor, l.action, l.detail].join(" ").toLowerCase().includes(s));
  }, [logs, q]);
  const per = size === 0 ? filtered.length || 1 : size;
  const pages = Math.max(1, Math.ceil(filtered.length / per));
  const cur = Math.min(page, pages);
  const slice = size === 0 ? filtered : filtered.slice((cur - 1) * per, cur * per);
  useEffect(() => { setPage(1); }, [size, q]);
  const th = { textAlign: "left", fontSize: 11, fontWeight: 700, color: C.slate, padding: "10px 10px", borderBottom: `1px solid ${C.line}`, textTransform: "uppercase", letterSpacing: .3, background: "#fff", position: "sticky", top: 0, zIndex: 1, whiteSpace: "nowrap" };
  const td = { padding: "9px 10px", borderBottom: `1px solid ${C.line}`, fontSize: 12.8, color: C.ink, verticalAlign: "top" };
  return <div className="g1">
    <Card>
      <CardHead icon="history" title="Log Aktivitas" color={C.slate} right={
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <Input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Cari aktivitas…" style={{ width: 190, padding: "7px 10px" }} />
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 12, color: C.slate, whiteSpace: "nowrap" }}>Tampilkan</span>
            <Sel value={String(size)} onChange={(e) => setSize(Number(e.target.value))} style={{ width: 104, padding: "7px 10px" }}>
              {PAGE_SIZES.map(([lb, v]) => <option key={lb} value={String(v)}>{lb}</option>)}
            </Sel>
          </div>
        </div>} />
      {/* Tinggi tabel TETAP (scrollable) walau opsi "Semua" dipilih */}
      <div style={{ height: 430, overflow: "auto", border: `1px solid ${C.line}`, borderRadius: 12, background: "#fff" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 660 }}>
          <thead><tr><th style={{ ...th, width: 150 }}>Waktu</th><th style={{ ...th, width: 190 }}>Pengguna</th><th style={{ ...th, width: 210 }}>Aksi</th><th style={th}>Detail</th></tr></thead>
          <tbody>
            {slice.map((l) => <tr key={l.id}>
              <td style={{ ...td, color: C.slate, whiteSpace: "nowrap", fontVariantNumeric: "tabular-nums" }}>{fmtStamp(l.ts)}</td>
              <td style={{ ...td, fontWeight: 600 }}>{l.actor}</td>
              <td style={td}><Pill text={l.action} color={C.blue} bg={C.blueSoft} /></td>
              <td style={{ ...td, color: C.slate }}>{l.detail || "-"}</td>
            </tr>)}
            {slice.length === 0 && <tr><td colSpan={4}><Empty text="Belum ada aktivitas tercatat." /></td></tr>}
          </tbody>
        </table>
      </div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 12, gap: 10, flexWrap: "wrap" }}>
        <div style={{ fontSize: 12.5, color: C.slate }}>
          {filtered.length === 0 ? "0 entri" : size === 0
            ? `Menampilkan semua ${filtered.length} entri`
            : `Menampilkan ${(cur - 1) * per + 1}–${Math.min(cur * per, filtered.length)} dari ${filtered.length} entri`}
        </div>
        {size !== 0 && <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <Btn kind="ghost" size="sm" onClick={() => setPage(1)} disabled={cur === 1} style={{ opacity: cur === 1 ? .45 : 1 }}>«</Btn>
          <Btn kind="ghost" size="sm" onClick={() => setPage(cur - 1)} disabled={cur === 1} style={{ opacity: cur === 1 ? .45 : 1 }}><Ic name="chevL" size={13} /></Btn>
          <span style={{ fontSize: 12.5, color: C.ink, fontWeight: 600, padding: "0 6px" }}>Hal. {cur} / {pages}</span>
          <Btn kind="ghost" size="sm" onClick={() => setPage(cur + 1)} disabled={cur === pages} style={{ opacity: cur === pages ? .45 : 1 }}><Ic name="chevR" size={13} /></Btn>
          <Btn kind="ghost" size="sm" onClick={() => setPage(pages)} disabled={cur === pages} style={{ opacity: cur === pages ? .45 : 1 }}>»</Btn>
        </div>}
      </div>
    </Card>
  </div>;
}

/* ===== DIAGNOSTIK KONEKSI ===== */
function DiagModal({ onClose }) {
  const [res, setRes] = useState(null);
  const [busy, setBusy] = useState(false);
  const run = async () => { setBusy(true); setRes(null); try { setRes(await runDiag()); } catch (e) { setRes([{ name: "Diagnostik", ok: false, msg: e.message || String(e) }]); } setBusy(false); };
  useEffect(() => { run(); }, []);
  const bad = res ? res.filter((r) => !r.ok) : [];
  return <Modal title="Diagnostik Koneksi Supabase" onClose={onClose} width={620}>
    <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 14, flexWrap: "wrap" }}>
      <Btn onClick={run} disabled={busy}>{busy ? "Menguji…" : "Jalankan tes ulang"}</Btn>
      {LIVE && <Btn kind="ghost" onClick={() => window.location.reload()}>Muat ulang data dari server</Btn>}
      {res && <Pill text={bad.length === 0 ? "Semua lolos" : `${bad.length} masalah`} color={bad.length === 0 ? C.green : C.red} bg={bad.length === 0 ? C.greenSoft : "#FDECEF"} />}
    </div>
    {!LIVE && <div style={{ background: "#FCF3E2", border: `1px solid ${C.amber}`, borderRadius: 11, padding: "12px 14px", fontSize: 12.5, color: C.ink, marginBottom: 14 }}>
      <b>Aplikasi sedang berjalan mode DEMO.</b> Isi <code>SUPABASE_URL</code> dan <code>SUPABASE_ANON_KEY</code> di bagian atas blok script dalam <code>index.html</code>, lalu commit ulang ke GitHub dan muat ulang halaman dengan <b>Ctrl+Shift+R</b> (agar tidak memakai cache lama).
    </div>}
    <div style={{ display: "grid", gap: 6, maxHeight: "55vh", overflow: "auto" }}>
      {busy && !res && <Empty text="Menguji koneksi…" />}
      {res && res.map((r, i) => <div key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start", padding: "9px 11px", border: `1px solid ${r.ok ? C.line : C.red}`, background: r.ok ? "#fff" : "#FFF7F8", borderRadius: 10 }}>
        <span style={{ color: r.ok ? C.green : C.red, flexShrink: 0, marginTop: 1 }}><Ic name={r.ok ? "check" : "x"} size={15} /></span>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: C.ink }}>{r.name}</div>
          <div style={{ fontSize: 12, color: r.ok ? C.slate : C.red, wordBreak: "break-word" }}>{r.msg}</div>
        </div>
      </div>)}
    </div>
    <div style={{ marginTop: 14, fontSize: 12, color: C.slate, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 10, padding: "10px 12px" }}>
      Jika ada baris merah: jalankan ulang <b>database.sql</b> di Supabase SQL Editor (aman diulang), pastikan bucket <b>{BUCKET}</b> ada, lalu tes lagi.
    </div>
  </Modal>;
}

  const [modal, setModal] = useState(null);
  const [view, setView] = useState(null);
  const [note, setNote] = useState(null);
  const A2 = actOf(act);
  const updTask = (id, patch) => setTasks((s) => s.map((t) => { if (t.id !== id) return t; const n = { ...t, ...patch }; if ("percent" in patch && n.status !== STATUS.cancel) n.status = stOf(n.percent); return n; }));
  const saveTask = (data) => {
    const succ = data._succ || null; const d = { ...data }; delete d._succ;
    setTasks((s) => {
      let next = d.id ? s.map((t) => t.id === d.id ? { ...t, ...d } : t) : [...s, { ...d, id: uid(), note: d.note || "", assignees: d.assignees || [] }];
      const myId = d.id;
      if (myId && succ) {
        /* successor disimpan sebagai predecessor pada pekerjaan tujuan */
        next = next.map((t) => {
          const has = (t.pred || []).indexOf(myId) >= 0;
          const want = succ.indexOf(t.id) >= 0;
          if (want && !has) return { ...t, pred: [...(t.pred || []), myId] };
          if (!want && has) return { ...t, pred: (t.pred || []).filter((x) => x !== myId) };
          return t;
        });
      }
      return next;
    });
    log && log(d.id ? "Edit pekerjaan" : "Tambah pekerjaan", `${A2.label}: ${d.name}`);
    setModal(null);
  };
  const reschedule = () => {
    const r = recalcSchedule(tasks);
    if (r.cycle) { window.alert("Ada ketergantungan melingkar — perbaiki dulu predecessor-nya."); return; }
    if (!r.moved) { window.alert("Semua jadwal sudah sesuai ketergantungan. Tidak ada yang perlu digeser."); return; }
    if (!window.confirm(`${r.moved} pekerjaan akan digeser mengikuti predecessor dan tanggal penyelesaian aktual.\n\nLanjutkan?`)) return;
    setTasks(r.tasks); log && log("Jadwalkan ulang", `${r.moved} pekerjaan bergeser`);
  };
  const delTask = (id) => {
    const t = tasks.find((x) => x.id === id);
    setTasks((s) => s.filter((x) => x.id !== id && x.parent !== id));
    log && log("Hapus pekerjaan", `${A2.label}: ${t ? t.name : id}`);
  };
  const moveKanban = (id, col) => {
    setTasks((s) => s.map((t) => {
      if (t.id !== id) return t;
      let pct = t.percent;
      if (col === STATUS.done) pct = 100; else if (col === STATUS.todo) pct = 0;
      else if (col === STATUS.doing && (pct === 0 || pct === 100)) pct = 50;
      return { ...t, status: col, percent: pct };
    }));
    const t = tasks.find((x) => x.id === id); log && log("Ubah status Kanban", `${t ? t.name : id} → ${col}`);
  };
  const saveNote = (patch) => {
    setTasks((s) => s.map((t) => t.id === note.id ? { ...t, ...patch } : t));
    log && log("Catatan & penugasan", `${note.name} · ${(patch.assignees || []).length} orang`);
    setNote(null);
  };
  const list = tasks.filter((t) => t.act === act);
  const leaves = list.filter((t) => !list.some((x) => x.parent === t.id));
  const counts = {}; KCOLS.forEach((k) => (counts[k] = 0));
  leaves.forEach((t) => (counts[t.status] = (counts[t.status] || 0) + 1));
  const pct = progressOf(tasks, act);
  const predInfo = useMemo(() => predictFinishInfo(tasks, act), [tasks, act]);
  const predFin = predInfo ? predInfo.date : null;
  const planFin = useMemo(() => { let mx = null; leaves.forEach((t) => { if (t.status === STATUS.cancel) return; const f = D(t.finish); if (!mx || f > mx) mx = f; }); return mx ? iso(mx) : null; }, [tasks, act]);
  const lateList = leaves.filter(isLate);
  const lateN = lateList.length;
  const TabBtn = ({ id, icon, label }) => <button onClick={() => setTab(id)} style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "8px 14px", borderRadius: 10, border: `1px solid ${tab === id ? C.violet : C.line}`, background: tab === id ? C.violetSoft : "#fff", color: tab === id ? C.violet : C.slate, fontWeight: 700, fontSize: 13, cursor: "pointer" }}><Ic name={icon} size={15} /> {label}</button>;
  return <div className="g1">
    <div className="g4">
      <Stat label="Progres Kegiatan" value={pct + "%"} sub={`${list.filter((t) => !t.parent).length} pekerjaan · ${leaves.length} item`} icon="trending" color={A2.color} />
      <Stat label="Prediksi Selesai" value={predFin ? fmtDate(predFin) : "-"} sub={predInfo ? ("penentu: " + (predInfo.driver.name.length > 20 ? predInfo.driver.name.slice(0, 19) + "…" : predInfo.driver.name)) : "-"} icon="calendar" color={planFin && predFin && D(predFin) > D(planFin) ? C.red : C.green} />
      <Stat label="Terlambat" value={lateN} sub={lateN ? "perlu dijadwalkan ulang" : "semua sesuai jadwal"} icon="alert" color={lateN ? C.red : C.green} />
      <Stat label={STATUS.done} value={counts[STATUS.done]} sub={`${counts[STATUS.doing]} berjalan · ${counts[STATUS.cancel]} batal`} icon="check" color={C.green} />
    </div>
    <Card>
      <CardHead icon={A2.icon} color={A2.color} title={`Kegiatan ${A2.label}`} right={
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {can.manage && <Btn kind="ghost" onClick={reschedule} title="Geser jadwal mengikuti predecessor & penyelesaian aktual"><Ic name="history" size={16} /> Jadwalkan Ulang</Btn>}
          {tab === "gantt" && <Btn kind="ghost" onClick={onExport} disabled={exporting}><Ic name="download" size={16} /> {exporting ? "Menyiapkan…" : "Unduh PNG"}</Btn>}
          {can.manage && <Btn onClick={() => setModal({ task: null })}><Ic name="plus" size={16} /> Tambah Pekerjaan</Btn>}
        </div>} />
      {lateN > 0 && <div style={{ display: "flex", alignItems: "flex-start", gap: 10, background: "#FDECEF", border: `1px solid ${C.red}`, borderRadius: 12, padding: "11px 14px", marginBottom: 14 }}>
        <span style={{ color: C.red, flexShrink: 0, marginTop: 1 }}><Ic name="alert" size={17} /></span>
        <div style={{ minWidth: 0, flex: 1 }}>
          <div style={{ fontSize: 13, fontWeight: 800, color: C.ink }}>{lateN} pekerjaan terlambat di kegiatan {A2.label}</div>
          <div style={{ fontSize: 12, color: C.slate, marginTop: 3 }}>
            {lateList.slice(0, 3).map((t) => { const li = lateInfo(t); return `${t.name} (${li.hari} hari${li.aktual ? ", aktual" : ""})`; }).join(" · ")}
            {lateN > 3 ? ` · +${lateN - 3} lainnya` : ""}
          </div>
          {predInfo && predFin && planFin && D(predFin) > D(planFin) && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 5 }}>
            Prediksi selesai mundur ke <b style={{ color: C.red }}>{fmtDate(predFin)}</b> (rencana {fmtDate(planFin)}) karena pekerjaan <b>“{predInfo.driver.name}”</b> {predInfo.reason}.
          </div>}
          {can.manage && <div style={{ display: "flex", gap: 7, marginTop: 9, flexWrap: "wrap" }}>
            <Btn size="sm" kind="ghost" onClick={() => setView(lateList[0])}>Lihat yang terlambat</Btn>
            <Btn size="sm" kind="ghost" onClick={reschedule}><Ic name="history" size={13} /> Jadwalkan Ulang</Btn>
          </div>}
        </div>
      </div>}
      <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
        <TabBtn id="gantt" icon="calendar" label="Gantt Chart" />
        <TabBtn id="kanban" icon="kanban" label="Kanban" />
        <TabBtn id="week" icon="clock" label="Kalender Mingguan" />
      </div>
      <div style={{ fontSize: 12.5, color: C.slate, marginBottom: 12 }}>
        {tab === "gantt"
          ? (can.manage
            ? "Sumbu waktu: bulan + minggu ke- dalam tahun (arahkan kursor ke nomor minggu untuk melihat tanggalnya). Seret bar sub pekerjaan untuk menggeser jadwal, tarik ujung kanan untuk mengubah durasi. Bar pekerjaan utama dihitung otomatis dari sub pekerjaannya."
            : "Sumbu waktu: bulan + minggu ke- dalam tahun (arahkan kursor ke nomor minggu untuk melihat tanggalnya). Role Admin hanya dapat melihat jadwal.")
          : (can.manage
            ? "Seret kartu antar kolom untuk mengubah status. Ikon mata = detail, ikon pensil = catatan & penugasan."
            : "Seret kartu antar kolom untuk mengubah status (diizinkan untuk Admin). Ikon mata untuk melihat detail dan catatan.")}
      </div>
      {tab === "gantt" && <Gantt tasks={tasks} act={act} users={users} statusDate={PROJECT.statusDate} editable={can.manage} onChange={updTask} onEdit={(t) => setModal({ task: t })} onDelete={delTask} onAddSub={(p) => setModal({ task: { name: "", act, parent: p.id, start: p.start, finish: p.finish, percent: 0, status: STATUS.todo, note: "", assignees: [], prio: "Sedang" } })} />}
      {tab === "kanban" && <Kanban tasks={tasks} act={act} users={users} onMove={moveKanban} onView={setView} onNote={setNote} onAdd={() => setModal({ task: null })} canMove={can.kanban} canNote={can.manage} />}
      {tab === "week" && <WeekCalendar tasks={tasks} act={act} users={users} onView={setView} />}
    </Card>

    <Card>
      <CardHead icon="trending" color={A2.color} title={"S-Curve — " + A2.label} right={<div style={{ display: "flex", gap: 12, fontSize: 12, flexWrap: "wrap" }}>
        <span style={{ display: "flex", alignItems: "center", gap: 5, color: C.slate, fontWeight: 600 }}><span style={{ width: 14, height: 2.5, background: C.slate, borderRadius: 2 }} />Rencana</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5, color: A2.color, fontWeight: 600 }}><span style={{ width: 14, height: 2.5, background: A2.color, borderRadius: 2 }} />Aktual</span>
      </div>} />
      <ActSCurveChart data={actSC} color={A2.color} soft={A2.soft} />
      <div style={{ fontSize: 11.5, color: C.slate, marginTop: 8 }}>Kurva rencana vs aktual khusus kegiatan {A2.label}. Garis putus-putus = target kumulatif; garis penuh = realisasi progres pekerjaan.</div>
    </Card>

    {modal && can.manage && <TaskModal task={modal.task && modal.task.id ? modal.task : (modal.task || null)} act={act} tasks={tasks} users={users} onClose={() => setModal(null)} onSave={saveTask} />}
    {view && <TaskViewModal task={view} tasks={tasks} users={users} onClose={() => setView(null)} />}
    {note && can.manage && <TaskNoteModal task={note} users={users} onSave={saveNote} onClose={() => setNote(null)} />}
  </div>;
}

/* ===== APP ===== */
function App() {
  const [user, setUser] = useState(null);
  const [booting, setBooting] = useState(LIVE);
  const [ready, setReady] = useState(!LIVE);
  const [loadErr, setLoadErr] = useState("");

  const [sidebar, setSidebar] = useState(true);
  const [rail, setRail] = useState(false);   // desktop: sidebar menyempit jadi ikon saja
  useEffect(() => { setSidebar(!isMobile); }, [isMobile]);

  const userRef = useRef(null); userRef.current = user;
  const log = useMemo(() => (action, detail) => {
    const u = userRef.current;
    setLogs((s) => [{ id: uid(), ts: nowISO(), actor: u ? (u.name || uname(u)) : "Sistem", action, detail: detail || "" }, ...s].slice(0, 1000));
  }, []);

  const scToday = useMemo(() => todayMarkerData(rab, fee, terms, trans, acosts), [rab, fee, terms, trans, acosts, acts]);
  const sc = useMemo(() => sCurve(rab, fee, terms, trans, acosts), [rab, fee, terms, trans, acosts, acts]);
  const cTotal = sumCost(rab), trTotal = sumCost(trans), aTotal = sumCost(acosts);
  const proj = cTotal + fee + trTotal + aTotal;
  const overall = useMemo(() => progressOf(tasks, null), [tasks]);
  const payData = useMemo(() => paymentMonths(rab, fee, terms, trans, acosts), [rab, fee, terms, trans, acosts, acts]);
  const nextPay = terms.filter((t) => D(t.date) >= D(PROJECT.statusDate)).sort((a, b) => D(a.date) - D(b.date))[0];
  const punchOpen = punch.filter((p) => p.status !== PST.done).length;
  const myOpen = user ? mytasks.filter((t) => (t.owner || "").toLowerCase() === uname(user) && !t.done).length : 0;

  const exportSCurvePNG = () => {
    const node = scCardRef.current || scWrapRef.current;
    exportNodeToPptPng(node, "S-Curve-4x3.png", {
      title: "S-Curve — " + PROJECT.name,
      subtitle: ACTS.map((a) => a.label).join(" · ") + " · Total · status per " + fmtDate(PROJECT.statusDate),
      footer: "Hari ini: " + seriesList().map(([k]) => k + " " + scToday.vals[k] + "%").join(" · "),
    }).then(() => log("Unduh PNG", "Kurva-S"));
  };

  useEffect(() => {
    if (!exportAct) return;
    const t = setTimeout(() => {
      const node = ganttRef.current;
      const isMaster = exportAct === "__master__";
      const fname = isMaster ? "Master-Schedule-4x3.png" : `Gantt-${actOf(exportAct).label}-4x3.png`;
      exportNodeToPptPng(node, fname, { padTop: 48, padBottom: 56, footer: PROJECT.name + " · " + PROJECT.sub })
        .then(() => { log("Unduh PNG", isMaster ? "Master Gantt 3 kegiatan" : `Gantt ${actOf(exportAct).label}`); setExportAct(null); })
        .catch(() => setExportAct(null));
    }, 120);
    return () => clearTimeout(t);
  }, [exportAct]);

  /* pulihkan sesi dari penyimpanan lokal (login mandiri, tanpa Supabase Auth) */
  useEffect(() => {
    if (!LIVE) { setBooting(false); return; }
    const ses = readSession();
    if (!ses || !ses.username) { setBooting(false); return; }
    sb.from("app_users").select("*").eq("project_key", PROJECT_KEY).eq("username", ses.username).limit(1)
      .then(({ data }) => {
        const row = data && data[0];
        if (row && row.active !== false) setUser(userFromRow(row));
        else clearSession();
        setBooting(false);
      })
      .catch(() => setBooting(false));
  }, []);

  /* muat data + tentukan role */
  useEffect(() => {
    if (!LIVE || !user || ready) return;
    let alive = true; setLoadErr("");
    loadAll().then((d) => {
      if (!alive) return;
      setActs(d.acts && d.acts.length ? d.acts : DEFAULT_ACTS); setAcosts(d.acosts || []);
      setTasks(d.tasks); setRab(d.rab); setTrans(d.trans); setTerms(d.terms); setDocs(d.docs); setPunch(d.punch);

  useSync("app_trans", trans, costToRow, ready);
  useSync("app_terms", terms, termToRow, ready);
  useSync("app_docs", docs, docToRow, ready);
  useSync("app_punch", punch, punchToRow, ready);
  useSync("app_users", users, userToRow, ready);
  useSync("app_mytasks", mytasks, myToRow, ready);
  useSync("app_logs", logs, logToRow, ready);
  useEffect(() => { if (!LIVE || !ready) return; const h = setTimeout(() => saveMetaFee(fee), 700); return () => clearTimeout(h); }, [fee, ready]);

  const loggedRef = useRef(false);
  useEffect(() => { if (user && ready && !loggedRef.current) { loggedRef.current = true; log("Masuk aplikasi", `${user.name} · ${user.role}`); } }, [user, ready]);

  if (booting) return <div className="boot">Memeriksa sesi…</div>;
  if (denied) return <div className="boot"><div style={{ maxWidth: 420 }}>
    <div style={{ color: C.red, fontWeight: 800, fontSize: 15, marginBottom: 8 }}>Akses ditolak</div>
    <div style={{ marginBottom: 16 }}>{denied}</div>
    <Btn kind="ghost" onClick={() => { setDenied(""); setUser(null); }}>Kembali ke halaman masuk</Btn>
  </div></div>;

  if (LIVE && !ready) return <div className="boot">{loadErr ? ("⚠ " + loadErr + " — muat ulang halaman.") : "Memuat data proyek…"}</div>;

  const isPM = user.role === ROLE.pm;

     Project Management : CRUD penuh semua fitur.
     Admin              : hanya update dokumen, bukti pembayaran, dan status Kanban. */

      ...(isPM ? [{ id: "acts", label: "Kelola Kegiatan", icon: "plus" }] : []),
    ] },
    { sec: "UMUM", items: [
      { id: "biaya", label: "Biaya", icon: "wallet" },
      { id: "punchlist", label: "Punchlist", icon: "clipboard", badge: punchOpen },
      { id: "arsip", label: "Arsip Dokumen", icon: "folder" },
    ] },
    { sec: "PERSONAL", items: [
      { id: "mytasks", label: "Tugas Saya", icon: "tasks", badge: myOpen },
      { id: "logs", label: "Log Aktivitas", icon: "history" },
      ...(isPM ? [{ id: "users", label: "Manajemen User", icon: "users" }] : []),

  const NAV = NAV_GROUPS.flatMap((g) => g.items);

        </span>

        <div style={{ padding: mini ? "16px 0" : 18, display: "flex", alignItems: "center", justifyContent: mini ? "center" : "flex-start", gap: 10, borderBottom: `1px solid ${C.line}` }}>
          <Logo size={mini ? 32 : 36} radius={10} />

          {isMobile && <button onClick={() => setSidebar(false)} style={iconBtn}><Ic name="x" size={18} /></button>}
        </div>
        {mini && <button onClick={() => setRail(false)} title="Perlebar menu" style={{ ...iconBtn, margin: "8px auto 0", border: `1px solid ${C.line}`, width: 34, height: 34 }}><Ic name="chevR" size={16} /></button>}
        <nav style={{ padding: mini ? 8 : 12, flex: 1 }}>
          {NAV_GROUPS.map((g, gi) => {
            if (!g.sec) return g.items.map(item);
            if (mini) return <div key={"s" + gi}><div style={{ height: 1, background: C.line, margin: "10px 8px" }} />{g.items.map(item)}</div>;
            const open = navOpen[g.sec] !== false || g.items.some((it) => it.id === page);
            return <div key={g.sec}>
              <button onClick={() => setNavOpen((s) => ({ ...s, [g.sec]: !(s[g.sec] !== false) }))}
                style={{ width: "100%", display: "flex", alignItems: "center", gap: 6, padding: "12px 10px 5px", background: "none", border: "none", cursor: "pointer", fontSize: 10, fontWeight: 800, color: "#9AAABC", letterSpacing: .6, textAlign: "left" }}>
                <span style={{ display: "grid", placeItems: "center", transition: ".15s", transform: open ? "none" : "rotate(-90deg)" }}><Ic name="chevD" size={12} /></span>
                {g.sec}
                {!open && g.items.some((it) => it.badge > 0) && <span style={{ marginLeft: "auto", width: 6, height: 6, borderRadius: 99, background: C.red }} />}
              </button>
              {open && g.items.map(item)}
            </div>;
          })}
        </nav>
        <div style={{ padding: mini ? 8 : 14, borderTop: `1px solid ${C.line}` }}>
          {!mini && <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <div style={{ width: 32, height: 32, borderRadius: 99, background: isPM ? C.blueSoft : C.greenSoft, color: isPM ? C.blue : C.green, display: "grid", placeItems: "center", fontSize: 13, fontWeight: 800, flexShrink: 0 }}>{(user.name || "?")[0].toUpperCase()}</div>
            <div style={{ minWidth: 0 }}><div style={{ fontSize: 12.5, fontWeight: 700, color: C.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{user.name}</div><div style={{ fontSize: 10.5, color: C.slate }}>{uname(user)} · {user.role}</div></div>
          </div>}
          {mini
            ? <div style={{ display: "grid", gap: 6 }}>
                {LIVE && <button onClick={() => setPwModal(true)} title="Ubah Password" style={{ ...iconBtn, border: `1px solid ${C.line}`, width: "100%", height: 34 }}><Ic name="key" size={15} /></button>}
                <button onClick={doLogout} title="Keluar" style={{ ...iconBtn, border: `1px solid ${C.line}`, width: "100%", height: 34, color: C.red }}><Ic name="logout" size={15} /></button>
              </div>
            : <>
                {LIVE && <button onClick={() => setPwModal(true)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 7, padding: 8, borderRadius: 9, border: `1px solid ${C.line}`, background: "#fff", color: C.slate, cursor: "pointer", fontSize: 12.5, fontWeight: 600, marginBottom: 7 }}><Ic name="key" size={14} /> Ubah Password</button>}
                <button onClick={doLogout} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 7, padding: 8, borderRadius: 9, border: `1px solid ${C.line}`, background: "#fff", color: C.slate, cursor: "pointer", fontSize: 12.5, fontWeight: 600 }}><Ic name="logout" size={14} /> Keluar</button>
              </>}
        </div>
      </aside>;
    })()}

    <main style={{ flex: 1, minWidth: 0, width: "100%" }}>
      <header style={{ background: "#fff", borderBottom: `1px solid ${C.line}`, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 20, gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
          <button onClick={() => { if (isMobile) setSidebar((v) => !v); else if (!sidebar) setSidebar(true); else setRail((v) => !v); }} title="Menu" style={{ ...iconBtn, border: `1px solid ${C.line}`, width: 36, height: 36, color: C.ink, flexShrink: 0 }}><Ic name="menu" size={18} /></button>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 16.5, fontWeight: 800, letterSpacing: -.3, color: C.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{cur.label}</div>
            <div style={{ fontSize: 12, color: C.slate, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{PROJECT.name}</div>
          </div>
        </div>
        <SyncBadge onOpen={() => setDiag(true)} />
      </header>

      <div className="wrap">
        {LIVE && syncSt.state === "error" && <div style={{ display: "flex", alignItems: "flex-start", gap: 9, background: "#FDECEF", border: `1px solid ${C.red}`, borderRadius: 12, padding: "10px 13px", marginBottom: 16, fontSize: 12.5, color: C.ink }}>
          <span style={{ color: C.red, flexShrink: 0 }}><Ic name="alert" size={16} /></span>
          <div style={{ minWidth: 0 }}><b>Perubahan gagal disimpan ke Supabase.</b> {syncSt.msg}
            <div style={{ marginTop: 6 }}><Btn size="sm" kind="ghost" onClick={() => setDiag(true)}>Buka Diagnostik</Btn></div></div>
        </div>}
        {!LIVE && <div style={{ display: "flex", alignItems: "flex-start", gap: 9, background: "#FCF3E2", border: `1px solid ${C.amber}`, borderRadius: 12, padding: "10px 13px", marginBottom: 16, fontSize: 12.5, color: C.ink }}>
          <span style={{ color: C.amber, flexShrink: 0 }}><Ic name="alert" size={16} /></span>
          <div><b>Mode DEMO — data tidak tersimpan.</b> Perubahan hanya ada di browser dan kembali ke data contoh saat halaman dimuat ulang. Isi SUPABASE_URL & SUPABASE_ANON_KEY di index.html untuk menyambung ke server.
            <div style={{ marginTop: 6 }}><Btn size="sm" kind="ghost" onClick={() => setDiag(true)}>Cek koneksi</Btn></div></div>
        </div>}
        {!isPM && <div style={{ display: "flex", alignItems: "center", gap: 9, background: C.blueSoft, border: `1px solid ${C.line}`, borderRadius: 12, padding: "9px 13px", marginBottom: 16, fontSize: 12.5, color: C.ink }}>
          <span style={{ color: C.blue, flexShrink: 0 }}><Ic name="alert" size={16} /></span>
          <span>Role <b>Admin</b>: dapat memperbarui <b>dokumen</b>, <b>bukti pembayaran</b>, dan <b>status Kanban</b>. Data lain hanya bisa dilihat.</span>
        </div>}
        {page === "dashboard" && <div className="g1">
          <div style={{ background: `linear-gradient(120deg,${C.blueSoft},${C.greenSoft})`, borderRadius: 20, padding: "22px 24px", border: `1px solid ${C.line}` }}>
            <div style={{ display: "inline-flex", alignItems: "center", gap: 7, background: "#fff", padding: "4px 11px", borderRadius: 99, fontSize: 11.5, fontWeight: 600, marginBottom: 14, color: C.ink, border: `1px solid ${C.line}` }}><span style={{ width: 7, height: 7, borderRadius: 99, background: C.green }} /> Status per {fmtDate(PROJECT.statusDate)}</div>
            <div style={{ fontSize: 24, fontWeight: 800, letterSpacing: -.6, color: C.ink }}>{PROJECT.name}</div>
            <div style={{ display: "flex", gap: 28, marginTop: 18, flexWrap: "wrap" }}>
              {[["Nilai Proyek", rpShort(proj), C.ink], ["Progres Keseluruhan", overall + "%", C.green],
                ...acts.map((a) => [a.label, rpShort(a.key === "konsultan" ? fee : a.key === "kontraktor" ? cTotal : a.key === "transisi" ? trTotal : sumCost(acosts.filter((r) => r.act === a.key))), a.color])
              ].map(([l, v, c], i) => <div key={i}><div style={{ fontSize: 11.5, color: C.slate, fontWeight: 600 }}>{l}</div><div style={{ fontSize: 21, fontWeight: 800, color: c, fontVariantNumeric: "tabular-nums", letterSpacing: -.5, marginTop: 2 }}>{v}</div></div>)}
            </div>
          </div>

          {(() => { const lt = tasks.filter((t) => !tasks.some((x) => x.parent === t.id)).filter(isLate);
            return lt.length > 0 ? <div style={{ display: "flex", alignItems: "flex-start", gap: 10, background: "#FDECEF", border: `1px solid ${C.red}`, borderRadius: 14, padding: "12px 15px" }}>
              <span style={{ color: C.red, flexShrink: 0, marginTop: 1 }}><Ic name="alert" size={18} /></span>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 13.5, fontWeight: 800, color: C.ink }}>{lt.length} pekerjaan terlambat</div>
                <div style={{ fontSize: 12, color: C.slate, marginTop: 3 }}>{ACTS.map((a) => { const n = lt.filter((t) => t.act === a.key).length; return n ? `${a.label}: ${n}` : null; }).filter(Boolean).join(" · ")}</div>
              </div>
            </div> : null; })()}
          <div className="g4">
            <Stat label="Total Aktivitas" value={tasks.length} sub={`${tasks.filter((t) => !t.parent).length} pekerjaan utama`} icon="calendar" color={C.ink} />
            <Stat label="Punchlist Aktif" value={punchOpen} sub={`${punch.length} total temuan`} icon="clipboard" color={C.amber} />
            <Stat label="Pembayaran Berikutnya" value={nextPay ? rpShort((nextPay.percent / 100) * fee) : "-"} sub={nextPay ? `${nextPay.desc} · ${fmtDate(nextPay.date)}` : "selesai"} icon="dollar" color={C.green} />
            <Stat label="Progres Keseluruhan" value={overall + "%"} sub="tertimbang durasi" icon="check" color={C.green} />
          </div>

          <Card>
            <CardHead icon="trending" title="Progres per Kegiatan" right={<span style={{ fontSize: 12.5, color: C.slate }}>klik untuk membuka</span>} />
            <div className="g3">
              {ACTS.map((a) => { const p = progressOf(tasks, a.key); const n = tasks.filter((t) => t.act === a.key).length; return (
                <button key={a.key} onClick={() => go("act:" + a.key)} style={{ textAlign: "left", border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, background: "#fff", cursor: "pointer" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 9 }}><span style={{ width: 28, height: 28, borderRadius: 8, background: a.soft, color: a.color, display: "grid", placeItems: "center" }}><Ic name={a.icon} size={15} /></span><span style={{ fontWeight: 700, fontSize: 14, color: C.ink }}>{a.label}</span><span style={{ marginLeft: "auto", fontWeight: 800, fontSize: 15, color: a.color, fontVariantNumeric: "tabular-nums" }}>{p}%</span></div>
                  <div style={{ marginTop: 10, height: 7, background: C.bg, borderRadius: 99, overflow: "hidden" }}><div style={{ width: `${p}%`, height: "100%", background: a.color }} /></div>
                  <div style={{ fontSize: 11.5, color: C.slate, marginTop: 7 }}>{n} aktivitas</div>
                </button>); })}
            </div>
          </Card>

          <Card>
            <CardHead icon="calendar" title="Master Schedule" right={
              <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                <button onClick={() => setMsSummary((v) => !v)} title="Tampilkan hanya 1 baris ringkasan per kegiatan"
                  style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "6px 11px", borderRadius: 9, border: `1px solid ${msSummary ? C.violet : C.line}`, background: msSummary ? C.violetSoft : "#fff", color: msSummary ? C.violet : C.slate, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                  <Ic name={msSummary ? "check" : "kanban"} size={14} /> Ringkas
                </button>
                <Btn kind="ghost" size="sm" onClick={() => setExportAct("__master__")} disabled={exportAct === "__master__"}>
                  <Ic name="download" size={15} /> {exportAct === "__master__" ? "Menyiapkan…" : "Unduh PNG"}
                </Btn>
              </div>} />
            <MasterGantt tasks={tasks} statusDate={PROJECT.statusDate} summaryOnly={msSummary} />
          </Card>

          <Card>
            <CardHead icon="trending" title="S-Curve" right={<div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}><div style={{ display: "flex", gap: 12, fontSize: 12, flexWrap: "wrap" }}>{seriesList().map(([l, c]) => <span key={l} style={{ display: "flex", alignItems: "center", gap: 6, color: C.slate, fontWeight: 600 }}><span style={{ width: 14, height: 3, background: c, borderRadius: 2 }} />{l}</span>)}</div><Btn kind="ghost" size="sm" onClick={exportSCurvePNG}><Ic name="download" size={15} /> Unduh PNG</Btn></div>} />
            <div ref={(el) => { scWrapRef.current = el; scCardRef.current = el; }} style={{ minWidth: 0, background: "#fff", padding: 4 }}><SCurveChart data={sc} today={scToday} /></div>
          </Card>

          <Card>
            <CardHead icon="dollar" color={C.green} title="Grafik Pembayaran per Kegiatan" right={<span style={{ fontSize: 12, color: C.slate }}>klik kegiatan untuk memfilter</span>} />
            <div style={{ fontSize: 12, color: C.slate, marginBottom: 10 }}>Nominal pembayaran per bulan (sumbu Y) terhadap waktu tagihan dibayar (sumbu X). Pilih satu kegiatan untuk melihat grafiknya sendiri.</div>
            <PaymentChart data={payData} acts={acts} />
          </Card>

          <Card>
            <CardHead icon="trending" title="S-Curve per Kegiatan" right={<span style={{ fontSize: 12, color: C.slate }}>klik grafik untuk memperbesar & screenshot</span>} />
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 16 }} className="scurve-grid">
              {acts.map((a) => <button key={a.key} onClick={() => setScZoom(a)} title={`Perbesar S-Curve ${a.label}`}
                style={{ border: `1px solid ${C.line}`, borderRadius: 14, padding: 16, minWidth: 0, background: "#fff", cursor: "pointer", textAlign: "left", transition: ".15s", display: "block" }}
                onMouseEnter={(e) => { e.currentTarget.style.boxShadow = "0 6px 18px rgba(16,42,67,.10)"; e.currentTarget.style.borderColor = a.color; }}
                onMouseLeave={(e) => { e.currentTarget.style.boxShadow = "none"; e.currentTarget.style.borderColor = C.line; }}>
                <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 10 }}>
                  <span style={{ width: 30, height: 30, borderRadius: 8, background: a.soft, color: a.color, display: "grid", placeItems: "center", flexShrink: 0 }}><Ic name={a.icon} size={16} /></span>
                  <span style={{ fontWeight: 700, fontSize: 14.5, color: C.ink, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.label}</span>
                  <span style={{ marginLeft: "auto", fontSize: 13, fontWeight: 800, color: a.color }}>{progressOf(tasks, a.key)}%</span>
                  <span style={{ color: C.slate, display: "grid", placeItems: "center", flexShrink: 0 }}><Ic name="expand" size={15} /></span>
                </div>
                <ActSCurveChart data={sCurveForAct(a.key, tasks)} color={a.color} soft={a.soft} />
              </button>)}
            </div>
          </Card>
        </div>}

        {actKey && <ActivityPage act={actKey} tasks={tasks} setTasks={setTasks} users={users} can={can} log={log} exporting={exportAct === actKey} onExport={() => setExportAct(actKey)} />}
        {page === "biaya" && <Costs rab={rab} setRab={setRab} trans={trans} setTrans={setTrans} acosts={acosts} setAcosts={setAcosts} fee={fee} setFee={setFee} terms={terms} setTerms={setTerms} can={can} log={log} />}
        {page === "punchlist" && <Punchlist punch={punch} setPunch={setPunch} tasks={tasks} can={can} log={log} />}
        {page === "arsip" && <Arsip docs={docs} setDocs={setDocs} log={log} />}
        {page === "mytasks" && <MyTasks mytasks={mytasks} setMytasks={setMytasks} tasks={tasks} setTasks={setTasks} users={users} user={user} isPM={isPM} log={log} />}
        {page === "logs" && <Logs logs={logs} />}
        {page === "acts" && isPM && <ActsPage acts={acts} setActs={setActs} tasks={tasks} setTasks={setTasks} acosts={acosts} setAcosts={setAcosts} log={log} onOpen={go} />}
        {page === "users" && isPM && <UsersPage users={users} setUsers={setUsers} mytasks={mytasks} me={user} log={log} />}
        {page === "users" && !isPM && <Card><Empty text="Halaman ini khusus role Project Management." /></Card>}
      </div>
    </main>

    {scZoom && <ActSCurveModal act={scZoom} tasks={tasks} onClose={() => setScZoom(null)} />}
    {diag && <DiagModal onClose={() => setDiag(false)} />}
    {pwModal && <PasswordModal me={user} onClose={() => setPwModal(false)} log={log} />}
    {exportAct && <div style={{ position: "fixed", left: -99999, top: 0, zIndex: -1 }}>
      <div ref={ganttRef} style={{ background: "#fff", padding: 18, display: "inline-block" }}>
        <div style={{ fontWeight: 800, fontSize: 16, color: C.ink, fontFamily: "Inter, sans-serif" }}>{PROJECT.name}</div>
        <div style={{ fontSize: 11.5, color: C.slate, marginBottom: 12, fontFamily: "Inter, sans-serif" }}>{exportAct === "__master__" ? `Master Schedule — Konsultan · Kontraktor · Transisi (pekerjaan induk) · status per ${fmtDate(PROJECT.statusDate)}` : `Gantt Chart — Kegiatan ${actOf(exportAct).label} · status per ${fmtDate(PROJECT.statusDate)}`}</div>
        {exportAct === "__master__"
          ? <MasterGantt tasks={tasks} statusDate={PROJECT.statusDate} summaryOnly={msSummary} forExport />
          : <Gantt tasks={tasks} act={exportAct} statusDate={PROJECT.statusDate} editable={false} forExport />}
      </div>
    </div>}
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
