  .boot { display:flex; align-items:center; justify-content:center; height:100vh; color:#6B7A8D; font-size:14px; padding:20px; text-align:center; }

  /* ---------- GRID RESPONSIF ---------- */
  .wrap { padding: 24px; max-width: 1320px; margin: 0 auto; width: 100%; }
  .g4 { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
  .g3 { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
  .g2 { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  .g1 { display:grid; grid-template-columns: minmax(0,1fr); gap: 18px; }
  .rowwrap { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media (max-width: 1000px) {
    .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .g3 { grid-template-columns: minmax(0,1fr); }
  }
  @media (max-width: 620px) {
    .wrap { padding: 14px; }
    .g4, .g2 { grid-template-columns: minmax(0,1fr); }
  }

  /* ---------- CETAK ---------- */
  @media print {
    @page { size: A4; margin: 14mm; }
    html, body { background:#fff !important; }
    body * { visibility: hidden !important; }
    .print-doc, .print-doc * { visibility: visible !important; }
    .print-doc { position: absolute !important; left:0 !important; top:0 !important; width:100% !important; height:auto !important; background:#fff !important; padding:0 !important; overflow:visible !important; }
    .print-paper { box-shadow:none !important; margin:0 !important; width:100% !important; max-width:none !important; border:none !important; border-radius:0 !important; padding:0 !important; }
    .no-print { display:none !important; }
    table { page-break-inside:auto; }
    tr { page-break-inside:avoid; page-break-after:auto; }
    thead { display: table-header-group; }
    img { page-break-inside:avoid; }
    .sign-block { page-break-inside:avoid; }

async function pushTable(table, rows, toRow) {
  const payload = rows.map((r, i) => ({ ...toRow(r), project_key: PROJECT_KEY, pos: i }));
  if (payload.length) {
    const { error } = await sb.from(table).upsert(payload);
    if (error) throw new Error(`${table}: gagal menyimpan — ${error.message}`);
  }
  /* hapus baris yang sudah tidak ada, dengan diff eksplisit (lebih aman daripada filter "not in") */
  const { data: cur, error: e1 } = await sb.from(table).select("id").eq("project_key", PROJECT_KEY);
  if (e1) throw new Error(`${table}: gagal membaca — ${e1.message}`);
  const keep = new Set(rows.map((r) => r.id));
  const gone = (cur || []).map((r) => r.id).filter((id) => !keep.has(id));
  if (gone.length) {
    const { error: e2 } = await sb.from(table).delete().eq("project_key", PROJECT_KEY).in("id", gone);
    if (e2) throw new Error(`${table}: gagal menghapus — ${e2.message}`);
  }
}

function useSync(table, rows, toRow, ready) {
  const skip = useRef(true);
  useEffect(() => {
    if (!LIVE) return;
    if (!ready) { skip.current = true; return; }   // reset saat logout / sebelum data termuat
    if (skip.current) { skip.current = false; return; } // lewati render pertama (hasil load)
    const h = setTimeout(() => {
      SYNC.set("saving");
      pushTable(table, rows, toRow)
        .then(() => { if (SYNC.state !== "error") SYNC.set("saved"); })
        .catch((e) => { console.error("sync " + table, e); SYNC.set("error", e.message || String(e)); });
    }, 700);
    return () => clearTimeout(h);
  }, [rows, ready]);
}

/* ===== S-CURVE ===== */
function periods() {
  const out = []; const add = (y, m) => { const last = new Date(y, m, 0).getDate(); out.push(D(`${y}-${String(m).padStart(2,"0")}-15`)); out.push(D(`${y}-${String(m).padStart(2,"0")}-${String(last).padStart(2,"0")}`)); };
  for (let m = 5; m <= 12; m++) add(2026, m); for (let m = 1; m <= 4; m++) add(2027, m); return out;
}
const frac = (s, f, d) => { const ds = D(s), df = D(f); if (d >= df) return 1; if (d < ds) return 0; return (days(ds, d) + 1) / (days(ds, df) + 1); };
const sumCost = (list) => list.reduce((a, r) => a + (Number(r.qty) || 0) * (Number(r.rate) || 0), 0);
function valsAt(rab, fee, terms, trans, d) {
  const cT = sumCost(rab), tT = sumCost(trans), proj = cT + fee + tT;
  const ce = rab.reduce((a, r) => a + (Number(r.qty) || 0) * (Number(r.rate) || 0) * frac(r.start, r.finish, d), 0);
  const te = trans.reduce((a, r) => a + (Number(r.qty) || 0) * (Number(r.rate) || 0) * frac(r.start, r.finish, d), 0);
  const ke = terms.filter((t) => D(t.date) <= d).reduce((a, t) => a + ((Number(t.percent) || 0) / 100) * fee, 0);
  return {
    Kontraktor: cT ? +(ce / cT * 100).toFixed(1) : 0,
    Konsultan: fee ? +(ke / fee * 100).toFixed(1) : 0,
    Transisi: tT ? +(te / tT * 100).toFixed(1) : 0,
    Total: proj ? +((ce + ke + te) / proj * 100).toFixed(1) : 0,
  };
}
function sCurve(rab, fee, terms, trans) {
  return periods().map((d) => ({ label: `${MON[d.getMonth()]} ${String(d.getDate()).padStart(2,"0")}`, ...valsAt(rab, fee, terms, trans, d) }));
}
function todayMarkerData(rab, fee, terms, trans) {
  const ps = periods(); const td = todayNoon(); const n = ps.length;
  let idx;
  if (td <= ps[0]) idx = 0;
  else if (td >= ps[n - 1]) idx = n - 1;
  else { idx = n - 1; for (let i = 0; i < n - 1; i++) { if (td >= ps[i] && td <= ps[i + 1]) { idx = i + (td - ps[i]) / (ps[i + 1] - ps[i]); break; } } }
  return { idx, n, vals: valsAt(rab, fee, terms, trans, td), label: `${td.getDate()} ${MON[td.getMonth()]}` };
}
const SERIES = [["Kontraktor", C.green], ["Konsultan", C.blue], ["Transisi", C.orange], ["Total", C.ink]];
function SCurveChart({ data, today }) {
  const W = 1080, H = 260, pad = { l: 34, r: 16, t: 14, b: 24 };

  const x = (i) => pad.l + (n <= 1 ? 0 : i * (iw / (n - 1)));
  const y = (v) => pad.t + ih - (v / 100) * ih;
  const path = (k) => data.map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(d[k]).toFixed(1)}`).join(" ");
  const tx = today ? x(today.idx) : null;
  const boxW = 122, boxH = 74;
  const rightSide = tx != null && tx > W - pad.r - boxW - 12;
  const boxX = tx == null ? 0 : Math.max(pad.l + 2, Math.min(W - pad.r - boxW, rightSide ? tx - boxW - 8 : tx + 8));
  const boxY = pad.t + 6;
  return (
    <div style={{ width: "100%", maxWidth: "100%", overflow: "hidden" }}>
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet" width="100%" style={{ display: "block", width: "100%", height: "auto", maxHeight: 320 }}>
        {[0, 25, 50, 75, 100].map((g) => (<g key={g}><line x1={pad.l} x2={W - pad.r} y1={y(g)} y2={y(g)} stroke={C.line} /><text x={pad.l - 6} y={y(g) + 3} textAnchor="end" fontSize="9" fill={C.slate}>{g}%</text></g>))}
        {data.map((d, i) => (i % 3 === 0 ? <text key={i} x={x(i)} y={H - 7} textAnchor="middle" fontSize="8.5" fill={C.slate}>{d.label}</text> : null))}
        <path d={path("Kontraktor")} fill="none" stroke={C.green} strokeWidth="2.2" />
        <path d={path("Konsultan")} fill="none" stroke={C.blue} strokeWidth="2.2" />
        <path d={path("Transisi")} fill="none" stroke={C.orange} strokeWidth="2.2" />
        <path d={path("Total")} fill="none" stroke={C.ink} strokeWidth="1.8" strokeDasharray="5 4" />
        {tx != null && <g>
          <line x1={tx} x2={tx} y1={pad.t} y2={pad.t + ih} stroke={C.amber} strokeWidth="1.6" strokeDasharray="4 3" />
          {SERIES.map(([k, col]) => <circle key={k} cx={tx} cy={y(today.vals[k])} r="3.2" fill={col} stroke="#fff" strokeWidth="1.3" />)}
          <rect x={boxX} y={boxY} width={boxW} height={boxH} rx="7" fill="#FFFFFF" stroke={C.amber} strokeWidth="1.2" />
          <text x={boxX + 8} y={boxY + 14} fontSize="9" fontWeight="700" fill={C.amber}>Hari ini · {today.label}</text>
          {SERIES.map(([k, col], i) => <text key={k} x={boxX + 8} y={boxY + 27 + i * 11} fontSize="9.2" fontWeight="700" fill={col}>{k} {today.vals[k]}%</text>)}
        </g>}
      </svg>
    </div>
  );
}

/* ===== HIRARKI TUGAS ===== */
function childrenOf(tasks, id) { return tasks.filter((t) => t.parent === id); }
function rollup(t, kids) {
  if (!kids.length) return t;
  let mn = D(kids[0].start), mx = D(kids[0].finish);
  kids.forEach((c) => { const s = D(c.start), f = D(c.finish); if (s < mn) mn = s; if (f > mx) mx = f; });
  const act = kids.filter((c) => c.status !== STATUS.cancel);
  let tot = 0, dn = 0;
  act.forEach((c) => { const d = days(D(c.start), D(c.finish)) + 1; tot += d; dn += d * (Number(c.percent) || 0); });
  const pct = tot ? Math.round(dn / tot) : 0;
  const st = act.length === 0 ? STATUS.cancel : stOf(pct);
  return { ...t, start: iso(mn), finish: iso(mx), percent: pct, status: st };
}
/* daftar baris Gantt (pekerjaan + sub pekerjaan) untuk 1 kegiatan */
function buildRows(tasks, act, collapsed, all) {
  const list = tasks.filter((t) => t.act === act);
  const out = [];
  list.filter((t) => !t.parent).forEach((p) => {
    const kids = list.filter((k) => k.parent === p.id);
    const parent = rollup(p, kids);
    out.push({ ...parent, level: 0, kids: kids.length });
    if (all || !collapsed[p.id]) kids.forEach((k) => out.push({ ...k, level: 1, kids: 0 }));
  });
  return out;
}
/* progres keseluruhan (tertimbang durasi, hanya daun) */
function progressOf(tasks, act) {
  const list = tasks.filter((t) => (!act || t.act === act));
  const leaves = list.filter((t) => !list.some((x) => x.parent === t.id) && t.status !== STATUS.cancel);
  let tot = 0, dn = 0;
  leaves.forEach((t) => { const d = days(D(t.start), D(t.finish)) + 1; tot += d; dn += d * (Number(t.percent) || 0); });
  return tot ? Math.round(dn / tot) : 0;
}

/* ===== GANTT (sumbu: Bulan + Minggu ke-, garis hari ini, tooltip tanggal) ===== */
function Gantt({ tasks, act, statusDate, editable, onChange, onEdit, onDelete, onAddSub, forExport }) {
  const [drag, setDrag] = useState(null);
  const [collapsed, setCollapsed] = useState({});
  const [tip, setTip] = useState(null);
  const w = useWinW();
  const compact = w < 760;
  const wpx = forExport ? 20 : (compact ? 24 : 30);      // lebar 1 minggu (px)
  const px = wpx / 7;                                     // lebar 1 hari
  const rh = forExport ? 26 : 42, hMon = forExport ? 18 : 22, hWk = forExport ? 16 : 20;
  const hh = hMon + hWk;
  const leftW = forExport ? 240 : (compact ? 186 : (editable ? 392 : 286));
  const rows = useMemo(() => buildRows(tasks, act, collapsed, forExport), [tasks, act, collapsed, forExport]);

  /* rentang selalu mencakup HARI INI + tanggal status, supaya garis penanda
     tampil di semua kegiatan (bukan cuma yang jadwalnya sedang berjalan) */
  const range = useMemo(() => {
    let mn = null, mx = null;
    rows.forEach((t) => { const s = D(t.start), f = D(t.finish); if (!mn || s < mn) mn = s; if (!mx || f > mx) mx = f; });
    if (!mn) { mn = D("2026-05-01"); mx = D("2027-04-30"); }
    const marks = [todayNoon(), D(statusDate)];
    marks.forEach((d) => { if (d < mn) mn = d; if (d > mx) mx = d; });
    return { min: mondayOf(addDays(mn, -7)), max: addDays(mondayOf(addDays(mx, 7)), 6) };
  }, [rows, statusDate]);

  const totalDays = days(range.min, range.max) + 1;
  const W = totalDays * px;
  const xOf = (s) => days(range.min, D(s)) * px;
  const wOf = (s, f) => (days(D(s), D(f)) + 1) * px;

  const weeks = useMemo(() => {
    const out = []; let c = new Date(range.min);
    while (c <= range.max) { out.push({ start: new Date(c), left: days(range.min, c) * px, wk: isoWeek(c), yr: isoWeekYear(c) }); c = addDays(c, 7); }
    return out;
  }, [range, px]);
  const months = useMemo(() => {
    const a = []; let c = new Date(range.min.getFullYear(), range.min.getMonth(), 1);
    while (c <= range.max) {
      const s = c < range.min ? range.min : c;
      const nx = new Date(c.getFullYear(), c.getMonth() + 1, 1);
      const e = nx > range.max ? range.max : addDays(nx, -1);
      a.push({ label: `${MON[c.getMonth()]} ${String(c.getFullYear()).slice(2)}`, left: days(range.min, s) * px, width: (days(s, e) + 1) * px });
      c = nx;
    }
    return a;
  }, [range, px]);

  useEffect(() => {
    if (!drag) return;
    const move = (e) => { const dd = Math.round((e.clientX - drag.startX) / px); const s0 = D(drag.start), f0 = D(drag.finish); if (drag.mode === "move") onChange(drag.id, { start: iso(addDays(s0, dd)), finish: iso(addDays(f0, dd)) }); else { const nf = addDays(f0, dd); if (days(s0, nf) >= 0) onChange(drag.id, { finish: iso(nf) }); } };
    const up = () => setDrag(null);
    window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    return () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  }, [drag, onChange, px]);

  const A2 = actOf(act);
  const todayX = xOf(iso(todayNoon()));
  const statusX = xOf(statusDate);
  const showStatus = iso(D(statusDate)) !== iso(todayNoon());
  const bodyH = rows.length * rh;
  const outer = forExport ? { width: leftW + W } : {};
  const wkText = (k) => `Minggu ke-${k.wk} (${k.yr}) · ${fmtDate(iso(k.start))} – ${fmtDate(iso(addDays(k.start, 6)))}`;

  if (!rows.length) return <Card><Empty text="Belum ada pekerjaan pada kegiatan ini. Klik “Tambah Pekerjaan”." /></Card>;

  return <div>
    <div className={forExport ? "" : "scrollx"} style={{ borderRadius: 14, border: `1px solid ${C.line}`, background: "#fff", position: "relative" }}>
      <div style={{ display: "flex", minWidth: leftW + W, ...outer }}>
        {/* --- kolom kiri --- */}
        <div style={{ width: leftW, flexShrink: 0, borderRight: `1px solid ${C.line}`, position: forExport ? "static" : "sticky", left: 0, background: "#fff", zIndex: 3 }}>
          <div style={{ height: hh, display: "flex", alignItems: "center", padding: "0 12px", fontSize: 11, fontWeight: 700, color: C.slate, borderBottom: `1px solid ${C.line}`, background: C.bg }}>PEKERJAAN / SUB PEKERJAAN</div>
          {rows.map((t) => { const m = SMETA[t.status] || SMETA[STATUS.todo]; return (
            <div key={t.id} style={{ height: rh, display: "flex", alignItems: "center", gap: 6, padding: `0 10px 0 ${10 + t.level * 16}px`, borderBottom: `1px solid ${C.line}`, background: t.level === 0 ? "#FCFDFE" : "#fff" }}>
              {t.kids > 0 && !forExport ? <button onClick={() => setCollapsed((s) => ({ ...s, [t.id]: !s[t.id] }))} title={collapsed[t.id] ? "Buka" : "Tutup"} style={{ ...iconBtn, padding: 2, transform: collapsed[t.id] ? "rotate(-90deg)" : "none", transition: ".15s" }}><Ic name="chevD" size={14} /></button> : <span style={{ width: t.level === 0 ? 18 : 0 }} />}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: forExport ? 11 : (compact ? 12 : 13), fontWeight: t.level === 0 ? 700 : 500, color: t.status === STATUS.cancel ? C.slate : C.ink, textDecoration: t.status === STATUS.cancel ? "line-through" : "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.name}</div>
                {!compact && <div style={{ fontSize: 10.5, color: C.slate }}>{fmtDate(t.start)} → {fmtDate(t.finish)}{t.kids > 0 ? ` · ${t.kids} sub` : ""}</div>}
              </div>
              <span style={{ width: 7, height: 7, borderRadius: 99, background: m.bar, flexShrink: 0 }} title={t.status} />
              <span style={{ fontSize: 11.5, fontWeight: 700, color: t.percent >= 100 ? C.green : C.slate, fontVariantNumeric: "tabular-nums", minWidth: 30, textAlign: "right" }}>{t.percent}%</span>
              {editable && !forExport && <div style={{ display: "flex", gap: 1 }}>
                {t.level === 0 && <button title="Tambah sub pekerjaan" onClick={() => onAddSub(t)} style={{ ...iconBtn, color: C.blue }}><Ic name="plus" size={13} /></button>}
                <button title="Edit" onClick={() => onEdit(t)} style={iconBtn}><Ic name="pencil" size={13} /></button>
                <button title="Hapus" onClick={() => onDelete(t.id)} style={{ ...iconBtn, color: C.red }}><Ic name="trash" size={13} /></button>
              </div>}
            </div>); })}
        </div>

        {/* --- timeline --- */}
        <div style={{ position: "relative", width: W, flexShrink: 0 }} onMouseLeave={() => setTip(null)}>
          {/* header: baris bulan */}
          <div style={{ height: hMon, background: C.bg, position: "relative", borderBottom: `1px solid ${C.line}` }}>
            {months.map((m, i) => <div key={i} style={{ position: "absolute", left: m.left, width: m.width, top: 0, height: hMon, borderRight: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: C.ink, letterSpacing: .2, overflow: "hidden", whiteSpace: "nowrap" }}>{m.width > 40 ? m.label : ""}</div>)}
          </div>
          {/* header: baris minggu ke- */}
          <div style={{ height: hWk, background: "#fff", position: "relative", borderBottom: `1px solid ${C.line}` }}>
            {weeks.map((k, i) => <div key={i}
              onMouseEnter={() => !forExport && setTip({ left: k.left + wpx / 2, text: wkText(k) })}
              title={wkText(k)}
              style={{ position: "absolute", left: k.left, width: wpx, top: 0, height: hWk, borderRight: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 700, color: C.slate, cursor: forExport ? "default" : "help" }}>{k.wk}</div>)}
          </div>
          {/* grid mingguan + penanda */}
          <div style={{ position: "absolute", left: 0, top: hh, width: W, height: bodyH, pointerEvents: "none", zIndex: 0 }}>
            {weeks.map((k, i) => <div key={i} style={{ position: "absolute", left: k.left, top: 0, bottom: 0, width: 1, background: C.line }} />)}
          </div>
          {showStatus && <div title={`Tanggal status · ${fmtDate(statusDate)}`} style={{ position: "absolute", left: statusX, top: hh, height: bodyH, width: 2, background: C.blue, opacity: .35, zIndex: 1 }} />}
          <div title={`Hari ini · ${tglPanjang()}`} style={{ position: "absolute", left: todayX, top: hMon, height: bodyH + hWk, width: 2, background: C.amber, zIndex: 2 }} />
          <div style={{ position: "absolute", left: todayX, top: hMon + 1, transform: "translateX(-50%)", background: C.amber, color: "#fff", fontSize: 8.5, fontWeight: 800, borderRadius: 4, padding: "1px 5px", zIndex: 3, whiteSpace: "nowrap", pointerEvents: "none" }}>HARI INI</div>

          {/* baris bar */}
          {rows.map((t) => {
            const isP = t.kids > 0;
            const m = SMETA[t.status] || SMETA[STATUS.todo];
            const col = isP ? A2.color : m.bar;
            const canceled = t.status === STATUS.cancel;
            return <div key={t.id} style={{ height: rh, borderBottom: `1px solid ${C.line}`, position: "relative", background: t.level === 0 ? "#FCFDFE" : "#fff" }}>
              <div
                onMouseDown={(e) => { if (!editable || forExport || isP) return; setDrag({ id: t.id, mode: "move", startX: e.clientX, start: t.start, finish: t.finish }); }}
                title={`${t.name} · ${fmtDate(t.start)} → ${fmtDate(t.finish)} · ${t.percent}% · ${t.status}`}
                style={{ position: "absolute", left: xOf(t.start), width: Math.max(6, wOf(t.start, t.finish)), top: isP ? (rh - 12) / 2 : (rh - 18) / 2, height: isP ? 12 : 18, borderRadius: isP ? 4 : 6, background: canceled ? "#FDECEF" : col + (isP ? "" : "26"), border: `1px ${canceled ? "dashed" : "solid"} ${col}`, cursor: editable && !isP && !forExport ? "grab" : "default", overflow: "hidden", zIndex: 1, opacity: canceled ? .75 : 1 }}>
                {!isP && !canceled && <div style={{ width: `${Math.min(100, t.percent)}%`, height: "100%", background: col, opacity: .85 }} />}
              </div>
              {editable && !forExport && !isP && <div onMouseDown={(e) => { e.stopPropagation(); setDrag({ id: t.id, mode: "resize", startX: e.clientX, start: t.start, finish: t.finish }); }} style={{ position: "absolute", left: xOf(t.start) + Math.max(6, wOf(t.start, t.finish)) - 5, top: (rh - 18) / 2, width: 10, height: 18, cursor: "ew-resize", zIndex: 2 }} />}
            </div>;
          })}

          {/* tooltip tanggal minggu */}
          {tip && !forExport && <div style={{ position: "absolute", left: tip.left, top: hh + 4, transform: "translateX(-50%)", background: C.ink, color: "#fff", fontSize: 10.5, fontWeight: 600, padding: "5px 9px", borderRadius: 7, whiteSpace: "nowrap", pointerEvents: "none", zIndex: 9, boxShadow: "0 6px 18px rgba(19,41,61,.28)" }}>{tip.text}</div>}
        </div>
      </div>
    </div>
    {/* legenda seragam untuk semua kegiatan */}
    {!forExport && <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 10, fontSize: 11.5, color: C.slate, alignItems: "center" }}>
      <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 14, height: 8, borderRadius: 3, background: A2.color }} /> Pekerjaan utama</span>
      {KCOLS.map((s) => <span key={s} style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 14, height: 8, borderRadius: 3, background: SMETA[s].bar + "40", border: `1px ${s === STATUS.cancel ? "dashed" : "solid"} ${SMETA[s].bar}` }} /> {s}</span>)}
      <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 2, height: 12, background: C.amber }} /> Hari ini</span>
      <span style={{ marginLeft: "auto", fontSize: 11 }}>Angka pada sumbu = minggu ke- dalam tahun · arahkan kursor untuk melihat tanggal</span>
    </div>}
  </div>;
}

/* ===== TASK MODAL ===== */
function TaskModal({ task, act, tasks, onClose, onSave }) {
  const parents = tasks.filter((t) => t.act === act && !t.parent && (!task || t.id !== task.id));
  const hasKids = task ? tasks.some((t) => t.parent === task.id) : false;
  const [f, setF] = useState(task || { name: "", act, parent: null, start: PROJECT.statusDate, finish: PROJECT.statusDate, percent: 0, status: STATUS.todo, note: "", assignees: [] });
  const set = (k, v) => setF((s) => ({ ...s, [k]: v }));
  const save = () => { if (!f.name.trim()) return; const pct = Math.max(0, Math.min(100, Number(f.percent) || 0)); onSave({ ...f, act, percent: pct, status: f.status === STATUS.cancel ? STATUS.cancel : stOf(pct) }); };
  return <Modal title={task ? "Edit Pekerjaan" : "Tambah Pekerjaan"} onClose={onClose} width={520}>
    <Field label="Nama pekerjaan"><Input value={f.name} onChange={(e) => set("name", e.target.value)} placeholder="mis. Proses Tender / Market Survei" /></Field>
    <div style={{ marginTop: 12 }}><Field label="Induk (kosongkan bila ini Pekerjaan utama)">
      <Sel value={f.parent || ""} onChange={(e) => set("parent", e.target.value || null)} disabled={hasKids}>
        <option value="">— Pekerjaan utama —</option>
        {parents.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
      </Sel>
    </Field>{hasKids && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 4 }}>Pekerjaan ini punya sub pekerjaan, jadi induknya tidak bisa diubah.</div>}</div>
    <div className="g2" style={{ marginTop: 12 }}>
      <Field label="Mulai"><Input type="date" value={f.start} onChange={(e) => set("start", e.target.value)} disabled={hasKids} /></Field>
      <Field label="Selesai"><Input type="date" value={f.finish} onChange={(e) => set("finish", e.target.value)} disabled={hasKids} /></Field>
    </div>
    <div style={{ marginTop: 12 }}><Field label={`Progres: ${hasKids ? "otomatis dari sub pekerjaan" : (f.percent + "%")}`}>
      <Input type="range" min="0" max="100" step="5" value={f.percent} onChange={(e) => set("percent", Number(e.target.value))} disabled={hasKids} style={{ padding: 0, border: "none" }} />
    </Field></div>
    <div style={{ marginTop: 12 }}><Field label="Status">
      <Sel value={f.status} onChange={(e) => set("status", e.target.value)} disabled={hasKids}>{KCOLS.map((s) => <option key={s}>{s}</option>)}</Sel>
    </Field><div style={{ fontSize: 11.5, color: C.slate, marginTop: 4 }}>Status mengikuti progres kecuali dipilih “{STATUS.cancel}”.</div></div>
    <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 18 }}><Btn kind="ghost" onClick={onClose}>Batal</Btn><Btn onClick={save}>{task ? "Simpan" : "Tambah"}</Btn></div>
  </Modal>;
}

/* ===== KANBAN ===== */
function Avatars({ emails, users, size = 22 }) {
  const list = (emails || []).slice(0, 4);
  if (!list.length) return <span style={{ fontSize: 10.5, color: C.slate }}>belum ditugaskan</span>;
  return <div style={{ display: "flex", alignItems: "center" }}>
    {list.map((em, i) => {
      const u = users.find((x) => (x.email || "").toLowerCase() === (em || "").toLowerCase());
      const nm = u ? u.name : em;
      const pm = u && u.role === ROLE.pm;
      return <span key={em} title={nm + (u ? ` · ${u.role}` : "")} style={{ width: size, height: size, borderRadius: 99, background: pm ? C.blueSoft : C.greenSoft, color: pm ? C.blue : C.green, border: "2px solid #fff", marginLeft: i ? -7 : 0, display: "grid", placeItems: "center", fontSize: size * .45, fontWeight: 800, flexShrink: 0 }}>{(nm || "?")[0].toUpperCase()}</span>;
    })}
    {(emails || []).length > 4 && <span style={{ fontSize: 10.5, color: C.slate, marginLeft: 5 }}>+{emails.length - 4}</span>}
  </div>;
}

function Kanban({ tasks, act, users, onMove, onView, onNote, onAdd, canMove, canNote }) {
  const list = tasks.filter((t) => t.act === act);
  const leaves = list.filter((t) => !list.some((x) => x.parent === t.id));
  const idx = new Map(leaves.map((t, i) => [t.id, i]));
  const nameOfParent = (t) => { const p = list.find((x) => x.id === t.parent); return p ? p.name : null; };
  const [over, setOver] = useState(null);
  const A2 = actOf(act);
  return <div className="g4">
    {KCOLS.map((col) => {
      const items = leaves.filter((t) => t.status === col);
      const m = SMETA[col];
      return <div key={col}
        onDragOver={(e) => { if (!canMove) return; e.preventDefault(); setOver(col); }}
        onDragLeave={() => setOver((o) => (o === col ? null : o))}
        onDrop={(e) => { if (!canMove) return; e.preventDefault(); const id = e.dataTransfer.getData("text/plain"); setOver(null); if (id) onMove(id, col); }}
        style={{ background: over === col ? m.bg : "#FBFCFE", border: `1px ${over === col ? "solid" : "dashed"} ${over === col ? m.color : C.line}`, borderRadius: 16, padding: 12, minHeight: 200, transition: ".15s", minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, padding: "0 2px" }}>
          <span style={{ width: 4, height: 15, borderRadius: 3, background: m.color, flexShrink: 0 }} />
          <span style={{ fontWeight: 700, fontSize: 13, color: C.ink, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{col}</span>
          <span style={{ fontSize: 11, fontWeight: 700, color: m.color, background: m.bg, borderRadius: 6, padding: "1px 7px" }}>{items.length}</span>
          {canNote && <button title="Tambah pekerjaan" onClick={onAdd} style={{ ...iconBtn, marginLeft: "auto", padding: 3 }}><Ic name="plus" size={15} /></button>}
        </div>
        <div style={{ display: "grid", gap: 9 }}>
          {items.map((t) => {
            const ci = KCOLS.indexOf(t.status);
            const canceled = t.status === STATUS.cancel;
            const late = !canceled && t.percent < 100 && D(t.finish) < todayNoon();
            return <div key={t.id} draggable={canMove} onDragStart={(e) => e.dataTransfer.setData("text/plain", t.id)}
              onDoubleClick={() => onView(t)}
              style={{ border: `1px solid ${C.line}`, borderRadius: 13, padding: "11px 12px", background: "#fff", cursor: canMove ? "grab" : "default", boxShadow: "0 1px 3px rgba(16,42,67,.06)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
                <PrioChip prio={t.prio || "Sedang"} />
                <Chip text={A2.label} c={A2.color} b={A2.soft} />
                {late && <Chip text="Terlambat" c={C.red} b="#FDECEF" />}
                <span style={{ marginLeft: "auto", fontSize: 10.5, fontWeight: 700, color: "#9AAABC", letterSpacing: .3 }}>{codeOf(t, idx.get(t.id) || 0)}</span>
              </div>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 6 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 700, color: canceled ? C.slate : C.ink, textDecoration: canceled ? "line-through" : "none", lineHeight: 1.35 }}>{t.name}</div>
                  <div style={{ fontSize: 11.5, color: C.slate, marginTop: 2 }}>{nameOfParent(t) ? "↳ " + nameOfParent(t) : "Pekerjaan utama"}</div>
                </div>
                <div style={{ display: "flex", gap: 1, flexShrink: 0 }}>
                  <button title="Lihat detail" onClick={() => onView(t)} style={{ ...iconBtn, color: C.violet, padding: 4 }}><Ic name="eye" size={14} /></button>
                  {canNote && <button title="Catatan & penugasan" onClick={() => onNote(t)} style={{ ...iconBtn, padding: 4 }}><Ic name="pencil" size={13} /></button>}
                </div>
              </div>
              {t.note && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 8, background: C.bg, borderRadius: 8, padding: "6px 8px", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{t.note}</div>}
              <div style={{ marginTop: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 }}>
                  <span style={{ fontSize: 10.5, color: C.slate, fontWeight: 600, display: "inline-flex", alignItems: "center", gap: 4 }}><Ic name="trending" size={11} /> Progres</span>
                  <span style={{ fontSize: 10.5, fontWeight: 800, color: canceled ? C.red : C.ink }}>{canceled ? "batal" : t.percent + "%"}</span>
                </div>
                <Bar pct={canceled ? 0 : t.percent} color={m.bar} />
              </div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginTop: 10, paddingTop: 9, borderTop: `1px solid ${C.line}` }}>
                <Avatars emails={t.assignees} users={users} size={21} />
                <span style={{ fontSize: 10.5, color: late ? C.red : C.slate, fontWeight: 600, display: "inline-flex", alignItems: "center", gap: 4, whiteSpace: "nowrap" }}><Ic name="clock" size={11} /> {fmtDate(t.finish)}</span>
              </div>
              {canMove && <div style={{ display: "flex", gap: 6, marginTop: 9 }}>
                <Btn kind="ghost" size="sm" onClick={() => ci > 0 && onMove(t.id, KCOLS[ci - 1])} disabled={ci === 0} style={{ flex: 1, justifyContent: "center", opacity: ci === 0 ? .4 : 1, padding: "4px 8px" }}><Ic name="chevL" size={12} /></Btn>
                <Btn kind="ghost" size="sm" onClick={() => ci < KCOLS.length - 1 && onMove(t.id, KCOLS[ci + 1])} disabled={ci === KCOLS.length - 1} style={{ flex: 1, justifyContent: "center", opacity: ci === KCOLS.length - 1 ? .4 : 1, padding: "4px 8px" }}><Ic name="chevR" size={12} /></Btn>
              </div>}
            </div>;
          })}
          {items.length === 0 && <div style={{ fontSize: 11.5, color: "#A9B7C6", textAlign: "center", padding: "18px 0" }}>Tidak ada pekerjaan</div>}
          {canNote && <AddNew onClick={onAdd} label="Tambah pekerjaan" />}
        </div>
      </div>;
    })}
  </div>;
}

/* ===== KALENDER MINGGUAN ===== */
const DAYS_ID = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu", "Minggu"];
function WeekCalendar({ tasks, act, users, onView }) {
  const [off, setOff] = useState(0);
  const w = useWinW();
  const narrow = w < 900;
  const base = mondayOf(todayNoon());
  const start = addDays(base, off * 7);
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const list = tasks.filter((t) => t.act === act);
  const leaves = list.filter((t) => !list.some((x) => x.parent === t.id));
  const idx = new Map(leaves.map((t, i) => [t.id, i]));
  const A2 = actOf(act);
  const todayISO = iso(todayNoon());
  const onDay = (d) => leaves.filter((t) => D(t.start) <= d && D(t.finish) >= d);
  const weekTasks = leaves.filter((t) => D(t.finish) >= start && D(t.start) <= days[6]);
  return <div>
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <Btn kind="ghost" size="sm" onClick={() => setOff((x) => x - 1)}><Ic name="chevL" size={14} /></Btn>
        <Btn kind="ghost" size="sm" onClick={() => setOff(0)}>Minggu ini</Btn>
        <Btn kind="ghost" size="sm" onClick={() => setOff((x) => x + 1)}><Ic name="chevR" size={14} /></Btn>
      </div>
      <div style={{ fontSize: 13, fontWeight: 700, color: C.ink }}>
        Minggu ke-{isoWeek(start)} · {fmtDate(iso(start))} – {fmtDate(iso(days[6]))}
        <span style={{ fontWeight: 500, color: C.slate, marginLeft: 8, fontSize: 12 }}>{weekTasks.length} pekerjaan aktif</span>
      </div>
    </div>
    <div className="scrollx" style={{ border: `1px solid ${C.line}`, borderRadius: 14, background: "#fff" }}>
      <div style={{ display: "grid", gridTemplateColumns: `repeat(7, minmax(${narrow ? 150 : 120}px, 1fr))`, minWidth: narrow ? 1050 : 780 }}>
        {days.map((d, i) => {
          const isToday = iso(d) === todayISO;
          return <div key={i} style={{ borderRight: i < 6 ? `1px solid ${C.line}` : "none", background: isToday ? C.violetSoft : "#FBFCFE", padding: "10px 8px", textAlign: "center", borderBottom: `1px solid ${C.line}` }}>
            <div style={{ fontSize: 11.5, fontWeight: 700, color: isToday ? C.violet : C.slate }}>{DAYS_ID[i]}</div>
            <div style={{ fontSize: 16, fontWeight: 800, color: isToday ? C.violet : C.ink, marginTop: 2 }}>{d.getDate()}</div>
            <div style={{ fontSize: 10.5, color: C.slate }}>{MON[d.getMonth()]} {String(d.getFullYear()).slice(2)}</div>
            {isToday && <div style={{ marginTop: 6, fontSize: 9.5, fontWeight: 800, color: "#fff", background: C.violet, borderRadius: 99, padding: "2px 8px", display: "inline-block" }}>HARI INI</div>}
          </div>;
        })}
        {days.map((d, i) => {
          const items = onDay(d);
          const isToday = iso(d) === todayISO;
          return <div key={"c" + i} style={{ borderRight: i < 6 ? `1px solid ${C.line}` : "none", background: isToday ? "#FCFCFF" : "#fff", padding: 8, minHeight: 330, display: "grid", gap: 7, alignContent: "start" }}>
            {items.map((t) => {
              const m = SMETA[t.status] || SMETA[STATUS.todo];
              const isStart = iso(D(t.start)) === iso(d);
              const isEnd = iso(D(t.finish)) === iso(d);
              return <button key={t.id} onClick={() => onView(t)} title={`${t.name} · ${fmtDate(t.start)} → ${fmtDate(t.finish)} · ${t.percent}%`}
                style={{ textAlign: "left", border: `1px solid ${C.line}`, borderLeft: `3px solid ${m.bar}`, borderRadius: 9, background: t.status === STATUS.cancel ? "#FFF7F8" : "#fff", padding: "7px 8px", cursor: "pointer", boxShadow: "0 1px 2px rgba(16,42,67,.05)" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 4, flexWrap: "wrap" }}>
                  <span style={{ width: 6, height: 6, borderRadius: 99, background: m.bar, flexShrink: 0 }} />
                  <span style={{ fontSize: 9.5, fontWeight: 800, color: "#9AAABC" }}>{codeOf(t, idx.get(t.id) || 0)}</span>
                  {isStart && <Chip text="Mulai" c={C.green} b={C.greenSoft} />}
                  {isEnd && <Chip text="Selesai" c={C.violet} b={C.violetSoft} />}
                </div>
                <div style={{ fontSize: 11.5, fontWeight: 700, color: t.status === STATUS.cancel ? C.slate : C.ink, textDecoration: t.status === STATUS.cancel ? "line-through" : "none", lineHeight: 1.3 }}>{t.name}</div>
                <div style={{ marginTop: 6 }}><Bar pct={t.percent} color={m.bar} /></div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 6, gap: 4 }}>
                  <Avatars emails={t.assignees} users={users} size={17} />
                  <span style={{ fontSize: 9.5, fontWeight: 700, color: C.slate }}>{t.percent}%</span>
                </div>
              </button>;
            })}
            {items.length === 0 && <div style={{ fontSize: 11, color: "#B8C4D2", textAlign: "center", paddingTop: 16 }}>—</div>}
          </div>;
        })}
      </div>
    </div>
    <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 10, fontSize: 11.5, color: C.slate, alignItems: "center" }}>
      {KCOLS.map((st) => <span key={st} style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 10, height: 4, borderRadius: 2, background: SMETA[st].bar }} /> {st}</span>)}
      <span style={{ marginLeft: "auto" }}>Pekerjaan tampil di setiap hari sepanjang rentang jadwalnya · klik kartu untuk detail</span>
    </div>
  </div>;
}

/* ===== BUKTI PEMBAYARAN (PDF) ===== */
function ProofCell({ row, onSet, log, label }) {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const pick = async (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = ""; if (!file) return;
    setErr("");
    if (file.type !== "application/pdf") { setErr("Harus PDF"); return; }
    if (file.size > 40 * 1048576) { setErr("Maks 40 MB"); return; }
    setBusy(true);
    try { const url = await uploadFile(file, "bukti"); onSet({ proofUrl: url, proofName: file.name }); log && log("Unggah bukti bayar", `${label}: ${file.name}`); }
    catch (x) { setErr("Gagal unggah"); }
    setBusy(false);
  };
  if (row.proofUrl) return <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
    <a href={row.proofUrl} target="_blank" rel="noreferrer" title={row.proofName || "Bukti pembayaran"} style={{ ...iconBtn, color: C.green, textDecoration: "none" }}><Ic name="file" size={15} /></a>
    <button title="Hapus bukti" onClick={() => { onSet({ proofUrl: null, proofName: null }); log && log("Hapus bukti bayar", label); }} style={{ ...iconBtn, color: C.red, padding: 3 }}><Ic name="x" size={12} /></button>
  </div>;
  return <div>
    <label title="Unggah bukti pembayaran (PDF)" style={{ ...iconBtn, color: busy ? C.slate : C.blue, cursor: busy ? "wait" : "pointer" }}>
      <Ic name="upload" size={15} />
      <input type="file" accept="application/pdf" onChange={pick} disabled={busy} style={{ display: "none" }} />
    </label>
    {err && <div style={{ fontSize: 10, color: C.red }}>{err}</div>}
  </div>;
}

/* ===== BIAYA ===== */
function Cell({ value, onChange, type = "text", align = "left", readOnly }) {
  if (readOnly) return <div style={{ padding: "6px 7px", fontSize: 13, color: C.ink, textAlign: align, fontVariantNumeric: "tabular-nums", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{type === "date" ? fmtDate(value) : value}</div>;
  return <input type={type} value={value} onChange={(e) => onChange(type === "number" ? Number(e.target.value) : e.target.value)}
    style={{ width: "100%", border: "1px solid transparent", background: "transparent", padding: "6px 7px", borderRadius: 8, fontSize: 13, color: C.ink, textAlign: align, fontFamily: "inherit", fontVariantNumeric: "tabular-nums", outline: "none" }}
    onFocus={(e) => { e.target.style.border = `1px solid ${C.blue}`; e.target.style.background = "#fff"; }}
    onBlur={(e) => { e.target.style.border = "1px solid transparent"; e.target.style.background = "transparent"; }} />;
}
function CostTable({ title, icon, color, rows, setRows, log, tag, addLabel, footer, can }) {
  const th = { textAlign: "left", fontSize: 11, fontWeight: 700, color: C.slate, padding: "8px 6px", borderBottom: `1px solid ${C.line}`, textTransform: "uppercase", letterSpacing: .3, whiteSpace: "nowrap" };
  const td = { padding: "2px 6px", borderBottom: `1px solid ${C.line}`, fontSize: 13, color: C.ink };
  const upd = (id, k, v) => setRows((s) => s.map((r) => r.id === id ? { ...r, [k]: v } : r));
  const total = sumCost(rows);
  return <Card>
    <CardHead icon={icon} color={color} title={title} right={<div style={{ fontSize: 13, color: C.slate }}>Total <b style={{ color }}>{rp(total)}</b></div>} />
    <div className="scrollx"><table style={{ width: "100%", borderCollapse: "collapse", minWidth: 820 }}>
      <thead><tr><th style={th}>Paket Pekerjaan</th><th style={{ ...th, textAlign: "right" }}>Qty</th><th style={{ ...th, textAlign: "right" }}>Unit Rate</th><th style={{ ...th, textAlign: "right" }}>Amount</th><th style={th}>Mulai</th><th style={th}>Selesai</th><th style={{ ...th, textAlign: "center" }}>Bukti</th><th style={th}></th></tr></thead>
      <tbody>{rows.map((r) => <tr key={r.id}>
        <td style={{ ...td, minWidth: 190 }}><Cell readOnly={!can.manage} value={r.item} onChange={(v) => upd(r.id, "item", v)} /></td>
        <td style={{ ...td, width: 76 }}><Cell readOnly={!can.manage} type="number" align="right" value={r.qty} onChange={(v) => upd(r.id, "qty", v)} /></td>
        <td style={{ ...td, width: 116 }}><Cell readOnly={!can.manage} type="number" align="right" value={r.rate} onChange={(v) => upd(r.id, "rate", v)} /></td>
        <td style={{ ...td, textAlign: "right", fontWeight: 700, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>{rp(r.qty * r.rate)}</td>
        <td style={{ ...td, width: 138 }}><Cell readOnly={!can.manage} type="date" value={r.start} onChange={(v) => upd(r.id, "start", v)} /></td>
        <td style={{ ...td, width: 138 }}><Cell readOnly={!can.manage} type="date" value={r.finish} onChange={(v) => upd(r.id, "finish", v)} /></td>
        <td style={{ ...td, width: 66, textAlign: "center" }}><div style={{ display: "flex", justifyContent: "center" }}><ProofCell row={r} label={`${tag} — ${r.item}`} log={log} onSet={(p) => setRows((s) => s.map((x) => x.id === r.id ? { ...x, ...p } : x))} /></div></td>
        <td style={{ ...td, width: 34 }}>{can.manage && <button onClick={() => { setRows((s) => s.filter((x) => x.id !== r.id)); log && log("Hapus item biaya", `${tag}: ${r.item}`); }} style={{ ...iconBtn, color: C.red }}><Ic name="trash" size={14} /></button>}</td>
      </tr>)}
      {rows.length === 0 && <tr><td colSpan={8}><Empty text="Belum ada item biaya." /></td></tr>}
      </tbody>
    </table></div>
    {can.manage && <Btn kind="ghost" size="sm" onClick={() => { setRows((s) => [...s, { id: uid(), item: "Item baru", qty: 1, rate: 0, start: PROJECT.statusDate, finish: PROJECT.statusDate, proofUrl: null, proofName: null }]); log && log("Tambah item biaya", tag); }} style={{ marginTop: 12 }}><Ic name="plus" size={14} /> {addLabel}</Btn>}
    {footer}
  </Card>;
}
function Costs({ rab, setRab, trans, setTrans, fee, setFee, terms, setTerms, can, log }) {
  const th = { textAlign: "left", fontSize: 11, fontWeight: 700, color: C.slate, padding: "8px 6px", borderBottom: `1px solid ${C.line}`, textTransform: "uppercase", letterSpacing: .3, whiteSpace: "nowrap" };

  const uT = (id, k, v) => setTerms((s) => s.map((t) => t.id === id ? { ...t, [k]: v } : t));
  const tp = terms.reduce((a, t) => a + Number(t.percent || 0), 0);
  const cT = sumCost(rab), trT = sumCost(trans);
  return <div className="g1">
    <div className="g3">
      <Stat label="Biaya Kontraktor" value={rpShort(cT)} sub="RAB" icon="hat" color={C.green} />
      <Stat label="Biaya Konsultan" value={rpShort(fee)} sub={`${terms.length} termin`} icon="compass" color={C.blue} />
      <Stat label="Biaya Transisi" value={rpShort(trT)} sub={`${trans.length} item`} icon="truck" color={C.orange} />
    </div>

    <CostTable title="Biaya Kontraktor (RAB)" icon="hat" color={C.green} rows={rab} setRows={setRab} log={log} can={can} tag="Kontraktor" addLabel="Tambah baris RAB" />

    <Card>
      <CardHead icon="compass" color={C.blue} title="Biaya Konsultan (Termin)" right={<div style={{ display: "flex", alignItems: "center", gap: 8 }}><span style={{ fontSize: 12.5, color: C.slate }}>Total Fee</span>{can.manage ? <Input type="number" value={fee} onChange={(e) => setFee(Number(e.target.value))} style={{ width: 160, textAlign: "right", fontWeight: 700, fontVariantNumeric: "tabular-nums" }} /> : <b style={{ fontSize: 14, color: C.blue }}>{rp(fee)}</b>}</div>} />
      <div className="scrollx"><table style={{ width: "100%", borderCollapse: "collapse", minWidth: 760 }}>
        <thead><tr><th style={{ ...th, width: 66 }}>Tahap</th><th style={th}>Deskripsi</th><th style={{ ...th, textAlign: "right", width: 84 }}>Bobot %</th><th style={{ ...th, textAlign: "right" }}>Nilai</th><th style={th}>Tgl Bayar (BAST)</th><th style={{ ...th, textAlign: "center" }}>Bukti</th><th style={th}></th></tr></thead>
        <tbody>{terms.map((t) => <tr key={t.id}>
          <td style={td}><Cell readOnly={!can.manage} value={t.term} onChange={(v) => uT(t.id, "term", v)} /></td>
          <td style={{ ...td, minWidth: 170 }}><Cell readOnly={!can.manage} value={t.desc} onChange={(v) => uT(t.id, "desc", v)} /></td>
          <td style={{ ...td, width: 84 }}><Cell readOnly={!can.manage} type="number" align="right" value={t.percent} onChange={(v) => uT(t.id, "percent", v)} /></td>
          <td style={{ ...td, textAlign: "right", fontWeight: 700, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>{rp((t.percent / 100) * fee)}</td>
          <td style={{ ...td, width: 146 }}><Cell readOnly={!can.manage} type="date" value={t.date} onChange={(v) => uT(t.id, "date", v)} /></td>
          <td style={{ ...td, width: 66, textAlign: "center" }}><div style={{ display: "flex", justifyContent: "center" }}><ProofCell row={t} label={`Konsultan — ${t.term} ${t.desc}`} log={log} onSet={(p) => setTerms((s) => s.map((x) => x.id === t.id ? { ...x, ...p } : x))} /></div></td>
          <td style={{ ...td, width: 34 }}>{can.manage && <button onClick={() => { setTerms((s) => s.filter((x) => x.id !== t.id)); log && log("Hapus termin", t.term); }} style={{ ...iconBtn, color: C.red }}><Ic name="trash" size={14} /></button>}</td>
        </tr>)}
          <tr><td colSpan={2} style={{ ...td, fontWeight: 700 }}>Total bobot</td><td style={{ ...td, textAlign: "right", fontWeight: 700 }}>{tp}%</td><td style={{ ...td, textAlign: "right", fontWeight: 700, color: C.blue }}>{rp(terms.reduce((a, t) => a + (t.percent / 100) * fee, 0))}</td><td style={td} colSpan={3}></td></tr>
        </tbody></table></div>
      {can.manage && <Btn kind="ghost" size="sm" onClick={() => { setTerms((s) => [...s, { id: uid(), term: "T" + (s.length + 1), desc: "Tahap baru", percent: 0, date: PROJECT.statusDate, proofUrl: null, proofName: null }]); log && log("Tambah termin", "Konsultan"); }} style={{ marginTop: 12 }}><Ic name="plus" size={14} /> Tambah termin</Btn>}
      {tp !== 100 && <div style={{ fontSize: 12, color: C.amber, marginTop: 8 }}>Catatan: total bobot termin = {tp}% (belum 100%).</div>}
    </Card>

    <CostTable title="Biaya Transisi" icon="truck" color={C.orange} rows={trans} setRows={setTrans} log={log} can={can} tag="Transisi" addLabel="Tambah biaya transisi" />
  </div>;
}

/* ===== ARSIP DOKUMEN ===== */
const CATS = ["Kontrak", "Desain", "RAB", "Izin", "BAST", "Invoice", "Laporan", "Lainnya"];
function Arsip({ docs, setDocs, log }) {
  const [pending, setPending] = useState(null);
  const [cat, setCat] = useState("Kontrak");
  const [err, setErr] = useState("");
  const [preview, setPreview] = useState(null);
  const [busy, setBusy] = useState(false);
  const pick = (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = ""; if (!file) return;
    setErr("");
    if (file.type !== "application/pdf") { setErr("Hanya file PDF yang didukung."); return; }
    if (file.size > 40 * 1048576) { setErr(`Ukuran ${mb(file.size)} melebihi batas 10 MB.`); return; }
    setPending({ file, name: file.name.replace(/\.pdf$/i, "") });
  };
  const commit = async () => {
    if (!pending || busy) return;
    setBusy(true);
    try {
      const url = await uploadFile(pending.file, "docs");
      const nm = pending.name.trim() || pending.file.name;
      setDocs((s) => [{ id: uid(), name: nm, file: pending.file.name, category: cat, size: pending.file.size, date: PROJECT.statusDate, url }, ...s]);
      log && log("Unggah dokumen", `${nm} (${cat})`);
      setPending(null);
    } catch (e) { setErr("Gagal mengunggah: " + (e.message || "")); }
    setBusy(false);
  };
  const remove = (d) => { if (d.url && d.url.indexOf("blob:") === 0) { try { URL.revokeObjectURL(d.url); } catch (x) {} } setDocs((s) => s.filter((x) => x.id !== d.id)); log && log("Hapus dokumen", d.name); };
  const th = { textAlign: "left", fontSize: 11, fontWeight: 700, color: C.slate, padding: "10px 8px", borderBottom: `1px solid ${C.line}`, textTransform: "uppercase", letterSpacing: .3, whiteSpace: "nowrap" };
  const td = { padding: "10px 8px", borderBottom: `1px solid ${C.line}`, fontSize: 13, color: C.ink };
  return <div className="g1">
    <Card>
      <CardHead icon="upload" title="Unggah Dokumen" />
      {!pending ? (
        <div className="rowwrap">
          <label style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "9px 15px", background: C.blue, color: "#fff", borderRadius: 10, fontWeight: 600, fontSize: 13.5, cursor: "pointer" }}>
            <Ic name="upload" size={16} /> Pilih file PDF
            <input type="file" accept="application/pdf" onChange={pick} style={{ display: "none" }} />
          </label>
          <span style={{ fontSize: 12, color: C.slate }}>Format PDF · maksimal 40 MB</span>
        </div>
      ) : (
        <div style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 12, padding: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, fontSize: 12.5, color: C.slate }}><span style={{ color: C.red }}><Ic name="file" size={16} /></span> {pending.file.name} · {mb(pending.file.size)}</div>
          <div className="g2">
            <Field label="Nama Dokumen"><Input value={pending.name} onChange={(e) => setPending((p) => ({ ...p, name: e.target.value }))} placeholder="mis. Kontrak Konsultan MRT" /></Field>
            <Field label="Kategori"><Sel value={cat} onChange={(e) => setCat(e.target.value)}>{CATS.map((c) => <option key={c}>{c}</option>)}</Sel></Field>
          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 12 }}><Btn kind="ghost" size="sm" onClick={() => setPending(null)}>Batal</Btn><Btn size="sm" onClick={commit} disabled={busy} style={{ opacity: busy ? .7 : 1 }}><Ic name="check" size={14} /> {busy ? "Mengunggah…" : "Unggah"}</Btn></div>
        </div>
      )}
      {err && <div style={{ marginTop: 12, padding: "10px 12px", background: "#FDECEF", color: C.red, borderRadius: 10, fontSize: 12.5, fontWeight: 600 }}>{err}</div>}
    </Card>
    <Card>
      <CardHead icon="folder" title="Arsip Dokumen" right={<span style={{ fontSize: 12.5, color: C.slate }}>{docs.length} berkas</span>} />
      <div className="scrollx"><table style={{ width: "100%", borderCollapse: "collapse", minWidth: 680 }}>
        <thead><tr><th style={th}>Nama Dokumen</th><th style={th}>Kategori</th><th style={{ ...th, textAlign: "right" }}>Ukuran</th><th style={th}>Tanggal</th><th style={{ ...th, textAlign: "right" }}>Aksi</th></tr></thead>
        <tbody>{docs.map((d) => <tr key={d.id}>
          <td style={td}><div style={{ display: "flex", alignItems: "center", gap: 9 }}><span style={{ color: C.red }}><Ic name="file" size={18} /></span><div style={{ minWidth: 0 }}><div style={{ fontWeight: 600 }}>{d.name} {d.example && <span style={{ fontSize: 10, fontWeight: 700, color: C.amber, background: "#FCF3E2", padding: "1px 7px", borderRadius: 99 }}>contoh</span>}</div><div style={{ fontSize: 11, color: C.slate }}>{d.file}</div></div></div></td>
          <td style={td}><Pill text={d.category} color={C.blue} bg={C.blueSoft} /></td>
          <td style={{ ...td, textAlign: "right", fontVariantNumeric: "tabular-nums", color: C.slate }}>{mb(d.size)}</td>
          <td style={{ ...td, color: C.slate, whiteSpace: "nowrap" }}>{fmtDate(d.date)}</td>
          <td style={td}><div style={{ display: "flex", gap: 4, justifyContent: "flex-end" }}>
            <button title={d.url ? "Pratinjau" : "Contoh — unggah file untuk pratinjau"} disabled={!d.url} onClick={() => d.url && setPreview(d)} style={{ ...iconBtn, color: d.url ? C.blue : "#C7D2DE", cursor: d.url ? "pointer" : "not-allowed" }}><Ic name="eye" size={16} /></button>
            {d.url ? <a title="Unduh" href={d.url} download={d.file} target="_blank" rel="noreferrer" style={{ ...iconBtn, color: C.green, textDecoration: "none" }}><Ic name="download" size={16} /></a> : <span style={{ ...iconBtn, color: "#C7D2DE" }}><Ic name="download" size={16} /></span>}
            <button title="Hapus" onClick={() => remove(d)} style={{ ...iconBtn, color: C.red }}><Ic name="trash" size={16} /></button>
          </div></td>
        </tr>)}
        {docs.length === 0 && <tr><td colSpan={5}><Empty text="Belum ada dokumen. Unggah PDF di atas." /></td></tr>}
        </tbody></table></div>
    </Card>
    {preview && <Modal title={preview.name} onClose={() => setPreview(null)} width={900}>
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
        <a href={preview.url} download={preview.file} style={{ textDecoration: "none" }}><Btn kind="green"><Ic name="download" size={15} /> Unduh</Btn></a>
        <a href={preview.url} target="_blank" rel="noreferrer" style={{ textDecoration: "none" }}><Btn kind="ghost"><Ic name="eye" size={15} /> Tab baru</Btn></a>
      </div>
      <iframe title="preview" src={preview.url} style={{ width: "100%", height: "70vh", border: `1px solid ${C.line}`, borderRadius: 10 }} />
    </Modal>}
  </div>;
}

/* ===== PUNCHLIST ===== */
function PunchModal({ item, stages, onSave, onClose }) {
  const [f, setF] = useState(item || { title: "", stage: stages[0] || "", loc: "", severity: "Sedang", status: PST.open, due: PROJECT.statusDate, note: "", photo: null });
  const [imgErr, setImgErr] = useState("");
  const [busy, setBusy] = useState(false);
  const set = (k, v) => setF((s) => ({ ...s, [k]: v }));
  const onPhoto = (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = ""; if (!file) return;
    setImgErr("");
    if (!file.type.startsWith("image/")) { setImgErr("Berkas harus berupa gambar."); return; }
    if (file.size > 5 * 1048576) { setImgErr(`Ukuran ${mb(file.size)} melebihi batas 5 MB.`); return; }
    const r = new FileReader(); r.onload = () => set("photo", r.result); r.readAsDataURL(file);
  };
  const save = async () => {
    if (!f.title.trim() || busy) return;
    setBusy(true);
    try { const photo = await uploadDataUrl(f.photo, "punch"); onSave({ ...f, photo }); }
    catch (e) { setImgErr("Gagal mengunggah foto: " + (e.message || "")); setBusy(false); }
  };
  return <Modal title={item ? "Edit Temuan" : "Tambah Temuan"} onClose={onClose} width={520}>
    <Field label="Judul temuan"><Input value={f.title} onChange={(e) => set("title", e.target.value)} placeholder="mis. Dinding partisi tidak siku" /></Field>
    <div className="g2" style={{ marginTop: 12 }}>
      <Field label="Tahap / Aktivitas"><Sel value={f.stage} onChange={(e) => set("stage", e.target.value)}>{stages.map((n) => <option key={n}>{n}</option>)}</Sel></Field>
      <Field label="Lokasi"><Input value={f.loc || ""} onChange={(e) => set("loc", e.target.value)} placeholder="mis. Koridor utara Lt.21" /></Field>
    </div>
    <div className="g3" style={{ marginTop: 12, gap: 12 }}>
      <Field label="Severity"><Sel value={f.severity} onChange={(e) => set("severity", e.target.value)}>{SEV.map((s) => <option key={s}>{s}</option>)}</Sel></Field>
      <Field label="Status"><Sel value={f.status} onChange={(e) => set("status", e.target.value)}>{[PST.open, PST.prog, PST.done].map((s) => <option key={s}>{s}</option>)}</Sel></Field>
      <Field label="Due"><Input type="date" value={f.due} onChange={(e) => set("due", e.target.value)} /></Field>
    </div>
    <div style={{ marginTop: 12 }}><Field label="Foto temuan (opsional)">
      <div className="rowwrap">
        <label style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "8px 13px", background: C.blueSoft, color: C.blue, borderRadius: 10, fontWeight: 600, fontSize: 12.5, cursor: "pointer", border: `1px solid ${C.line}` }}>
          <Ic name="camera" size={15} /> {f.photo ? "Ganti foto" : "Unggah foto"}
          <input type="file" accept="image/*" onChange={onPhoto} style={{ display: "none" }} />
        </label>
        {f.photo && <div style={{ position: "relative" }}>
          <img src={f.photo} alt="foto" style={{ width: 64, height: 64, objectFit: "cover", borderRadius: 8, border: `1px solid ${C.line}` }} />
          <button onClick={() => set("photo", null)} title="Hapus foto" style={{ position: "absolute", top: -8, right: -8, width: 22, height: 22, borderRadius: 99, border: "none", background: C.red, color: "#fff", cursor: "pointer", display: "grid", placeItems: "center" }}><Ic name="x" size={12} /></button>
        </div>}
      </div>
      {imgErr && <div style={{ color: C.red, fontSize: 12, marginTop: 6 }}>{imgErr}</div>}
    </Field></div>
    <div style={{ marginTop: 12 }}><Field label="Keterangan / Catatan"><Area value={f.note} onChange={(e) => set("note", e.target.value)} placeholder="Detail temuan / tindakan" /></Field></div>
    <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 18 }}><Btn kind="ghost" onClick={onClose}>Batal</Btn><Btn onClick={save} disabled={busy} style={{ opacity: busy ? .7 : 1 }}>{busy ? "Menyimpan…" : (item ? "Simpan" : "Tambah")}</Btn></div>
  </Modal>;
}
function PunchReportModal({ stages, defaultStage, onClose, onMake }) {
