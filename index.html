  .wrap { padding: 24px; max-width: 1320px; margin: 0 auto; width: 100%; }

  .g3 { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }

    .print-doc, .print-doc * { visibility: visible !important; }

    .print-paper { box-shadow:none !important; margin:0 !important; width:100% !important; max-width:none !important; border:none !important; border-radius:0 !important; padding:0 !important; }
    .no-print { display:none !important; }

const isoWeek = (d) => {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
};
const isoWeekYear = (d) => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); return t.getUTCFullYear(); };

const splitRange = (start, finish, names) => {
  const s = D(start), f = D(finish), tot = days(s, f) + 1, n = names.length;

  return names.map((nm, i) => {

    return [nm, iso(ss), iso(ff), 0];
  });

   Login diverifikasi terhadap tabel app_users: password disimpan sebagai
   hash PBKDF2-SHA256 (100.000 iterasi) + salt acak per user. Tidak ada

   menu Manajemen User.

const PBKDF2_ITER = 100000;
const _hex = (buf) => Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
function genSalt() { const a = new Uint8Array(16); (window.crypto || {}).getRandomValues && window.crypto.getRandomValues(a); return _hex(a.buffer); }
async function hashPassword(password, saltHex) {
  const enc = new TextEncoder();
  const salt = new Uint8Array((saltHex.match(/.{1,2}/g) || []).map((h) => parseInt(h, 16)));
  const key = await window.crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await window.crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: PBKDF2_ITER, hash: "SHA-256" }, key, 256);
  return _hex(bits);
}

  if (error) return { ok: false, msg: "Gagal menghubungi server: " + error.message };

  if (!row) {
    /* Bedakan "tabel tak terbaca (RLS)" dari "username memang tak ada":
       cek apakah ada baris app_users yang terlihat sama sekali. */
    const { data: any } = await sb.from("app_users").select("id").limit(1);
    if (!any || any.length === 0)

    return { ok: false, msg: "Username tidak ditemukan. Periksa ejaannya, atau minta Project Management membuatkan akun." };
  }
  if (row.active === false) return { ok: false, msg: "Akses akun ini sedang dinonaktifkan. Hubungi Project Management." };
  if (row.pending) return { ok: false, msg: "Akun ini masih menunggu persetujuan dari Project Management. Silakan hubungi PM untuk konfirmasi." };
  if (!row.password_hash || !row.password_salt) return { ok: false, needSetup: true, user: userFromRow(row) };
  const h = await hashPassword(password, row.password_salt);
  if (h !== row.password_hash) return { ok: false, msg: "Password salah." };
  return { ok: true, user: userFromRow(row) };
}

/* status sinkronisasi global (supaya kegagalan tulis TERLIHAT, bukan diam di console) */
const SYNC = {
  state: "idle", msg: "", at: null, subs: new Set(),
  set(state, msg) { this.state = state; this.msg = msg || ""; this.at = new Date(); this.subs.forEach((f) => f()); },
};
function useSyncState() {
  const [, tick] = useState(0);
  useEffect(() => { const cb = () => tick((x) => x + 1); SYNC.subs.add(cb); return () => SYNC.subs.delete(cb); }, []);
  return SYNC;
}
async function pushTable(table, rows, toRow) {
  const payload = rows.map((r, i) => ({ ...toRow(r), project_key: PROJECT_KEY, pos: i }));
  if (payload.length) {
    const { error } = await sb.from(table).upsert(payload);
    if (error) throw new Error(`${table}: gagal menyimpan — ${error.message}`);
  }
  /* hapus baris yang sudah tidak ada, dengan diff eksplisit (lebih aman daripada filter "not in") */
  const { data: cur, error: e1 } = await sb.from(table).select("id").eq("project_key", PROJECT_KEY);
  if (e1) throw new Error(`${table}: gagal membaca — ${e1.message}`);
  const keep = new Set(rows.map((r) => r.id));
  const gone = (cur || []).map((r) => r.id).filter((id) => !keep.has(id));
  if (gone.length) {
    const { error: e2 } = await sb.from(table).delete().eq("project_key", PROJECT_KEY).in("id", gone);
    if (e2) throw new Error(`${table}: gagal menghapus — ${e2.message}`);
  }
}

function useSync(table, rows, toRow, ready) {

/* ===== S-CURVE ===== */
function periods() {
  const out = []; const add = (y, m) => { const last = new Date(y, m, 0).getDate(); out.push(D(`${y}-${String(m).padStart(2,"0")}-15`)); out.push(D(`${y}-${String(m).padStart(2,"0")}-${String(last).padStart(2,"0")}`)); };
  for (let m = 5; m <= 12; m++) add(2026, m); for (let m = 1; m <= 4; m++) add(2027, m); return out;
}
const frac = (s, f, d) => { const ds = D(s), df = D(f); if (d >= df) return 1; if (d < ds) return 0; return (days(ds, d) + 1) / (days(ds, df) + 1); };
const sumCost = (list) => list.reduce((a, r) => a + (Number(r.qty) || 0) * (Number(r.rate) || 0), 0);
/* biaya tiap kegiatan: konsultan = termin, lainnya = daftar item berjadwal */
function costsOfAct(key, rab, trans, acosts) {
  if (key === "kontraktor") return rab;
  if (key === "transisi") return trans;
  return acosts.filter((r) => r.act === key);
}
function actTotals(rab, fee, terms, trans, acosts) {
  return ACTS.map((a) => a.key === "konsultan"
    ? { a, total: Number(fee) || 0, kind: "term" }
    : { a, total: sumCost(costsOfAct(a.key, rab, trans, acosts)), kind: "item" });
}
function earnedOfAct(t, d, rab, fee, terms, trans, acosts) {
  if (t.kind === "term") return terms.filter((x) => D(x.date) <= d).reduce((acc, x) => acc + ((Number(x.percent) || 0) / 100) * (Number(fee) || 0), 0);
  return costsOfAct(t.a.key, rab, trans, acosts).reduce((acc, r) => acc + (Number(r.qty) || 0) * (Number(r.rate) || 0) * frac(r.start, r.finish, d), 0);
}
function valsAt(rab, fee, terms, trans, acosts, d) {
  const tot = actTotals(rab, fee, terms, trans, acosts);
  const proj = tot.reduce((a, x) => a + x.total, 0);
  const out = {}; let earnedAll = 0;
  tot.forEach((t) => {
    const e = earnedOfAct(t, d, rab, fee, terms, trans, acosts);
    earnedAll += e;
    out[t.a.label] = t.total ? +(e / t.total * 100).toFixed(1) : 0;
  });
  out.Total = proj ? +(earnedAll / proj * 100).toFixed(1) : 0;
  return out;
}
function sCurve(rab, fee, terms, trans, acosts) {
  return periods().map((d) => ({ label: `${MON[d.getMonth()]} ${String(d.getDate()).padStart(2,"0")}`, ...valsAt(rab, fee, terms, trans, acosts, d) }));
}
function todayMarkerData(rab, fee, terms, trans, acosts) {
  const ps = periods(); const td = todayNoon(); const n = ps.length;
  let idx;
  if (td <= ps[0]) idx = 0;
  else if (td >= ps[n - 1]) idx = n - 1;
  else { idx = n - 1; for (let i = 0; i < n - 1; i++) { if (td >= ps[i] && td <= ps[i + 1]) { idx = i + (td - ps[i]) / (ps[i + 1] - ps[i]); break; } } }
  return { idx, n, vals: valsAt(rab, fee, terms, trans, acosts, td), label: `${td.getDate()} ${MON[td.getMonth()]}` };
}
/* Ubah rangkaian titik {x,y} menjadi path SVG melengkung halus (Catmull-Rom).
   clampLo/clampHi mencegah lengkungan melewati batas (mis. 0..100). */
function smoothPath(pts, clampLo, clampHi) {
  const p = pts.filter((q) => q && isFinite(q.x) && isFinite(q.y));
  if (p.length < 2) return p.length ? `M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)}` : "";
  const cl = (v) => (clampLo != null ? Math.max(clampLo, Math.min(clampHi, v)) : v);
  let d = `M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p[i + 1];
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = cl(p1.y + (p2.y - p0.y) / 6);
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = cl(p2.y - (p3.y - p1.y) / 6);
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}

const seriesList = () => [...ACTS.map((a) => [a.label, a.color]), ["Total", C.ink]];

/* ===== S-CURVE PER KEGIATAN ===== */
function sCurveForAct(actKey, tasks) {
  const ps = periods();
  const leaves = tasks.filter((t) => t.act === actKey && !tasks.some((x) => x.parent === t.id && x.act === actKey));
  if (!leaves.length) return ps.map((d) => ({ label: `${MON[d.getMonth()]} ${String(d.getDate()).padStart(2,"0")}`, plan: 0, actual: 0 }));
  const today = todayNoon();
  return ps.map((d) => {
    let W = 0, planD = 0, actD = 0;
    leaves.forEach((t) => {
      if (t.status === STATUS.cancel) return;
      const dur = days(D(t.start), D(t.finish)) + 1;
      const pf = frac(t.start, t.finish, d);                 // porsi waktu terencana s/d d
      const pnow = (Number(t.percent) || 0) / 100;           // realisasi progres saat ini
      /* aktual hanya sampai HARI INI; bentuknya kumulatif -> berbentuk S.
         Di masa depan (d > hari ini) aktual berhenti bertumbuh. */
      const dEff = d > today ? today : d;
      const afReal = frac(t.start, t.finish, dEff);          // porsi waktu s/d titik efektif
      const af = Math.min(afReal, pnow);                     // dibatasi realisasi nyata
      W += dur; planD += dur * pf; actD += dur * af;
    });
    const past = d <= today;
    return { label: `${MON[d.getMonth()]} ${String(d.getDate()).padStart(2,"0")}`, plan: W ? +(planD / W * 100).toFixed(1) : 0, actual: (past && W) ? +(actD / W * 100).toFixed(1) : null };
  });
}
function ActSCurveChart({ data, color, soft, big }) {

  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b, n = data.length;
  const x = (i) => pad.l + (n <= 1 ? 0 : i * (iw / (n - 1)));
  const y = (v) => pad.t + ih - (Math.max(0, Math.min(100, v)) / 100) * ih;
  const ptsOf = (k) => data.map((d, i) => (d[k] == null ? null : { x: x(i), y: y(d[k]) })).filter(Boolean);
  const planPts = ptsOf("plan"), actPts = ptsOf("actual");
  const planPath = smoothPath(planPts, pad.t, pad.t + ih);
  const actPath = smoothPath(actPts, pad.t, pad.t + ih);
  const areaFrom = (path, pts) => pts.length ? `${path} L${pts[pts.length-1].x.toFixed(1)},${(pad.t+ih).toFixed(1)} L${pts[0].x.toFixed(1)},${(pad.t+ih).toFixed(1)} Z` : "";
  const tdIdx = (() => { const ps = periods(), td = todayNoon(); if (td <= ps[0]) return 0; if (td >= ps[ps.length-1]) return ps.length-1; for (let i = 0; i < ps.length - 1; i++) if (td >= ps[i] && td <= ps[i+1]) return i + (td - ps[i]) / (ps[i+1] - ps[i]); return ps.length-1; })();
  const tx = x(tdIdx);
  const ci = Math.min(Math.round(tdIdx), n - 1);
  const lastAct = actPts.length ? actPts[actPts.length - 1] : null;
  return <div style={{ width: "100%", maxWidth: "100%", overflow: "hidden" }}>
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet" width="100%" style={{ display: "block", width: "100%", height: "auto" }}>
      {[0, 25, 50, 75, 100].map((g) => <g key={g}><line x1={pad.l} x2={W - pad.r} y1={y(g)} y2={y(g)} stroke={C.line} /><text x={pad.l - 5} y={y(g) + 3} textAnchor="end" fontSize={big ? "10" : "8"} fill={C.slate}>{g}%</text></g>)}
      {data.map((d, i) => (i % (big ? 2 : 4) === 0 ? <text key={i} x={x(i)} y={H - 6} textAnchor="middle" fontSize={big ? "9" : "7.5"} fill={C.slate}>{d.label}</text> : null))}
      <path d={areaFrom(planPath, planPts)} fill={soft || "#EEF3F8"} opacity=".35" />
      <path d={planPath} fill="none" stroke={C.slate} strokeWidth="1.5" strokeDasharray="4 3" />
      <path d={areaFrom(actPath, actPts)} fill={color || C.violet} opacity=".12" />
      <path d={actPath} fill="none" stroke={color || C.violet} strokeWidth="2.4" strokeLinecap="round" />
      <line x1={tx} x2={tx} y1={pad.t} y2={pad.t+ih} stroke={C.amber} strokeWidth="1.2" strokeDasharray="3 2" />
      {lastAct && <circle cx={lastAct.x} cy={lastAct.y} r="3.4" fill={color || C.violet} stroke="#fff" strokeWidth="1.2" />}
      {data[ci] && <circle cx={tx} cy={y(data[ci].plan)} r="3" fill={C.slate} stroke="#fff" strokeWidth="1" />}
    </svg>
    <div style={{ display: "flex", gap: 16, justifyContent: "center", marginTop: 4, fontSize: 11, flexWrap: "wrap" }}>
      <span style={{ display: "flex", alignItems: "center", gap: 5, color: C.slate, fontWeight: 600 }}><span style={{ width: 14, height: 0, borderTop: `2px dashed ${C.slate}` }} />Rencana</span>
      <span style={{ display: "flex", alignItems: "center", gap: 5, color: color || C.violet, fontWeight: 600 }}><span style={{ width: 14, height: 2.5, background: color || C.violet, borderRadius: 2 }} />Aktual (s/d hari ini)</span>

  terms.forEach((t) => { if (!t.date) return; const v = ((Number(t.percent) || 0) / 100) * (Number(fee) || 0); if (v) addTo(actOf("konsultan").label, t.date.slice(0, 7), v); });

    const total = (Number(r.qty) || 0) * (Number(r.rate) || 0);
    if (!total || !r.start || !r.finish) return;
    const ds = D(r.start), df = D(r.finish);
    const totalDays = days(ds, df) + 1;               // total hari (inklusif)

      const e = mEnd > df ? df : mEnd;
      const dcount = days(s, e) + 1;                   // hari di bulan ini (tanpa tumpang-tindih)
      const ym = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}`;

}

/* =========================================================================
   EKSPOR PNG BERKUALITAS TINGGI, RASIO 16:9 (WIDESCREEN) UNTUK POWERPOINT
   -------------------------------------------------------------------------
   Menyusun gambar sumber (hasil html2canvas atau <img> dari SVG) ke atas
   kanvas 16:9 beresolusi tinggi: latar putih, konten di-*contain* (utuh,
   tanpa distorsi), dilebarkan penuh dan diletakkan di ATAS sehingga ruang
   kosong (bila ada) jatuh di BAWAH — bukan di kiri/kanan. Timeline sepanjang
   apa pun tetap menghasilkan file 16:9 yang tajam dan mengisi lebar slide.
   ========================================================================= */
const PPT_W = 3200, PPT_H = 1800;               // 16:9 (widescreen), ~240 DPI di slide 13.33"x7.5"
function composeAndDownload(srcCanvas, filename, opts) {
  const o = opts || {};
  const padX = o.padX != null ? o.padX : 60;
  const padTop = o.padTop != null ? o.padTop : (o.title ? 150 : 60);
  const padBottom = o.padBottom != null ? o.padBottom : (o.footer ? 96 : 60);
  const out = document.createElement("canvas");
  out.width = PPT_W; out.height = PPT_H;
  const ctx = out.getContext("2d");
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, PPT_W, PPT_H);
  // area yang tersedia untuk konten
  const availW = PPT_W - padX * 2, availH = PPT_H - padTop - padBottom;
  const sw = srcCanvas.width, sh = srcCanvas.height;
  /* UTAMAKAN penuhi lebar; hanya perkecil bila tingginya melebihi area.
     Karena chart ekspor dibuat rasio >= ~1.9, hasilnya selalu penuh di lebar
     dan ruang kosong jatuh di BAWAH (bukan kiri-kanan). */
  let scale = availW / sw;
  if (sh * scale > availH) scale = availH / sh;
  const dw = sw * scale, dh = sh * scale;
  const dx = (PPT_W - dw) / 2;                          // rata tengah horizontal (penuh bila selebar area)
  const dy = padTop;                                    // rata atas -> ruang kosong di bawah
  ctx.drawImage(srcCanvas, dx, dy, dw, dh);
  // judul & catatan opsional
  if (o.title) {
    ctx.fillStyle = "#102A43"; ctx.font = "700 46px Inter, Arial, sans-serif"; ctx.textBaseline = "alphabetic";
    ctx.fillText(o.title, padX, 74);
  }
  if (o.subtitle) {
    ctx.fillStyle = "#5B6B7D"; ctx.font = "500 30px Inter, Arial, sans-serif";
    ctx.fillText(o.subtitle, padX, 118);
  }
  if (o.footer) {
    ctx.fillStyle = "#5B6B7D"; ctx.font = "500 28px Inter, Arial, sans-serif";
    ctx.fillText(o.footer, padX, PPT_H - 40);
  }
  const a = document.createElement("a"); a.href = out.toDataURL("image/png"); a.download = filename; a.click();
}
/* Render sebuah node DOM ke kanvas beresolusi tinggi lalu susun ke 4:3.
   Skala capture dipilih agar konten mengisi lebar area 4:3 dengan tajam,
   tetapi dibatasi agar kanvas tidak terlalu besar untuk timeline panjang. */
/* Render SVG murni ke kanvas beresolusi tinggi (tanpa html2canvas) supaya
   tidak ada bagian yang terpotong oleh overflow container. */
function svgToCanvas(svg, targetW) {
  return new Promise((resolve, reject) => {
    const vb = svg.viewBox && svg.viewBox.baseVal;
    const vw = vb && vb.width ? vb.width : (svg.clientWidth || 900);
    const vh = vb && vb.height ? vb.height : (svg.clientHeight || 280);
    const clone = svg.cloneNode(true);
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    clone.setAttribute("width", vw); clone.setAttribute("height", vh);
    clone.setAttribute("preserveAspectRatio", "xMidYMid meet");
    const xml = new XMLSerializer().serializeToString(clone);
    const img = new Image();
    img.onload = () => {
      const cw = targetW || 2600, ch = Math.round(cw * vh / vw);
      const canvas = document.createElement("canvas"); canvas.width = cw; canvas.height = ch;
      const ctx = canvas.getContext("2d"); ctx.imageSmoothingQuality = "high";
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      resolve(canvas);
    };
    img.onerror = reject;
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
  });
}
/* Render sebuah node DOM ke kanvas beresolusi tinggi lalu susun ke 16:9.
   Bila node berisi TEPAT satu <svg>, gunakan jalur SVG (anti-terpotong);
   selain itu pakai html2canvas. */
function exportNodeToPptPng(node, filename, opts) {
  if (!node) { alert("Modul export belum siap. Coba lagi."); return Promise.resolve(false); }
  const availW = PPT_W - ((opts && opts.padX != null ? opts.padX : 60) * 2);
  const tag = (el) => (el && el.tagName ? String(el.tagName).toLowerCase() : "");
  const onlySvg = tag(node) === "svg" ? node : (node.querySelectorAll && node.querySelectorAll("svg").length === 1 && node.children.length === 1 && tag(node.firstElementChild) === "svg" ? node.firstElementChild : null);
  if (onlySvg) {
    return svgToCanvas(onlySvg, Math.min(4000, Math.round(availW))).then((canvas) => { composeAndDownload(canvas, filename, opts); return true; })
      .catch(() => { alert("Gagal membuat PNG."); return false; });
  }
  if (!window.html2canvas) { alert("Modul export belum siap. Coba lagi."); return Promise.resolve(false); }
  const cssW = node.scrollWidth || node.offsetWidth || 1200;
  let scale = Math.max(2, Math.min(4, (availW / cssW) * 1.15));
  if (cssW * scale > 9000) scale = 9000 / cssW;        // batasi lebar kanvas sumber
  return window.html2canvas(node, { backgroundColor: "#ffffff", scale, logging: false, useCORS: true, windowWidth: cssW })
    .then((canvas) => { composeAndDownload(canvas, filename, opts); return true; })
    .catch(() => { alert("Gagal membuat PNG."); return false; });
}

    <div style={{ height: 12 }} />
    <Field label="Konfirmasi password" req><Input type="password" value={p2} onChange={(e) => setP2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && activate()} /></Field>
    <Btn onClick={activate} disabled={busy} style={{ width: "100%", justifyContent: "center", marginTop: 16, opacity: busy ? .7 : 1 }}>{busy ? "Menyimpan…" : "Aktifkan & Masuk"}</Btn>
    <button onClick={() => { setMode("login"); setErr(""); setP(""); }} style={{ width: "100%", background: "none", border: "none", color: C.slate, fontSize: 12.5, marginTop: 10, cursor: "pointer" }}>← Kembali</button>
  </>);

  if (mode === "first") return wrap("Buat Akun Admin Pertama", "Belum ada akun di portal ini. Buat akun Project Management pertama untuk mulai.", <>
    <Field label="Nama Karyawan" req><Input value={name} onChange={(e) => setName(e.target.value)} placeholder="mis. Budi Santoso" autoFocus /></Field>
    <div style={{ height: 12 }} />
    <Field label="Username" req><Input value={u} onChange={(e) => setU(e.target.value.toLowerCase())} placeholder="mis. budi" /></Field>
    <div className="g2" style={{ marginTop: 12 }}>
      <Field label="Password" req><Input type="password" value={p} onChange={(e) => setP(e.target.value)} placeholder="min. 8 karakter" /></Field>
      <Field label="Ulangi" req><Input type="password" value={p2} onChange={(e) => setP2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && createFirst()} /></Field>
    </div>
    <div style={{ marginTop: 12 }}><Field label="Role"><Sel value={role} onChange={(e) => setRole(e.target.value)}>{[ROLE.pm, ROLE.admin].map((r) => <option key={r}>{r}</option>)}</Sel></Field></div>
    <Btn onClick={createFirst} disabled={busy} style={{ width: "100%", justifyContent: "center", marginTop: 16, opacity: busy ? .7 : 1 }}>{busy ? "Membuat…" : "Buat & Masuk"}</Btn>
  </>);

  return wrap("Selamat datang", live ? "Masuk dengan username & password portal." : "Mode DEMO — pilih akun contoh di bawah.", <>
    <Field label="Username" req><Input type="text" value={u} onChange={(e) => setU(e.target.value.toLowerCase())} placeholder="username" onKeyDown={(e) => e.key === "Enter" && submit()} /></Field>
    <div style={{ height: 12 }} />
    <Field label="Password" req><Input type="password" value={p} onChange={(e) => setP(e.target.value)} placeholder="......" onKeyDown={(e) => e.key === "Enter" && submit()} /></Field>
    <Btn onClick={submit} disabled={busy} style={{ width: "100%", justifyContent: "center", marginTop: 16, opacity: busy ? .7 : 1 }}>{busy ? "Memproses…" : "Masuk"} {!busy && <Ic name="arrow" size={16} />}</Btn>
    {!live && <div className="g2" style={{ marginTop: 14 }}>
      {SEED_USERS.map((x) => <button key={x.username} onClick={() => { setU(uname(x)); setP(uname(x) + "123"); setErr(""); }} style={{ textAlign: "left", padding: "10px 12px", border: `1px solid ${C.line}`, borderRadius: 11, background: C.bg, cursor: "pointer" }}><div style={{ fontSize: 12.5, fontWeight: 700, color: C.ink }}>{x.role}</div><div style={{ fontSize: 11, color: C.slate }}>{uname(x)} / {uname(x)}123</div></button>)}
    </div>}
  </>);
}

/* ===== HIRARKI TUGAS ===== */
function childrenOf(tasks, id) { return tasks.filter((t) => t.parent === id); }
function rollup(t, kids) {
  if (!kids.length) return t;
  let mn = D(kids[0].start), mx = D(kids[0].finish);
  kids.forEach((c) => { const s = D(c.start), f = D(c.finish); if (s < mn) mn = s; if (f > mx) mx = f; });
  const act = kids.filter((c) => c.status !== STATUS.cancel);
  let tot = 0, dn = 0;
  act.forEach((c) => { const d = days(D(c.start), D(c.finish)) + 1; tot += d; dn += d * (Number(c.percent) || 0); });
  const pct = tot ? Math.round(dn / tot) : 0;
  const st = act.length === 0 ? STATUS.cancel : stOf(pct);
  return { ...t, start: iso(mn), finish: iso(mx), percent: pct, status: st };
}
/* daftar baris Gantt (pekerjaan + sub pekerjaan) untuk 1 kegiatan */
function buildRows(tasks, act, collapsed, all) {
  const list = tasks.filter((t) => t.act === act);
  const out = [];
  list.filter((t) => !t.parent).forEach((p) => {
    /* sub pekerjaan diurutkan otomatis: yang mulai lebih awal di atas
       (pengurutan hanya di dalam satu Pekerjaan, bukan lintas pekerjaan) */
    const kids = list.filter((k) => k.parent === p.id)
      .slice().sort((a, b) => (D(a.start) - D(b.start)) || (D(a.finish) - D(b.finish)) || a.name.localeCompare(b.name));
    const parent = rollup(p, kids);
    out.push({ ...parent, level: 0, kids: kids.length });
    if (all || !collapsed[p.id]) kids.forEach((k) => out.push({ ...k, level: 1, kids: 0 }));
  });
  return out;
}
/* progres keseluruhan (tertimbang durasi, hanya daun) */
function progressOf(tasks, act) {
  const list = tasks.filter((t) => (!act || t.act === act));
  const leaves = list.filter((t) => !list.some((x) => x.parent === t.id) && t.status !== STATUS.cancel);
  let tot = 0, dn = 0;
  leaves.forEach((t) => { const d = days(D(t.start), D(t.finish)) + 1; tot += d; dn += d * (Number(t.percent) || 0); });
  return tot ? Math.round(dn / tot) : 0;
}

/* ===== PENJADWALAN: predecessor, penyelesaian aktual, prediksi selesai ===== */
const effFinish = (t) => t.actualFinish || t.finish;
/* pekerjaan dianggap TERLAMBAT bila: selesai aktual melewati rencana, atau
   tanggal rencana sudah lewat tetapi progres belum 100% */
function isLate(t) {
  if (!t || t.status === STATUS.cancel) return false;
  if (t.actualFinish) return D(t.actualFinish) > D(t.finish);
  return (Number(t.percent) || 0) < 100 && D(t.finish) < todayNoon();
}
function lateInfo(t) {
  if (!isLate(t)) return null;
  const ref = t.actualFinish ? D(t.actualFinish) : todayNoon();
  return { hari: days(D(t.finish), ref), aktual: !!t.actualFinish };
}
const lateDays = (t) => (t.actualFinish ? days(D(t.finish), D(t.actualFinish)) : 0);
/* daftar penerus (successor) = kebalikan predecessor */
const succOf = (tasks, id) => tasks.filter((t) => (t.pred || []).indexOf(id) >= 0);
/* apakah menambah pred akan membuat lingkaran ketergantungan? */
function makesCycle(tasks, id, predId) {
  if (id === predId) return true;
  const byId = new Map(tasks.map((t) => [t.id, t]));
  const seen = new Set(); const stack = [predId];
  while (stack.length) {
    const cur = stack.pop();
    if (cur === id) return true;
    if (seen.has(cur)) continue; seen.add(cur);
    const t = byId.get(cur); if (!t) continue;
    (t.pred || []).forEach((p) => stack.push(p));
  }
  return false;
}
/* geser jadwal mengikuti ketergantungan: mulai paling awal = finish efektif
   predecessor + 1 hari. Durasi dipertahankan. Hanya pekerjaan ber-predecessor
   yang digeser, sehingga jadwal yang diatur manual tidak diacak. */
function recalcSchedule(tasks) {
  const byId = new Map(tasks.map((t) => [t.id, { ...t }]));
  const indeg = new Map(), adj = new Map();
  tasks.forEach((t) => { indeg.set(t.id, 0); adj.set(t.id, []); });
  tasks.forEach((t) => (t.pred || []).forEach((p) => {
    if (byId.has(p)) { adj.get(p).push(t.id); indeg.set(t.id, (indeg.get(t.id) || 0) + 1); }
  }));
  const q = tasks.filter((t) => indeg.get(t.id) === 0).map((t) => t.id);
  const order = [];
  while (q.length) {
    const id = q.shift(); order.push(id);
    adj.get(id).forEach((n) => { indeg.set(n, indeg.get(n) - 1); if (indeg.get(n) === 0) q.push(n); });
  }
  let moved = 0;
  order.forEach((id) => {
    const t = byId.get(id);
    const preds = (t.pred || []).map((p) => byId.get(p)).filter(Boolean);
    if (!preds.length) return;
    let latest = null;
    preds.forEach((p) => { const f = D(effFinish(p)); if (!latest || f > latest) latest = f; });
    const earliest = addDays(latest, 1);
    if (D(t.start) < earliest) {
      const dur = days(D(t.start), D(t.finish));
      t.start = iso(earliest); t.finish = iso(addDays(earliest, dur));
      moved++;
    }
  });
  return { tasks: tasks.map((t) => byId.get(t.id)), moved, cycle: order.length < tasks.length };
}
/* prediksi tanggal selesai proyek (setelah jadwal ulang, tanpa mengubah data) */
function predictFinish(tasks, act) {
  const info = predictFinishInfo(tasks, act);
  return info ? info.date : null;
}
/* prediksi rinci: tanggal + pekerjaan penentu + alasan (transparan) */
function predictFinishInfo(tasks, act) {
  const scope = tasks.filter((t) => (!act || t.act === act) && t.status !== STATUS.cancel);
  if (!scope.length) return null;
  const r = recalcSchedule(scope);
  const orig = new Map(scope.map((t) => [t.id, t]));
  let mx = null, driver = null;
  r.tasks.forEach((t) => { const f = D(effFinish(t)); if (!mx || f > mx) { mx = f; driver = t; } });
  if (!driver) return null;
  const o = orig.get(driver.id);
  let reason = "sesuai jadwal rencana";
  if (driver.actualFinish) reason = "penyelesaian aktual " + fmtDate(driver.actualFinish);
  else if (o && driver.finish !== o.finish) reason = "tergeser predecessor (rencana " + fmtDate(o.finish) + ")";
  else if ((driver.pred || []).length) reason = "menunggu " + (driver.pred || []).length + " predecessor";
  return { date: iso(mx), driver, reason, actLabel: actOf(driver.act).label, crossAct: !!(act && driver.act !== act) };
}

/* ===== GANTT (sumbu: Bulan + Minggu ke-, garis hari ini, tooltip tanggal) ===== */
function Gantt({ tasks, act, users, statusDate, editable, onChange, onEdit, onDelete, onAddSub, forExport }) {
  const [info, setInfo] = useState(null);
  const [drag, setDrag] = useState(null);
  const [collapsed, setCollapsed] = useState({});
  const [tip, setTip] = useState(null);
  const w = useWinW();
  const compact = w < 760;
  const rh = forExport ? 40 : 42, hMon = forExport ? 32 : 22, hWk = forExport ? 26 : 20;
  const hh = hMon + hWk;
  const leftW = forExport ? 340 : (compact ? 186 : (editable ? 392 : 286));
  const pbH = forExport ? 18 : 12, tbH2 = forExport ? 28 : 18;   // tinggi bar ekspor
  const rows = useMemo(() => buildRows(tasks, act, collapsed, forExport), [tasks, act, collapsed, forExport]);

  /* rentang selalu mencakup HARI INI + tanggal status, supaya garis penanda
     tampil di semua kegiatan (bukan cuma yang jadwalnya sedang berjalan) */
  const range = useMemo(() => {
    let mn = null, mx = null;
    rows.forEach((t) => { const s = D(t.start), f = D(t.finish); if (!mn || s < mn) mn = s; if (!mx || f > mx) mx = f; });
    if (!mn) { mn = D("2026-05-01"); mx = D("2027-04-30"); }
    const marks = [todayNoon(), D(statusDate)];
    marks.forEach((d) => { if (d < mn) mn = d; if (d > mx) mx = d; });
    return { min: mondayOf(addDays(mn, -7)), max: addDays(mondayOf(addDays(mx, 7)), 6) };
  }, [rows, statusDate]);

  const totalDays = days(range.min, range.max) + 1;
  /* Lebar 1 hari (px). Saat EKSPOR, lebarkan timeline agar rasio chart >= ~1.9
     (lebih lebar dari 16:9): hasil ekspor selalu penuh di lebar, ruang kosong
     jatuh di BAWAH (bukan kiri-kanan). Dibatasi min/maks agar bar wajar. */
  const px = useMemo(() => {
    const base = (forExport ? 22 : (compact ? 24 : 30)) / 7;
    if (!forExport) return base;
    const totalH = hh + rows.length * rh;
    const targetW = 1.9 * totalH - leftW;               // lebar timeline utk rasio 1.9
    return Math.min(9, Math.max(base, targetW / totalDays));
  }, [forExport, compact, rows.length, rh, hh, leftW, totalDays]);
  const wpx = px * 7;                                     // lebar 1 minggu (px)
  const W = totalDays * px;
  const xOf = (s) => days(range.min, D(s)) * px;
  const wOf = (s, f) => (days(D(s), D(f)) + 1) * px;

  const weeks = useMemo(() => {
    const out = []; let c = new Date(range.min);
    while (c <= range.max) { out.push({ start: new Date(c), left: days(range.min, c) * px, wk: isoWeek(c), yr: isoWeekYear(c) }); c = addDays(c, 7); }
    return out;
  }, [range, px]);
  const months = useMemo(() => {
    const a = []; let c = new Date(range.min.getFullYear(), range.min.getMonth(), 1);
    while (c <= range.max) {
      const s = c < range.min ? range.min : c;
      const nx = new Date(c.getFullYear(), c.getMonth() + 1, 1);
      const e = nx > range.max ? range.max : addDays(nx, -1);
      a.push({ label: `${MON[c.getMonth()]} ${String(c.getFullYear()).slice(2)}`, left: days(range.min, s) * px, width: (days(s, e) + 1) * px });
      c = nx;
    }
    return a;
  }, [range, px]);

  useEffect(() => {
    if (!drag) return;
    const move = (e) => { const dd = Math.round((e.clientX - drag.startX) / px); const s0 = D(drag.start), f0 = D(drag.finish); if (drag.mode === "move") onChange(drag.id, { start: iso(addDays(s0, dd)), finish: iso(addDays(f0, dd)) }); else { const nf = addDays(f0, dd); if (days(s0, nf) >= 0) onChange(drag.id, { finish: iso(nf) }); } };
    const up = () => setDrag(null);
    window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    return () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  }, [drag, onChange, px]);

  const A2 = actOf(act);
  useEffect(() => { setInfo(null); }, [act, rows.length]);
  const todayX = xOf(iso(todayNoon()));
  const bodyH = rows.length * rh;
  const rowTop = (id) => hh + Math.max(0, rows.findIndex((r) => r.id === id)) * rh;
  const outer = forExport ? { width: leftW + W } : {};
  const wkText = (k) => `Minggu ke-${k.wk} (${k.yr}) · ${fmtDate(iso(k.start))} – ${fmtDate(iso(addDays(k.start, 6)))}`;

  if (!rows.length) return <Card><Empty text="Belum ada pekerjaan pada kegiatan ini. Klik “Tambah Pekerjaan”." /></Card>;

  return <div>
    <div className={forExport ? "" : "scrollx"} style={{ borderRadius: 14, border: `1px solid ${C.line}`, background: "#fff", position: "relative" }}>
      <div style={{ display: "flex", minWidth: leftW + W, ...outer }}>
        {/* --- kolom kiri --- */}
        <div style={{ width: leftW, flexShrink: 0, borderRight: `1px solid ${C.line}`, position: forExport ? "static" : "sticky", left: 0, background: "#fff", zIndex: 3 }}>
          <div style={{ height: hh, display: "flex", alignItems: "center", padding: "0 12px", fontSize: 11, fontWeight: 700, color: C.slate, borderBottom: `1px solid ${C.line}`, background: C.bg }}>PEKERJAAN / SUB PEKERJAAN</div>
          {rows.map((t) => { const m = SMETA[t.status] || SMETA[STATUS.todo]; return (
            <div key={t.id} style={{ height: rh, display: "flex", alignItems: "center", gap: 6, padding: `0 10px 0 ${10 + t.level * 16}px`, borderBottom: `1px solid ${C.line}`, background: t.level === 0 ? "#FCFDFE" : "#fff", overflow: "hidden", boxSizing: "border-box" }}>
              {t.kids > 0 && !forExport ? <button onClick={() => setCollapsed((s) => ({ ...s, [t.id]: !s[t.id] }))} title={collapsed[t.id] ? "Buka" : "Tutup"} style={{ ...iconBtn, padding: 2, transform: collapsed[t.id] ? "rotate(-90deg)" : "none", transition: ".15s" }}><Ic name="chevD" size={14} /></button> : <span style={{ width: t.level === 0 ? 18 : 0 }} />}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: forExport ? 14.5 : (compact ? 12 : 13), lineHeight: 1.25, fontWeight: t.level === 0 ? 700 : 500, color: t.status === STATUS.cancel ? C.slate : C.ink, textDecoration: t.status === STATUS.cancel ? "line-through" : "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.name}</div>
                {!compact && <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 1 }}>
                  <span style={{ fontSize: forExport ? 12.5 : 10.5, color: C.slate, lineHeight: 1.25, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{fmtDate(t.start)} → {fmtDate(t.finish)}{t.kids > 0 ? ` · ${t.kids} sub` : ""}</span>
                  {(t.assignees || []).length > 0 && <span style={{ flexShrink: 0 }}><Avatars emails={t.assignees} users={users || []} size={forExport ? 14 : 16} /></span>}
                </div>}
              </div>
              <span title={`Prioritas ${t.prio || "Sedang"}`} style={{ width: 3, height: 15, borderRadius: 2, background: (PRIOC[t.prio] || PRIOC.Sedang).c, flexShrink: 0 }} />
              <span style={{ width: 7, height: 7, borderRadius: 99, background: m.bar, flexShrink: 0 }} title={t.status} />
              <span style={{ fontSize: 11.5, fontWeight: 700, color: t.percent >= 100 ? C.green : C.slate, fontVariantNumeric: "tabular-nums", minWidth: 30, textAlign: "right" }}>{t.percent}%</span>
              {editable && !forExport && <div style={{ display: "flex", gap: 1 }}>
                {t.level === 0 && <button title="Tambah sub pekerjaan" onClick={() => onAddSub(t)} style={{ ...iconBtn, color: C.blue }}><Ic name="plus" size={13} /></button>}
                <button title="Edit" onClick={() => onEdit(t)} style={iconBtn}><Ic name="pencil" size={13} /></button>
                <button title="Hapus" onClick={() => onDelete(t.id)} style={{ ...iconBtn, color: C.red }}><Ic name="trash" size={13} /></button>
              </div>}
            </div>); })}
        </div>

        {/* --- timeline --- */}
        <div style={{ position: "relative", width: W, flexShrink: 0 }} onMouseLeave={() => setTip(null)} onClick={(e) => { if (e.target === e.currentTarget) setInfo(null); }}>
          {/* header: baris bulan */}
          <div style={{ height: hMon, background: C.bg, position: "relative", borderBottom: `1px solid ${C.line}` }}>
            {months.map((m, i) => <div key={i} style={{ position: "absolute", left: m.left, width: m.width, top: 0, height: hMon, borderRight: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: forExport ? 14 : 10, fontWeight: 800, color: C.ink, letterSpacing: .2, overflow: "hidden", whiteSpace: "nowrap" }}>{m.width > 40 ? m.label : ""}</div>)}
          </div>
          {/* header: baris minggu ke- */}
          <div style={{ height: hWk, background: "#fff", position: "relative", borderBottom: `1px solid ${C.line}` }}>
            {weeks.map((k, i) => <div key={i}
              onMouseEnter={() => !forExport && setTip({ left: k.left + wpx / 2, text: wkText(k) })}
              title={wkText(k)}
              style={{ position: "absolute", left: k.left, width: wpx, top: 0, height: hWk, borderRight: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: forExport ? 11 : 9, fontWeight: 700, color: C.slate, cursor: forExport ? "default" : "help" }}>{k.wk}</div>)}
          </div>
          {/* grid mingguan + penanda */}
          <div style={{ position: "absolute", left: 0, top: hh, width: W, height: bodyH, pointerEvents: "none", zIndex: 0 }}>
            {weeks.map((k, i) => <div key={i} style={{ position: "absolute", left: k.left, top: 0, bottom: 0, width: 1, background: C.line }} />)}
          </div>
          <div title={`Hari ini · ${tglPanjang()}`} style={{ position: "absolute", left: todayX, top: hMon, height: bodyH + hWk, width: 2, background: C.amber, zIndex: 2 }} />
          <div style={{ position: "absolute", left: todayX, top: hMon + 1, transform: "translateX(-50%)", background: C.amber, color: "#fff", fontSize: forExport ? 11 : 8.5, fontWeight: 800, borderRadius: 4, padding: forExport ? "2px 7px" : "1px 5px", zIndex: 3, whiteSpace: "nowrap", pointerEvents: "none" }}>HARI INI</div>

          {/* baris bar */}
          {rows.map((t) => {
            const isP = t.kids > 0;
            const m = SMETA[t.status] || SMETA[STATUS.todo];
            const col = isP ? A2.color : m.bar;
            const canceled = t.status === STATUS.cancel;
            return <div key={t.id} style={{ height: rh, borderBottom: `1px solid ${C.line}`, position: "relative", background: t.level === 0 ? "#FCFDFE" : "#fff" }}>
              <div
                onMouseDown={(e) => { if (!editable || forExport || isP) return; setDrag({ id: t.id, mode: "move", startX: e.clientX, start: t.start, finish: t.finish }); }}
                onClick={() => { if (forExport) return; setInfo((v) => v && v.id === t.id ? null : { id: t.id, t, left: xOf(t.start), top: rowTop(t.id) }); }}
                title={`Klik untuk detail — ${t.name}`}
                style={{ position: "absolute", left: xOf(t.start), width: Math.max(6, wOf(t.start, t.finish)), top: isP ? (rh - pbH) / 2 : (rh - tbH2) / 2, height: isP ? pbH : tbH2, borderRadius: isP ? 4 : 6, background: canceled ? "#FDECEF" : col + (isP ? "" : "26"), border: `1px ${canceled ? "dashed" : "solid"} ${col}`, cursor: editable && !isP && !forExport ? "grab" : "default", overflow: "hidden", zIndex: 1, opacity: canceled ? .75 : 1 }}>
                {!isP && !canceled && <div style={{ width: `${Math.min(100, t.percent)}%`, height: "100%", background: col, opacity: .85 }} />}
              </div>
              {isLate(t) && <span title={`Terlambat ${lateInfo(t).hari} hari`} style={{ position: "absolute", left: xOf(t.start) + Math.max(6, wOf(t.start, t.finish)) + 5, top: (rh - 15) / 2, color: C.red, zIndex: 2, display: "grid", placeItems: "center" }}><Ic name="alert" size={13} /></span>}
              {editable && !forExport && !isP && <div onMouseDown={(e) => { e.stopPropagation(); setDrag({ id: t.id, mode: "resize", startX: e.clientX, start: t.start, finish: t.finish }); }} style={{ position: "absolute", left: xOf(t.start) + Math.max(6, wOf(t.start, t.finish)) - 5, top: (rh - 18) / 2, width: 10, height: 18, cursor: "ew-resize", zIndex: 2 }} />}
            </div>;
          })}

          {/* INFO BOX detail pekerjaan — muncul saat bar diklik */}
          {info && !forExport && (() => {

/* ===== MASTER GANTT (dashboard) — 3 kegiatan, hanya pekerjaan induk ===== */
function MasterGantt({ tasks, statusDate, forExport, summaryOnly, onToggleSummary }) {
  const [closed, setClosed] = useState({});
  const [tip, setTip] = useState(null);
  const w = useWinW();
  const compact = w < 760;
  const rhG = forExport ? 44 : 40, rhT = forExport ? 38 : 34;
  const hMon = forExport ? 32 : 22, hWk = forExport ? 26 : 20, hh = hMon + hWk;
  const leftW = forExport ? 320 : (compact ? 180 : 264);
  const gbH = forExport ? 26 : 16, tbH = forExport ? 22 : 13;   // tinggi bar (ekspor lebih besar)

  /* susun baris: header kegiatan + pekerjaan induk (sub pekerjaan tidak ditampilkan) */
  const groups = useMemo(() => ACTS.map((a) => {
    const list = tasks.filter((t) => t.act === a.key);
    const parents = list.filter((t) => !t.parent).map((p) => rollup(p, list.filter((k) => k.parent === p.id)));
    let mn = null, mx = null;
    parents.forEach((p) => { const sd = D(p.start), fd = D(p.finish); if (!mn || sd < mn) mn = sd; if (!mx || fd > mx) mx = fd; });
    return { act: a, parents, start: mn ? iso(mn) : null, finish: mx ? iso(mx) : null, pct: progressOf(tasks, a.key) };
  }).filter((g) => g.parents.length), [tasks]);

  const rows = [];
  groups.forEach((g) => {
    rows.push({ kind: "grp", g });
    if (!summaryOnly && !closed[g.act.key]) g.parents.forEach((p) => rows.push({ kind: "task", g, t: p }));
  });

  const range = useMemo(() => {
    let mn = null, mx = null;
    groups.forEach((g) => { if (g.start) { const sd = D(g.start), fd = D(g.finish); if (!mn || sd < mn) mn = sd; if (!mx || fd > mx) mx = fd; } });
    if (!mn) { mn = D("2026-05-01"); mx = D("2027-04-30"); }
    [todayNoon(), D(statusDate)].forEach((d) => { if (d < mn) mn = d; if (d > mx) mx = d; });
    return { min: mondayOf(addDays(mn, -7)), max: addDays(mondayOf(addDays(mx, 7)), 6) };
  }, [groups, statusDate]);

  const totalDays = days(range.min, range.max) + 1;
  const px = useMemo(() => {
    const base = (forExport ? 22 : (compact ? 22 : 26)) / 7;
    if (!forExport) return base;
    const totalH = hh + rows.reduce((a, r) => a + (r.kind === "grp" ? rhG : rhT), 0);
    const targetW = 1.9 * totalH - leftW;
    return Math.min(9, Math.max(base, targetW / totalDays));
  }, [forExport, compact, rows.length, rhG, rhT, hh, leftW, totalDays]);
  const wpx = px * 7;
  const W = totalDays * px;
  const xOf = (d) => days(range.min, D(d)) * px;
  const wOf = (a, b) => (days(D(a), D(b)) + 1) * px;
  const weeks = useMemo(() => { const o = []; let c = new Date(range.min); while (c <= range.max) { o.push({ start: new Date(c), left: days(range.min, c) * px, wk: isoWeek(c), yr: isoWeekYear(c) }); c = addDays(c, 7); } return o; }, [range, px]);
  const months = useMemo(() => {
    const a = []; let c = new Date(range.min.getFullYear(), range.min.getMonth(), 1);
    while (c <= range.max) { const st = c < range.min ? range.min : c; const nx = new Date(c.getFullYear(), c.getMonth() + 1, 1); const e = nx > range.max ? range.max : addDays(nx, -1);
      a.push({ label: `${MON[c.getMonth()]} ${String(c.getFullYear()).slice(2)}`, left: days(range.min, st) * px, width: (days(st, e) + 1) * px }); c = nx; }
    return a;
  }, [range, px]);

  const todayX = xOf(iso(todayNoon()));
  const bodyH = rows.reduce((a, r) => a + (r.kind === "grp" ? rhG : rhT), 0);
  const wkText = (k) => `Minggu ke-${k.wk} (${k.yr}) · ${fmtDate(iso(k.start))} – ${fmtDate(iso(addDays(k.start, 6)))}`;
  if (!rows.length) return <Empty text="Belum ada pekerjaan pada ketiga kegiatan." />;

  return <div>
    <div className={forExport ? "" : "scrollx"} style={{ borderRadius: 14, border: `1px solid ${C.line}`, background: "#fff", position: "relative" }}>
      <div style={{ display: "flex", minWidth: leftW + W, ...(forExport ? { width: leftW + W } : {}) }}>
        <div style={{ width: leftW, flexShrink: 0, borderRight: `1px solid ${C.line}`, position: forExport ? "static" : "sticky", left: 0, background: "#fff", zIndex: 3 }}>
          <div style={{ height: hh, display: "flex", alignItems: "center", padding: "0 12px", fontSize: 11, fontWeight: 700, color: C.slate, borderBottom: `1px solid ${C.line}`, background: C.bg }}>KEGIATAN / PEKERJAAN INDUK</div>
          {rows.map((r, i) => r.kind === "grp"
            ? <div key={"g" + i} style={{ height: rhG, display: "flex", alignItems: "center", gap: 7, padding: "0 10px", borderBottom: `1px solid ${C.line}`, background: r.g.act.soft, overflow: "hidden", boxSizing: "border-box" }}>
                {!forExport && !summaryOnly && <button onClick={() => setClosed((s) => ({ ...s, [r.g.act.key]: !s[r.g.act.key] }))} style={{ ...iconBtn, padding: 2, color: r.g.act.color, transform: closed[r.g.act.key] ? "rotate(-90deg)" : "none", transition: ".15s" }}><Ic name="chevD" size={14} /></button>}
                <span style={{ color: r.g.act.color, flexShrink: 0, display: "grid", placeItems: "center" }}><Ic name={r.g.act.icon} size={forExport ? 19 : 15} /></span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: forExport ? 17 : 13, fontWeight: 800, color: r.g.act.color, lineHeight: 1.25, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.g.act.label}</div>
                  <div style={{ fontSize: forExport ? 13 : 10.5, color: C.slate, lineHeight: 1.25, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{fmtDate(r.g.start)} → {fmtDate(r.g.finish)} · {r.g.parents.length} pekerjaan</div>
                </div>
                <span style={{ fontSize: forExport ? 15 : 12, fontWeight: 800, color: r.g.act.color, fontVariantNumeric: "tabular-nums" }}>{r.g.pct}%</span>
              </div>
            : <div key={"t" + i} style={{ height: rhT, display: "flex", alignItems: "center", gap: 6, padding: "0 10px 0 30px", borderBottom: `1px solid ${C.line}`, background: "#fff", overflow: "hidden", boxSizing: "border-box" }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: forExport ? 14.5 : 12.5, fontWeight: 600, lineHeight: 1.25, color: r.t.status === STATUS.cancel ? C.slate : C.ink, textDecoration: r.t.status === STATUS.cancel ? "line-through" : "none", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.t.name}</div>
                  <div style={{ fontSize: forExport ? 12.5 : 10, color: C.slate, lineHeight: 1.2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{fmtDate(r.t.start)} → {fmtDate(r.t.finish)}</div>
                </div>
                <span style={{ width: 6, height: 6, borderRadius: 99, background: (SMETA[r.t.status] || SMETA[STATUS.todo]).bar, flexShrink: 0 }} />
                <span style={{ fontSize: forExport ? 13.5 : 11.5, fontWeight: 700, color: r.t.percent >= 100 ? C.green : C.slate, fontVariantNumeric: "tabular-nums", minWidth: 28, textAlign: "right" }}>{r.t.percent}%</span>
              </div>)}
        </div>

        <div style={{ position: "relative", width: W, flexShrink: 0 }} onMouseLeave={() => setTip(null)}>
          <div style={{ height: hMon, background: C.bg, position: "relative", borderBottom: `1px solid ${C.line}` }}>
            {months.map((m, i) => <div key={i} style={{ position: "absolute", left: m.left, width: m.width, top: 0, height: hMon, borderRight: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: forExport ? 14 : 10, fontWeight: 800, color: C.ink, overflow: "hidden", whiteSpace: "nowrap" }}>{m.width > 40 ? m.label : ""}</div>)}
          </div>
          <div style={{ height: hWk, background: "#fff", position: "relative", borderBottom: `1px solid ${C.line}` }}>
            {weeks.map((k, i) => <div key={i} onMouseEnter={() => !forExport && setTip({ left: k.left + wpx / 2, text: wkText(k) })} title={wkText(k)}
              style={{ position: "absolute", left: k.left, width: wpx, top: 0, height: hWk, borderRight: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: forExport ? 11 : 8.5, fontWeight: 700, color: C.slate, cursor: forExport ? "default" : "help" }}>{k.wk}</div>)}
          </div>
          <div style={{ position: "absolute", left: 0, top: hh, width: W, height: bodyH, pointerEvents: "none", zIndex: 0 }}>
            {weeks.map((k, i) => <div key={i} style={{ position: "absolute", left: k.left, top: 0, bottom: 0, width: 1, background: C.line }} />)}
          </div>
          <div title={`Hari ini · ${tglPanjang()}`} style={{ position: "absolute", left: todayX, top: hMon, height: bodyH + hWk, width: 2, background: C.amber, zIndex: 2 }} />
          <div style={{ position: "absolute", left: todayX, top: hMon + 1, transform: "translateX(-50%)", background: C.amber, color: "#fff", fontSize: forExport ? 11 : 8.5, fontWeight: 800, borderRadius: 4, padding: forExport ? "2px 7px" : "1px 5px", zIndex: 3, whiteSpace: "nowrap", pointerEvents: "none" }}>HARI INI</div>

          {rows.map((r, i) => {
            if (r.kind === "grp") {
              const a = r.g.act;
              return <div key={"gb" + i} style={{ height: rhG, borderBottom: `1px solid ${C.line}`, position: "relative", background: a.soft }}>
                {r.g.start && <div title={`${a.label} · ${fmtDate(r.g.start)} → ${fmtDate(r.g.finish)} · ${r.g.pct}%`}
                  style={{ position: "absolute", left: xOf(r.g.start), width: Math.max(8, wOf(r.g.start, r.g.finish)), top: (rhG - gbH) / 2, height: gbH, borderRadius: 5, background: "#fff", border: `1.5px solid ${a.color}`, overflow: "hidden", zIndex: 1 }}>
                  <div style={{ width: `${Math.min(100, r.g.pct)}%`, height: "100%", background: a.color, opacity: .85 }} />
                </div>}
              </div>;
            }
            const m = SMETA[r.t.status] || SMETA[STATUS.todo];
            const canceled = r.t.status === STATUS.cancel;
            return <div key={"tb" + i} style={{ height: rhT, borderBottom: `1px solid ${C.line}`, position: "relative", background: "#fff" }}>
              <div title={`${r.t.name} · ${fmtDate(r.t.start)} → ${fmtDate(r.t.finish)} · ${r.t.percent}% · ${r.t.status}`}
                style={{ position: "absolute", left: xOf(r.t.start), width: Math.max(6, wOf(r.t.start, r.t.finish)), top: (rhT - tbH) / 2, height: tbH, borderRadius: 4, background: canceled ? "#FDECEF" : m.bar + "26", border: `1px ${canceled ? "dashed" : "solid"} ${m.bar}`, overflow: "hidden", zIndex: 1, opacity: canceled ? .75 : 1 }}>
                {!canceled && <div style={{ width: `${Math.min(100, r.t.percent)}%`, height: "100%", background: m.bar, opacity: .85 }} />}
              </div>
            </div>;
          })}
          {tip && !forExport && <div style={{ position: "absolute", left: tip.left, top: hh + 4, transform: "translateX(-50%)", background: C.ink, color: "#fff", fontSize: 10.5, fontWeight: 600, padding: "5px 9px", borderRadius: 7, whiteSpace: "nowrap", pointerEvents: "none", zIndex: 9, boxShadow: "0 6px 18px rgba(19,41,61,.28)" }}>{tip.text}</div>}
        </div>
      </div>
    </div>
    {!forExport && <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 10, fontSize: 11.5, color: C.slate, alignItems: "center" }}>
      {ACTS.map((a) => <span key={a.key} style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 14, height: 8, borderRadius: 3, background: "#fff", border: `1.5px solid ${a.color}` }} /> {a.label}</span>)}
      <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 2, height: 12, background: C.amber }} /> Hari ini</span>
      <span style={{ marginLeft: "auto" }}>Hanya pekerjaan induk · sub pekerjaan tidak ditampilkan</span>
    </div>}
  </div>;
}

/* ===== TASK MODAL ===== */
/* --- pemilih ketergantungan: Kegiatan -> Pekerjaan -> Sub Pekerjaan --- */
function DepPicker({ tasks, exclude, onPick, label }) {
  const [ak, setAk] = useState(ACTS[0] ? ACTS[0].key : "");
  const [pid, setPid] = useState("");
  const parents = tasks.filter((t) => t.act === ak && !t.parent);
  const kids = pid ? tasks.filter((t) => t.parent === pid).slice().sort((a, b) => D(a.start) - D(b.start)) : [];
  const pick = (id) => { if (!id || exclude.indexOf(id) >= 0) return; onPick(id); };
  return <div style={{ display: "grid", gap: 7 }}>
    <div className="g3" style={{ gap: 7 }}>
      <Sel value={ak} onChange={(e) => { setAk(e.target.value); setPid(""); }} style={{ fontSize: 12.5, padding: "7px 9px" }}>
        {ACTS.map((a) => <option key={a.key} value={a.key}>{a.label}</option>)}
      </Sel>
      <Sel value={pid} onChange={(e) => setPid(e.target.value)} style={{ fontSize: 12.5, padding: "7px 9px" }}>
        <option value="">— pilih pekerjaan —</option>
        {parents.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
      </Sel>
      <Sel value="" onChange={(e) => pick(e.target.value)} disabled={!pid} style={{ fontSize: 12.5, padding: "7px 9px" }}>
        <option value="">{kids.length ? "— pilih sub pekerjaan —" : "(tanpa sub pekerjaan)"}</option>
        {pid && <option value={pid}>▲ {parents.find((x) => x.id === pid) ? parents.find((x) => x.id === pid).name : ""} (pekerjaan induk)</option>}
        {kids.map((k) => <option key={k.id} value={k.id} disabled={exclude.indexOf(k.id) >= 0}>{fmtDate(k.start)} · {k.name}</option>)}
      </Sel>
    </div>
    <div style={{ fontSize: 11, color: C.slate }}>{label}</div>
  </div>;
}

function TaskModal({ task, act, tasks, users, onClose, onSave }) {
  const parents = tasks.filter((t) => t.act === act && !t.parent && (!task || t.id !== task.id));
  const hasKids = task ? tasks.some((t) => t.parent === task.id) : false;
  const [f, setF] = useState(() => {
    const base = task || { name: "", act, parent: null, start: PROJECT.statusDate, finish: PROJECT.statusDate, percent: 0, status: STATUS.todo, note: "", assignees: [], prio: "Sedang", actualFinish: "", pred: [], todos: [] };
    const isSub0 = !!base.parent && !hasKids;
    const todos = isSub0 ? ((base.todos && base.todos.length) ? base.todos : [{ id: uid(), text: "", done: false }]) : [];
    return { ...base, todos, pred: base.pred || [], actualFinish: base.actualFinish || "" };
  });
  const showTodo = !!f.parent && !hasKids; /* to-do hanya untuk sub pekerjaan */
  const [succ, setSucc] = useState(task ? succOf(tasks, task.id).map((t) => t.id) : []);
  const [err, setErr] = useState("");
  const set = (k, v) => setF((s) => ({ ...s, [k]: v }));
  const setTodo = (id, patch) => setF((s) => ({ ...s, todos: s.todos.map((t) => t.id === id ? { ...t, ...patch } : t) }));
  const addTodo = () => setF((s) => ({ ...s, todos: [...s.todos, { id: uid(), text: "", done: false }] }));
  const delTodo = (id) => setF((s) => s.todos.length <= 1 ? s : ({ ...s, todos: s.todos.filter((t) => t.id !== id) }));
  const share = f.todos.length ? 100 / f.todos.length : 0;
  const doneN = f.todos.filter((t) => t.done).length;
  const autoPct = f.todos.length ? Math.round(doneN / f.todos.length * 100) : (Number(f.percent) || 0);
  const late = f.actualFinish && f.finish ? days(D(f.finish), D(f.actualFinish)) : 0;

  const save = () => {
    setErr("");
    if (!f.name.trim()) { setErr("Nama pekerjaan wajib diisi."); return; }
    if (!f.start || !f.finish) { setErr("Tanggal mulai dan selesai wajib diisi."); return; }
    if (D(f.finish) < D(f.start)) { setErr("Tanggal selesai tidak boleh mendahului tanggal mulai."); return; }
    if (showTodo) {
      if (f.todos.length < 1) { setErr("Minimal 1 to-do list wajib diisi."); return; }
      if (f.todos.some((t) => !t.text.trim())) { setErr("Semua to-do list wajib diisi teksnya (atau hapus baris yang kosong)."); return; }
    }
    if (f.actualFinish && D(f.actualFinish) < D(f.start)) { setErr("Penyelesaian aktual tidak boleh mendahului tanggal mulai."); return; }
    const pct = showTodo ? autoPct : (hasKids ? Number(f.percent) || 0 : Number(f.percent) || 0);
    onSave({ ...f, act, percent: pct, status: f.status === STATUS.cancel ? STATUS.cancel : stOf(pct), todos: showTodo ? f.todos.map((t) => ({ ...t, text: t.text.trim() })) : [], _succ: succ });
  };
  const exclude = [task ? task.id : "x", ...f.pred];
  return <Modal title={task ? "Edit Pekerjaan" : "Tambah Pekerjaan"} onClose={onClose} width={620}>
    <ReqNote />
    <Field label="Nama pekerjaan" req><Input value={f.name} onChange={(e) => set("name", e.target.value)} placeholder="mis. Proses Tender / Market Survei" /></Field>
    <div style={{ marginTop: 12 }}><Field label="Induk (kosongkan bila ini Pekerjaan utama)">
      <Sel value={f.parent || ""} onChange={(e) => set("parent", e.target.value || null)} disabled={hasKids}>
        <option value="">— Pekerjaan utama —</option>
        {parents.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
      </Sel>
    </Field>{hasKids && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 4 }}>Pekerjaan ini punya sub pekerjaan, jadi induknya tidak bisa diubah.</div>}</div>

    <div className="g3" style={{ marginTop: 12, gap: 12 }}>
      <Field label="Mulai" req><Input type="date" value={f.start} onChange={(e) => set("start", e.target.value)} disabled={hasKids} /></Field>
      <Field label="Selesai (rencana)" req><Input type="date" value={f.finish} onChange={(e) => set("finish", e.target.value)} disabled={hasKids} /></Field>
      <Field label="Penyelesaian aktual"><Input type="date" value={f.actualFinish || ""} onChange={(e) => set("actualFinish", e.target.value)} disabled={hasKids} /></Field>
    </div>
    {f.actualFinish && <div style={{ fontSize: 12, fontWeight: 700, marginTop: 4, color: late > 0 ? C.red : C.green }}>
      {late > 0 ? `Telat ${late} hari — pekerjaan penerus akan otomatis mundur saat dijadwalkan ulang.` : late < 0 ? `Lebih cepat ${Math.abs(late)} hari dari rencana.` : "Tepat sesuai rencana."}
    </div>}

    <div className="g2" style={{ marginTop: 12 }}>
      <Field label="Status" req><Sel value={f.status} onChange={(e) => set("status", e.target.value)} disabled={hasKids}>{KCOLS.map((s) => <option key={s}>{s}</option>)}</Sel></Field>
      <Field label="Skala prioritas" req><Sel value={f.prio || "Sedang"} onChange={(e) => set("prio", e.target.value)}>{PRIO.map((x) => <option key={x}>{x}</option>)}</Sel></Field>
    </div>

    {/* ---- TO-DO LIST penentu persentase ---- */}
    {showTodo && <div style={{ marginTop: 16, border: `1px solid ${C.line}`, borderRadius: 12, padding: 12, background: "#FBFCFE" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: C.ink }}>To-do list penentu progres <span style={{ color: C.red }}>*</span></div>
        <div style={{ fontSize: 11.5, color: C.slate }}>{f.todos.length} item · masing-masing bernilai <b style={{ color: C.violet }}>{share.toFixed(1)}%</b></div>
      </div>
      <div style={{ display: "grid", gap: 6 }}>
        {f.todos.map((t, i) => <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <button onClick={() => setTodo(t.id, { done: !t.done })} title={t.done ? "Tandai belum selesai" : "Tandai selesai"}
            style={{ width: 20, height: 20, borderRadius: 6, border: `2px solid ${t.done ? C.green : "#C7D2DE"}`, background: t.done ? C.green : "#fff", color: "#fff", cursor: "pointer", display: "grid", placeItems: "center", flexShrink: 0, padding: 0 }}>
            {t.done && <Ic name="check" size={11} />}
          </button>
          <Input value={t.text} onChange={(e) => setTodo(t.id, { text: e.target.value })} placeholder={`Langkah ${i + 1}`} style={{ flex: 1, padding: "7px 10px", fontSize: 12.5, textDecoration: t.done ? "line-through" : "none", color: t.done ? C.slate : C.ink }} />
          <span style={{ fontSize: 11, fontWeight: 700, color: t.done ? C.green : "#A9B7C6", width: 44, textAlign: "right", flexShrink: 0 }}>{t.done ? "+" + share.toFixed(1) + "%" : share.toFixed(1) + "%"}</span>
          <button onClick={() => delTodo(t.id)} disabled={f.todos.length <= 1} title={f.todos.length <= 1 ? "Minimal 1 to-do wajib ada" : "Hapus to-do"}
            style={{ ...iconBtn, color: f.todos.length <= 1 ? "#D3DCE6" : C.red, cursor: f.todos.length <= 1 ? "not-allowed" : "pointer", flexShrink: 0 }}><Ic name="trash" size={13} /></button>
        </div>)}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10, flexWrap: "wrap" }}>
        <Btn size="sm" kind="ghost" onClick={addTodo}><Ic name="plus" size={13} /> Tambah to-do</Btn>
        <div style={{ flex: 1, minWidth: 120 }}><Bar pct={autoPct} color={autoPct >= 100 ? C.green : C.violet} /></div>
        <div style={{ fontSize: 13, fontWeight: 800, color: autoPct >= 100 ? C.green : C.ink }}>{doneN}/{f.todos.length} · {autoPct}%</div>
      </div>
      <div style={{ fontSize: 11, color: C.slate, marginTop: 6 }}>Progres pekerjaan dihitung otomatis dari to-do yang tercentang, jadi tidak lagi menebak angka persen.</div>
    </div>}
    {hasKids && <div style={{ marginTop: 14 }}><Field label="Progres (otomatis dari sub pekerjaan)"><Input value={f.percent + "%"} disabled /></Field></div>}
    {!f.parent && !hasKids && <div style={{ marginTop: 14 }}>
      <Field label="Progres manual">
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <input type="range" min="0" max="100" value={Number(f.percent) || 0} onChange={(e) => set("percent", Number(e.target.value))} style={{ flex: 1 }} />
          <span style={{ fontSize: 13, fontWeight: 800, color: C.ink, fontVariantNumeric: "tabular-nums", width: 42, textAlign: "right" }}>{Number(f.percent) || 0}%</span>
        </div>
      </Field>
      <div style={{ fontSize: 11, color: C.slate, marginTop: 4 }}>Pekerjaan utama tanpa sub pekerjaan — progres diatur manual. Tambahkan sub pekerjaan agar progres dihitung otomatis dari to-do list.</div>
    </div>}

    {/* ---- KETERGANTUNGAN ---- */}
    <div style={{ marginTop: 16, border: `1px solid ${C.line}`, borderRadius: 12, padding: 12 }}>
      <div style={{ fontSize: 12.5, fontWeight: 800, color: C.ink, marginBottom: 8 }}>Ketergantungan jadwal</div>
      <div style={{ fontSize: 12, fontWeight: 700, color: C.slate, marginBottom: 5 }}>Predecessor — pekerjaan yang harus selesai lebih dulu</div>
      <DepPicker tasks={tasks} exclude={exclude} label="Pilih kegiatan → pekerjaan → sub pekerjaan. Bisa lintas kegiatan."
        onPick={(id) => { if (task && makesCycle(tasks, task.id, id)) { setErr("Tidak bisa: akan membuat ketergantungan melingkar."); return; } setErr(""); set("pred", [...f.pred, id]); }} />
      <DepChips ids={f.pred} tasks={tasks} color={C.blue} onRemove={(id) => set("pred", f.pred.filter((x) => x !== id))} />
      <div style={{ fontSize: 12, fontWeight: 700, color: C.slate, margin: "12px 0 5px" }}>Successor — pekerjaan yang menunggu pekerjaan ini</div>
      {task ? <>
        <DepPicker tasks={tasks} exclude={[task.id, ...succ]} label="Pekerjaan terpilih akan otomatis mundur bila pekerjaan ini telat."
          onPick={(id) => { if (makesCycle(tasks, id, task.id)) { setErr("Tidak bisa: akan membuat ketergantungan melingkar."); return; } setErr(""); setSucc((s) => [...s, id]); }} />
        <DepChips ids={succ} tasks={tasks} color={C.orange} onRemove={(id) => setSucc((s) => s.filter((x) => x !== id))} />
      </> : <div style={{ fontSize: 12, color: "#A9B7C6" }}>Simpan pekerjaan ini dulu, successor bisa diatur setelahnya.</div>}
    </div>

    {/* ---- PIC ---- */}
    <div style={{ marginTop: 16 }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: C.slate, marginBottom: 6 }}>PIC pekerjaan ({(f.assignees || []).length} orang) — otomatis muncul di menu “Tugas Saya” masing-masing</div>
      <div style={{ maxHeight: 168, overflow: "auto", border: `1px solid ${C.line}`, borderRadius: 11, padding: 6 }}>
        {(users || []).filter((u) => u.active && !u.pending).map((u) => { const on = isAssigned(users, f.assignees, u); return (
          <button key={u.id} onClick={() => set("assignees", on ? (f.assignees || []).filter((x) => x !== u.id && x !== uname(u)) : [...(f.assignees || []), u.id])}
            style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "7px 9px", borderRadius: 9, border: "none", background: on ? C.violetSoft : "transparent", cursor: "pointer", textAlign: "left", marginBottom: 2 }}>
            <span style={{ width: 18, height: 18, borderRadius: 6, border: `2px solid ${on ? C.violet : "#C7D2DE"}`, background: on ? C.violet : "#fff", color: "#fff", display: "grid", placeItems: "center", flexShrink: 0 }}>{on && <Ic name="check" size={10} />}</span>
            <span style={{ width: 25, height: 25, borderRadius: 99, background: u.role === ROLE.pm ? C.blueSoft : C.greenSoft, color: u.role === ROLE.pm ? C.blue : C.green, display: "grid", placeItems: "center", fontSize: 11, fontWeight: 800, flexShrink: 0 }}>{(u.name || "?")[0].toUpperCase()}</span>
            <span style={{ minWidth: 0 }}><span style={{ display: "block", fontSize: 12.5, fontWeight: 600, color: C.ink }}>{u.name}</span><span style={{ display: "block", fontSize: 10.5, color: C.slate }}>{uname(u)}</span></span>
          </button>); })}
        {(users || []).filter((u) => u.active && !u.pending).length === 0 && <Empty text="Belum ada user aktif." />}
      </div>
    </div>

    <div style={{ marginTop: 12 }}><Field label="Catatan"><Area value={f.note || ""} onChange={(e) => set("note", e.target.value)} placeholder="Catatan pelaksanaan" style={{ minHeight: 64 }} /></Field></div>
    {err && <div style={{ color: C.red, fontSize: 12.5, marginTop: 10, fontWeight: 600 }}>{err}</div>}
    <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 18 }}><Btn kind="ghost" onClick={onClose}>Batal</Btn><Btn onClick={save}>{task ? "Simpan" : "Tambah"}</Btn></div>
  </Modal>;
}

function Avatars({ emails, users, size = 22 }) {
  const list = (emails || []).slice(0, 4);
  if (!list.length) return <span style={{ fontSize: 10.5, color: C.slate }}>belum ditugaskan</span>;
  return <div style={{ display: "flex", alignItems: "center" }}>
    {list.map((em, i) => {
      const u = findUser(users, em);
      const nm = u ? u.name : em;
      const pm = u && u.role === ROLE.pm;
      return <span key={em} title={nm + (u ? ` · ${u.role}` : "")} style={{ width: size, height: size, borderRadius: 99, background: pm ? C.blueSoft : C.greenSoft, color: pm ? C.blue : C.green, border: "2px solid #fff", marginLeft: i ? -7 : 0, display: "grid", placeItems: "center", fontSize: size * .45, fontWeight: 800, flexShrink: 0 }}>{(nm || "?")[0].toUpperCase()}</span>;
    })}
    {(emails || []).length > 4 && <span style={{ fontSize: 10.5, color: C.slate, marginLeft: 5 }}>+{emails.length - 4}</span>}
  </div>;
}
