function PunchReport({ punch, stage, loc, onClose }) {
  const rows = punch.filter((p) => !stage || p.stage === stage);
  const tdC = { border: "1px solid #9AA7B4", padding: "7px 8px", fontSize: 11.5, color: "#1F2D3D", verticalAlign: "top" };
  const thC = { border: "1px solid #9AA7B4", padding: "7px 8px", fontSize: 11, fontWeight: 700, color: "#13293D", background: "#EEF3F8", textAlign: "center" };
  const info = (l, v) => <tr><td style={{ padding: "2px 0", fontSize: 12, color: "#6B7A8D", width: 130, verticalAlign: "top" }}>{l}</td><td style={{ padding: "2px 6px", fontSize: 12, color: "#6B7A8D", verticalAlign: "top" }}>:</td><td style={{ padding: "2px 0", fontSize: 12.5, fontWeight: 600, color: "#13293D" }}>{v}</td></tr>;
  const signCol = (line1, role) => <div className="sign-block" style={{ flex: 1, textAlign: "center", fontSize: 12.5, color: "#13293D" }}>
    <div>{line1}</div><div style={{ height: 74 }} />
    <div style={{ borderTop: "1px solid #13293D", width: "78%", margin: "0 auto", paddingTop: 6, fontWeight: 700 }}>(&nbsp;.................................&nbsp;)</div>
    <div style={{ fontWeight: 700, marginTop: 3 }}>{role}</div>
  </div>;
  return <div className="print-doc" style={{ position: "fixed", inset: 0, background: "#E2E8EF", zIndex: 130, overflow: "auto", padding: "22px 14px" }}>
    <div className="no-print" style={{ maxWidth: 820, margin: "0 auto 14px", display: "flex", justifyContent: "space-between", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
      <div style={{ fontSize: 13, color: "#3a4858", fontWeight: 600 }}>Pratinjau laporan — klik <b>Cetak / Simpan PDF</b>, lalu pilih “Save as PDF”.</div>
      <div style={{ display: "flex", gap: 8 }}>
        <Btn kind="ghost" onClick={onClose}><Ic name="x" size={15} /> Tutup</Btn>
        <Btn kind="green" onClick={() => window.print()}><Ic name="download" size={15} /> Cetak / Simpan PDF</Btn>
      </div>
    </div>
    <div className="print-paper" style={{ maxWidth: 820, margin: "0 auto", background: "#fff", borderRadius: 4, boxShadow: "0 10px 30px rgba(19,41,61,.18)", padding: "34px 38px", color: "#13293D" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 14, borderBottom: "2px solid #13293D", paddingBottom: 12 }}>
        <Logo size={44} radius={9} />
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 18, fontWeight: 800, letterSpacing: .2 }}>LAPORAN PUNCHLIST</div>
          <div style={{ fontSize: 12.5, color: "#6B7A8D" }}>{PROJECT.name} · {PROJECT.sub}</div>
        </div>
      </div>
      <table style={{ marginTop: 14, borderCollapse: "collapse" }}><tbody>
        {info("Tahapan", stage || "Semua tahap")}
        {info("Lokasi Pekerjaan", loc || "-")}
        {info("Tanggal Cetak", tglPanjang())}
        {info("Jumlah Temuan", `${rows.length} temuan`)}
      </tbody></table>
      <table style={{ width: "100%", borderCollapse: "collapse", marginTop: 16 }}>
        <thead><tr>
          <th style={{ ...thC, width: 34 }}>No.</th><th style={{ ...thC, width: "26%" }}>Nama Temuan</th>
          <th style={{ ...thC, width: "18%" }}>Lokasi</th><th style={{ ...thC, width: 108 }}>Gambar</th><th style={thC}>Keterangan</th>
        </tr></thead>
        <tbody>
          {rows.map((p, i) => <tr key={p.id}>
            <td style={{ ...tdC, textAlign: "center" }}>{i + 1}</td>
            <td style={tdC}><div style={{ fontWeight: 700 }}>{p.title}</div><div style={{ fontSize: 10.5, color: "#6B7A8D", marginTop: 2 }}>{p.stage} · {p.severity} · {p.status}</div></td>
            <td style={tdC}>{p.loc || "-"}</td>
            <td style={{ ...tdC, textAlign: "center" }}>{p.photo ? <img src={p.photo} alt="" style={{ width: 96, height: 72, objectFit: "cover", border: "1px solid #9AA7B4" }} /> : <span style={{ fontSize: 10.5, color: "#6B7A8D" }}>tidak ada</span>}</td>
            <td style={tdC}>{p.note || "-"}<div style={{ fontSize: 10.5, color: "#6B7A8D", marginTop: 3 }}>Target: {fmtDate(p.due)}</div></td>
          </tr>)}
          {rows.length === 0 && <tr><td colSpan={5} style={{ ...tdC, textAlign: "center", color: "#6B7A8D" }}>Tidak ada temuan pada tahapan ini.</td></tr>}
        </tbody>
      </table>
      <div className="sign-block" style={{ marginTop: 26 }}>
        <div style={{ textAlign: "right", fontSize: 12.5, marginBottom: 12 }}>Jakarta, {tglPanjang()}</div>
        <div style={{ display: "flex", gap: 24 }}>
          {signCol("Disiapkan oleh,", "Departemen General Affairs")}
          {signCol("Mengetahui,", "Pihak Kontraktor")}
        </div>
      </div>
    </div>
  </div>;
}
function Punchlist({ punch, setPunch, tasks, can, log }) {
  const [modal, setModal] = useState(null);
  const [reportCfg, setReportCfg] = useState(false);
  const [report, setReport] = useState(null);
  const [fStage, setFStage] = useState("");
  const [fStatus, setFStatus] = useState("");
  const save = (data) => {
    if (data.id) { setPunch((s) => s.map((p) => p.id === data.id ? data : p)); log && log("Edit temuan", data.title); }
    else { setPunch((s) => [{ ...data, id: uid() }, ...s]); log && log("Tambah temuan", data.title); }
    setModal(null);
  };
  const setStatus = (id, st) => { setPunch((s) => s.map((p) => p.id === id ? { ...p, status: st } : p)); const it = punch.find((p) => p.id === id); log && log("Ubah status temuan", `${it ? it.title : id} → ${st}`); };
  const list = punch.filter((p) => (!fStage || p.stage === fStage) && (!fStatus || p.status === fStatus));
  const byStage = {};
  punch.forEach((p) => { (byStage[p.stage] = byStage[p.stage] || []).push(p); });
  const stageRows = Object.keys(byStage).map((st) => { const it = byStage[st]; const done = it.filter((x) => x.status === PST.done).length; return { stage: st, total: it.length, open: it.filter((x) => x.status === PST.open).length, prog: it.filter((x) => x.status === PST.prog).length, done }; });
  const cnt = { open: punch.filter((p) => p.status === PST.open).length, prog: punch.filter((p) => p.status === PST.prog).length, done: punch.filter((p) => p.status === PST.done).length };
  const th = { textAlign: "left", fontSize: 11, fontWeight: 700, color: C.slate, padding: "10px 8px", borderBottom: `1px solid ${C.line}`, textTransform: "uppercase", letterSpacing: .3, whiteSpace: "nowrap" };
  const td = { padding: "9px 8px", borderBottom: `1px solid ${C.line}`, fontSize: 13, color: C.ink, verticalAlign: "top" };
  const allStages = Array.from(new Set([...tasks.map((t) => t.name), ...punch.map((p) => p.stage)]));
  return <div className="g1">
    <div className="g4">
      <Stat label="Total Temuan" value={punch.length} icon="clipboard" color={C.ink} />
      <Stat label="Terbuka" value={cnt.open} icon="alert" color={C.red} />
      <Stat label="Proses" value={cnt.prog} icon="trending" color={C.amber} />
      <Stat label="Selesai" value={cnt.done} icon="check" color={C.green} />
    </div>
    <Card>
      <CardHead icon="clipboard" title="Monitor Punchlist per Tahap" right={
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <Btn kind="ghost" onClick={() => setReportCfg(true)}><Ic name="file" size={16} /> Simpan PDF</Btn>
          {can.manage && <Btn onClick={() => setModal({})}><Ic name="plus" size={16} /> Tambah Temuan</Btn>}
        </div>} />
      {stageRows.length === 0 ? <Empty text="Belum ada temuan." /> :
        <div style={{ display: "grid", gap: 10 }}>{stageRows.map((r) => { const pct = r.total ? Math.round(r.done / r.total * 100) : 0; return (
          <div key={r.stage} style={{ display: "flex", alignItems: "center", gap: 14, padding: "10px 12px", border: `1px solid ${C.line}`, borderRadius: 12, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 220px", minWidth: 0 }}><div style={{ fontSize: 13.5, fontWeight: 700, color: C.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.stage}</div>
              <div style={{ marginTop: 6, height: 6, background: C.bg, borderRadius: 99, overflow: "hidden", maxWidth: 320 }}><div style={{ width: `${pct}%`, height: "100%", background: C.green }} /></div></div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}><Pill text={`${r.open} Terbuka`} color={C.red} bg="#FDECEF" /><Pill text={`${r.prog} Proses`} color={C.amber} bg="#FCF3E2" /><Pill text={`${r.done}/${r.total} Selesai`} color={C.green} bg={C.greenSoft} /></div>
          </div>); })}</div>}
    </Card>
    <Card>
      <CardHead icon="alert" title="Daftar Temuan" color={C.amber} right={
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <Sel value={fStage} onChange={(e) => setFStage(e.target.value)} style={{ width: 190, padding: "7px 10px" }}><option value="">Semua tahap</option>{allStages.map((n) => <option key={n}>{n}</option>)}</Sel>
          <Sel value={fStatus} onChange={(e) => setFStatus(e.target.value)} style={{ width: 135, padding: "7px 10px" }}><option value="">Semua status</option>{[PST.open, PST.prog, PST.done].map((s) => <option key={s}>{s}</option>)}</Sel>
        </div>} />
      <div className="scrollx"><table style={{ width: "100%", borderCollapse: "collapse", minWidth: 760 }}>
        <thead><tr><th style={th}>Temuan</th><th style={th}>Tahap</th><th style={th}>Severity</th><th style={{ ...th, width: 150 }}>Status</th><th style={th}>Due</th><th style={{ ...th, width: 60 }}></th></tr></thead>
        <tbody>{list.map((p) => <tr key={p.id}>
          <td style={td}><div style={{ display: "flex", gap: 10 }}>{p.photo && <img src={p.photo} alt="" style={{ width: 42, height: 42, objectFit: "cover", borderRadius: 8, border: `1px solid ${C.line}`, flexShrink: 0 }} />}<div><div style={{ fontWeight: 600 }}>{p.title}</div>{p.loc && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 2 }}>Lokasi: {p.loc}</div>}{p.note && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 2 }}>{p.note}</div>}</div></div></td>
          <td style={{ ...td, fontSize: 12.5, color: C.slate }}>{p.stage}</td>
          <td style={td}><Pill text={p.severity} color={SEVC[p.severity]} bg={SEVC[p.severity] + "1A"} /></td>
          <td style={td}><Sel value={p.status} disabled={!can.manage} onChange={(e) => setStatus(p.id, e.target.value)} style={{ padding: "5px 8px", fontSize: 12.5, color: PMETA[p.status].color, fontWeight: 700, background: PMETA[p.status].bg, border: `1px solid ${C.line}` }}>{[PST.open, PST.prog, PST.done].map((s) => <option key={s} style={{ color: C.ink, background: "#fff" }}>{s}</option>)}</Sel></td>
          <td style={{ ...td, fontVariantNumeric: "tabular-nums", color: C.slate, whiteSpace: "nowrap" }}>{fmtDate(p.due)}</td>
          <td style={td}>{can.manage && <div style={{ display: "flex", gap: 2 }}><button onClick={() => setModal({ item: p })} style={iconBtn}><Ic name="pencil" size={14} /></button><button onClick={() => { setPunch((s) => s.filter((x) => x.id !== p.id)); log && log("Hapus temuan", p.title); }} style={{ ...iconBtn, color: C.red }}><Ic name="trash" size={14} /></button></div>}</td>
        </tr>)}
        {list.length === 0 && <tr><td colSpan={6}><Empty text="Tidak ada temuan untuk filter ini." /></td></tr>}
        </tbody></table></div>
    </Card>
    {modal && can.manage && <PunchModal item={modal.item} stages={allStages} onSave={save} onClose={() => setModal(null)} />}
    {reportCfg && <PunchReportModal stages={allStages} defaultStage={fStage} onClose={() => setReportCfg(false)} onMake={(cfg) => { setReport(cfg); setReportCfg(false); log && log("Cetak laporan punchlist", cfg.stage || "Semua tahap"); }} />}
    {report && <PunchReport punch={punch} stage={report.stage} loc={report.loc} onClose={() => setReport(null)} />}
  </div>;
}

/* ===== TUGAS SAYA (checklist ala OneNote) ===== */
function MyTasks({ mytasks, setMytasks, users, user, isPM, log }) {
  const [scope, setScope] = useState("me");          // me | all (khusus PM)
  const [openG, setOpenG] = useState({});
  const [adding, setAdding] = useState(null);        // status grup yang sedang ditambah
  const [draft, setDraft] = useState({ text: "", owner: "", prio: "Sedang", due: "" });
  const me = (user.email || "").toLowerCase();
  const scoped = (isPM && scope === "all") ? mytasks : mytasks.filter((t) => (t.owner || "").toLowerCase() === me);
  const userOf = (em) => users.find((u) => (u.email || "").toLowerCase() === (em || "").toLowerCase());
  const upd = (id, patch) => setMytasks((s) => s.map((t) => t.id === id ? { ...t, ...patch } : t));
  const setStatus = (t, st) => { upd(t.id, { status: st, done: st === MST.done }); log && log("Ubah status tugas", `${t.text} → ${st}`); };
  const cycle = (t) => { const i = MCOLS.indexOf(t.status || MST.todo); setStatus(t, MCOLS[(i + 1) % MCOLS.length]); };
  const del = (t) => { setMytasks((s) => s.filter((x) => x.id !== t.id)); log && log("Hapus tugas", t.text); };
  const startAdd = (st) => { setAdding(st); setDraft({ text: "", owner: me, prio: "Sedang", due: "" }); };
  const commit = () => {
    const v = draft.text.trim(); if (!v) { setAdding(null); return; }
    const owner = (isPM && draft.owner ? draft.owner : me).toLowerCase();
    setMytasks((s) => [...s, { id: uid(), owner, text: v, status: adding, done: adding === MST.done, prio: draft.prio, due: draft.due }]);
    log && log("Tambah tugas", `${v}${owner !== me ? " → " + owner : ""}`);
    setDraft((d) => ({ ...d, text: "" }));
  };
  const total = scoped.length, done = scoped.filter((t) => (t.status || MST.todo) === MST.done).length;
  const late = scoped.filter((t) => t.due && (t.status || MST.todo) !== MST.done && D(t.due) < todayNoon()).length;
  const th = { textAlign: "left", fontSize: 10.5, fontWeight: 700, color: "#9AAABC", padding: "7px 10px", textTransform: "uppercase", letterSpacing: .4, whiteSpace: "nowrap" };
  const td = { padding: "9px 10px", fontSize: 13, color: C.ink, borderTop: `1px solid ${C.line}`, verticalAlign: "middle" };
  return <div className="g1">
    <div className="g4">
      <Stat label="Total Tugas" value={total} icon="tasks" color={C.ink} />
      <Stat label="Selesai" value={done} sub={total ? Math.round(done / total * 100) + "% tuntas" : "—"} icon="check" color={C.green} />
      <Stat label="Dikerjakan" value={scoped.filter((t) => (t.status || MST.todo) === MST.doing).length} icon="half" color={C.amber} />
      <Stat label="Lewat Tenggat" value={late} icon="alert" color={C.red} />
    </div>
    <Card style={{ padding: 0, overflow: "hidden" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "16px 18px", borderBottom: `1px solid ${C.line}`, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
          <span style={{ width: 30, height: 30, borderRadius: 9, background: C.violetSoft, color: C.violet, display: "grid", placeItems: "center", flexShrink: 0 }}><Ic name="tasks" size={16} /></span>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 15, color: C.ink }}>Tugas Saya</div>
            <div style={{ fontSize: 11.5, color: C.slate, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{scope === "all" ? "Semua tugas tim" : `${user.name} · ${user.email}`}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {isPM && <Sel value={scope} onChange={(e) => setScope(e.target.value)} style={{ width: 168, padding: "7px 10px" }}>
            <option value="me">Hanya tugas saya</option><option value="all">Semua tugas tim</option>
          </Sel>}
          <Btn onClick={() => startAdd(MST.todo)}><Ic name="plus" size={15} /> Tugas Baru</Btn>
        </div>
      </div>

      {MCOLS.map((st) => {
        const items = scoped.filter((t) => (t.status || MST.todo) === st);
        const m = MMETA[st];
        const closed = openG[st];
        return <div key={st} style={{ borderBottom: `1px solid ${C.line}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "11px 16px", background: "#FBFCFE" }}>
            <button onClick={() => setOpenG((s) => ({ ...s, [st]: !s[st] }))} style={{ ...iconBtn, padding: 2, transform: closed ? "rotate(-90deg)" : "none", transition: ".15s" }}><Ic name="chevD" size={15} /></button>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12, fontWeight: 700, color: m.color, background: m.bg, borderRadius: 99, padding: "4px 11px" }}><Ic name={m.icon} size={12} /> {st}</span>
            <span style={{ fontSize: 11.5, color: C.slate, fontWeight: 600 }}>{items.length}</span>
          </div>
          {!closed && <div className="scrollx">
            <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 720 }}>
              <thead><tr><th style={{ ...th, width: "44%" }}>Nama Tugas</th><th style={th}>Penanggung Jawab</th><th style={th}>Tenggat</th><th style={th}>Prioritas</th><th style={{ ...th, width: 44 }}></th></tr></thead>
              <tbody>
                {items.map((t) => {
                  const u = userOf(t.owner);
                  const isLate = t.due && st !== MST.done && D(t.due) < todayNoon();
                  return <tr key={t.id}>
                    <td style={td}><div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <button onClick={() => cycle(t)} title="Klik untuk ganti status"
                        style={{ width: 20, height: 20, borderRadius: 99, border: `2px solid ${st === MST.done ? C.green : (st === MST.doing ? C.amber : "#C7D2DE")}`, background: st === MST.done ? C.green : "#fff", color: "#fff", cursor: "pointer", display: "grid", placeItems: "center", flexShrink: 0, padding: 0 }}>
                        {st === MST.done && <Ic name="check" size={11} />}
                        {st === MST.doing && <span style={{ width: 8, height: 8, borderRadius: 99, background: C.amber }} />}
                      </button>
                      <input value={t.text} onChange={(e) => upd(t.id, { text: e.target.value })}
                        style={{ flex: 1, minWidth: 0, border: "1px solid transparent", background: "transparent", fontSize: 13.5, fontFamily: "inherit", color: st === MST.done ? C.slate : C.ink, textDecoration: st === MST.done ? "line-through" : "none", padding: "4px 6px", borderRadius: 8, outline: "none" }}
                        onFocus={(e) => { e.target.style.border = `1px solid ${C.violet}`; e.target.style.background = "#fff"; }}
                        onBlur={(e) => { e.target.style.border = "1px solid transparent"; e.target.style.background = "transparent"; }} />
                    </div></td>
                    <td style={td}>{u
                      ? <span style={{ display: "inline-flex", alignItems: "center", gap: 7 }}><span style={{ width: 24, height: 24, borderRadius: 99, background: u.role === ROLE.pm ? C.blueSoft : C.greenSoft, color: u.role === ROLE.pm ? C.blue : C.green, display: "grid", placeItems: "center", fontSize: 11, fontWeight: 800 }}>{(u.name || "?")[0].toUpperCase()}</span><span style={{ fontSize: 12.5 }}>{u.name}</span></span>
                      : <span style={{ fontSize: 12, color: C.slate }}>{t.owner}</span>}</td>
                    <td style={td}>{t.due
                      ? <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 12.5, color: isLate ? C.red : C.slate, fontWeight: isLate ? 700 : 500 }}><Ic name="calendar" size={12} /> {fmtDate(t.due)}</span>
                      : <label style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 12, color: "#A9B7C6", cursor: "pointer" }}><Ic name="calendar" size={12} /> atur tanggal<input type="date" onChange={(e) => upd(t.id, { due: e.target.value })} style={{ display: "none" }} /></label>}</td>
                    <td style={td}><Sel value={t.prio || "Sedang"} onChange={(e) => upd(t.id, { prio: e.target.value })}
                      style={{ width: 112, padding: "4px 8px", fontSize: 11.5, fontWeight: 700, color: (PRIOC[t.prio] || PRIOC.Sedang).c, background: (PRIOC[t.prio] || PRIOC.Sedang).b, border: "none" }}>
                      {PRIO.map((x) => <option key={x} style={{ color: C.ink, background: "#fff" }}>{x}</option>)}
                    </Sel></td>
                    <td style={td}><button onClick={() => del(t)} style={{ ...iconBtn, color: C.red }}><Ic name="trash" size={14} /></button></td>
                  </tr>;
                })}
                {adding === st && <tr><td style={td} colSpan={5}>
                  <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                    <Input autoFocus value={draft.text} onChange={(e) => setDraft((d) => ({ ...d, text: e.target.value }))}
                      onKeyDown={(e) => { if (e.key === "Enter") commit(); if (e.key === "Escape") setAdding(null); }}
                      placeholder="Nama tugas — Enter untuk simpan, Esc untuk tutup" style={{ flex: "1 1 240px" }} />
                    {isPM && <Sel value={draft.owner} onChange={(e) => setDraft((d) => ({ ...d, owner: e.target.value }))} style={{ width: 170 }}>
                      {users.filter((u) => u.active).map((u) => <option key={u.id} value={u.email}>{u.name}</option>)}
                    </Sel>}
                    <Input type="date" value={draft.due} onChange={(e) => setDraft((d) => ({ ...d, due: e.target.value }))} style={{ width: 150 }} />
                    <Sel value={draft.prio} onChange={(e) => setDraft((d) => ({ ...d, prio: e.target.value }))} style={{ width: 118 }}>{PRIO.map((x) => <option key={x}>{x}</option>)}</Sel>
                    <Btn size="sm" onClick={commit}>Simpan</Btn>
                    <Btn size="sm" kind="ghost" onClick={() => setAdding(null)}>Tutup</Btn>
                  </div>
                </td></tr>}
                {items.length === 0 && adding !== st && <tr><td style={{ ...td, color: "#A9B7C6", fontSize: 12.5 }} colSpan={5}>Belum ada tugas pada grup ini.</td></tr>}
                <tr><td style={{ ...td, paddingTop: 8, paddingBottom: 10 }} colSpan={5}>
                  <button onClick={() => startAdd(st)} style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "none", border: "none", color: C.violet, fontSize: 12.5, fontWeight: 700, cursor: "pointer", padding: "2px 0" }}><Ic name="plus" size={14} /> Tambah Tugas</button>
                </td></tr>
              </tbody>
            </table>
          </div>}
        </div>;
      })}
    </Card>
  </div>;
}

/* ===== MANAJEMEN USER (khusus Project Management) ===== */
function UserModal({ item, existing, onSave, onClose }) {
  const isNew = !item;
  const [f, setF] = useState(item || { name: "", email: "", role: ROLE.admin, active: true });
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [info, setInfo] = useState("");
  const set = (k, v) => setF((s) => ({ ...s, [k]: v }));
  const save = async () => {
    setErr(""); setInfo("");
    const email = (f.email || "").trim().toLowerCase();
    if (!f.name.trim() || !email) { setErr("Nama dan email wajib diisi."); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { setErr("Format email tidak valid."); return; }
    if (isNew && existing.some((u) => (u.email || "").toLowerCase() === email)) { setErr("Email ini sudah terdaftar di portal."); return; }
    if (isNew) {
      if (pw.length < 8) { setErr("Password minimal 8 karakter."); return; }
      if (pw !== pw2) { setErr("Konfirmasi password tidak sama."); return; }
      setBusy(true);
      try {
        const r = await portalCreateUser(email, pw);
        if (r.exists) { setErr("Email sudah punya akun login di Supabase. Tetap bisa ditambahkan ke portal — kosongkan lalu simpan sebagai user lama."); setBusy(false); return; }
        onSave({ ...f, email }, r.needConfirm ? "Akun dibuat. Supabase meminta konfirmasi email sebelum user bisa login." : "");
      } catch (e) { setErr(e.message || "Gagal membuat akun."); setBusy(false); }
    } else onSave({ ...f, email }, "");
  };
  const doReset = async () => {
    setErr(""); setInfo(""); setBusy(true);
    try { await portalResetPassword(f.email); setInfo("Tautan atur ulang password sudah dikirim ke " + f.email + "."); }
    catch (e) { setErr(e.message || "Gagal mengirim tautan."); }
    setBusy(false);
  };
  return <Modal title={isNew ? "Tambah User Baru" : "Edit User"} onClose={onClose} width={500}>
    <Field label="Nama lengkap"><Input value={f.name} onChange={(e) => set("name", e.target.value)} placeholder="mis. Budi Santoso" /></Field>
    <div style={{ marginTop: 12 }}><Field label="Email (dipakai untuk login)">
      <Input type="email" value={f.email} onChange={(e) => set("email", e.target.value)} disabled={!isNew} placeholder="nama@perusahaan.com" />
    </Field>{!isNew && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 4 }}>Email tidak bisa diubah karena terikat ke akun login.</div>}</div>
    {isNew && <div className="g2" style={{ marginTop: 12 }}>
      <Field label="Password awal (min. 8 karakter)"><Input type="password" value={pw} onChange={(e) => setPw(e.target.value)} placeholder="••••••••" /></Field>
      <Field label="Ulangi password"><Input type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} placeholder="••••••••" /></Field>
    </div>}
    <div className="g2" style={{ marginTop: 12 }}>
      <Field label="Role"><Sel value={f.role} onChange={(e) => set("role", e.target.value)}>{[ROLE.pm, ROLE.admin].map((r) => <option key={r}>{r}</option>)}</Sel></Field>
      <Field label="Status akses"><Sel value={f.active ? "Aktif" : "Nonaktif"} onChange={(e) => set("active", e.target.value === "Aktif")}><option>Aktif</option><option>Nonaktif</option></Sel></Field>
    </div>
    <div style={{ marginTop: 12, fontSize: 12, color: C.slate, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 10, padding: "10px 12px" }}>
      {isNew
        ? "Akun login dibuat langsung dari portal ini — tidak perlu membuka Supabase. Beri tahu user email & password awalnya, lalu minta ia menggantinya."
        : "Role “Nonaktif” langsung memblokir user tersebut masuk ke portal pada login berikutnya."}
    </div>
    {err && <div style={{ color: C.red, fontSize: 12.5, marginTop: 10 }}>{err}</div>}
    {info && <div style={{ color: C.green, fontSize: 12.5, marginTop: 10 }}>{info}</div>}
    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, marginTop: 18, flexWrap: "wrap" }}>
      {!isNew && LIVE ? <Btn kind="ghost" onClick={doReset} disabled={busy}><Ic name="key" size={15} /> Kirim reset password</Btn> : <span />}
      <div style={{ display: "flex", gap: 8 }}>
        <Btn kind="ghost" onClick={onClose}>Batal</Btn>
        <Btn onClick={save} disabled={busy} style={{ opacity: busy ? .7 : 1 }}>{busy ? "Memproses…" : (isNew ? "Buat Akun" : "Simpan")}</Btn>
      </div>
    </div>
  </Modal>;
}

const PAGE_SIZES = [["20", 20], ["50", 50], ["100", 100], ["Semua", 0]];
function Logs({ logs }) {
  const [size, setSize] = useState(20);
  const [page, setPage] = useState(1);
  const [q, setQ] = useState("");
  const filtered = useMemo(() => {
    const s = q.trim().toLowerCase();
    if (!s) return logs;
    return logs.filter((l) => [l.actor, l.action, l.detail].join(" ").toLowerCase().includes(s));
  }, [logs, q]);
  const per = size === 0 ? filtered.length || 1 : size;
  const pages = Math.max(1, Math.ceil(filtered.length / per));
  const cur = Math.min(page, pages);
  const slice = size === 0 ? filtered : filtered.slice((cur - 1) * per, cur * per);
  useEffect(() => { setPage(1); }, [size, q]);
  const th = { textAlign: "left", fontSize: 11, fontWeight: 700, color: C.slate, padding: "10px 10px", borderBottom: `1px solid ${C.line}`, textTransform: "uppercase", letterSpacing: .3, background: "#fff", position: "sticky", top: 0, zIndex: 1, whiteSpace: "nowrap" };
  const td = { padding: "9px 10px", borderBottom: `1px solid ${C.line}`, fontSize: 12.8, color: C.ink, verticalAlign: "top" };
  return <div className="g1">
    <Card>
      <CardHead icon="history" title="Log Aktivitas" color={C.slate} right={
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <Input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Cari aktivitas…" style={{ width: 190, padding: "7px 10px" }} />
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 12, color: C.slate, whiteSpace: "nowrap" }}>Tampilkan</span>
            <Sel value={String(size)} onChange={(e) => setSize(Number(e.target.value))} style={{ width: 104, padding: "7px 10px" }}>
              {PAGE_SIZES.map(([lb, v]) => <option key={lb} value={String(v)}>{lb}</option>)}
            </Sel>
          </div>
        </div>} />
      {/* Tinggi tabel TETAP (scrollable) walau opsi "Semua" dipilih */}
      <div style={{ height: 430, overflow: "auto", border: `1px solid ${C.line}`, borderRadius: 12, background: "#fff" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 660 }}>
          <thead><tr><th style={{ ...th, width: 150 }}>Waktu</th><th style={{ ...th, width: 190 }}>Pengguna</th><th style={{ ...th, width: 210 }}>Aksi</th><th style={th}>Detail</th></tr></thead>
          <tbody>
            {slice.map((l) => <tr key={l.id}>
              <td style={{ ...td, color: C.slate, whiteSpace: "nowrap", fontVariantNumeric: "tabular-nums" }}>{fmtStamp(l.ts)}</td>
              <td style={{ ...td, fontWeight: 600 }}>{l.actor}</td>
              <td style={td}><Pill text={l.action} color={C.blue} bg={C.blueSoft} /></td>
              <td style={{ ...td, color: C.slate }}>{l.detail || "-"}</td>
            </tr>)}
            {slice.length === 0 && <tr><td colSpan={4}><Empty text="Belum ada aktivitas tercatat." /></td></tr>}
          </tbody>
        </table>
      </div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 12, gap: 10, flexWrap: "wrap" }}>
        <div style={{ fontSize: 12.5, color: C.slate }}>
          {filtered.length === 0 ? "0 entri" : size === 0
            ? `Menampilkan semua ${filtered.length} entri`
            : `Menampilkan ${(cur - 1) * per + 1}–${Math.min(cur * per, filtered.length)} dari ${filtered.length} entri`}
        </div>
        {size !== 0 && <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <Btn kind="ghost" size="sm" onClick={() => setPage(1)} disabled={cur === 1} style={{ opacity: cur === 1 ? .45 : 1 }}>«</Btn>
          <Btn kind="ghost" size="sm" onClick={() => setPage(cur - 1)} disabled={cur === 1} style={{ opacity: cur === 1 ? .45 : 1 }}><Ic name="chevL" size={13} /></Btn>
          <span style={{ fontSize: 12.5, color: C.ink, fontWeight: 600, padding: "0 6px" }}>Hal. {cur} / {pages}</span>
          <Btn kind="ghost" size="sm" onClick={() => setPage(cur + 1)} disabled={cur === pages} style={{ opacity: cur === pages ? .45 : 1 }}><Ic name="chevR" size={13} /></Btn>
          <Btn kind="ghost" size="sm" onClick={() => setPage(pages)} disabled={cur === pages} style={{ opacity: cur === pages ? .45 : 1 }}>»</Btn>
        </div>}
      </div>
    </Card>
  </div>;
}

    </div>}

        <span style={{ color: r.ok ? C.green : C.red, flexShrink: 0, marginTop: 1 }}><Ic name={r.ok ? "check" : "x"} size={15} /></span>

          <div style={{ fontSize: 13, fontWeight: 700, color: C.ink }}>{r.name}</div>

      Jika ada baris merah: jalankan ulang <b>database.sql</b> di Supabase SQL Editor (aman diulang), pastikan bucket <b>{BUCKET}</b> ada, lalu tes lagi.

  </Modal>;
}

/* ===== HALAMAN KEGIATAN (Gantt + Kanban) ===== */
function ActivityPage({ act, tasks, setTasks, users, can, log, onExport, exporting }) {
  const [tab, setTab] = useState("gantt");
  const [modal, setModal] = useState(null);
  const [view, setView] = useState(null);
  const [note, setNote] = useState(null);
  const A2 = actOf(act);
  const updTask = (id, patch) => setTasks((s) => s.map((t) => { if (t.id !== id) return t; const n = { ...t, ...patch }; if ("percent" in patch && n.status !== STATUS.cancel) n.status = stOf(n.percent); return n; }));
  const saveTask = (data) => {
    if (data.id) { setTasks((s) => s.map((t) => t.id === data.id ? { ...t, ...data } : t)); log && log("Edit pekerjaan", `${A2.label}: ${data.name}`); }
    else { setTasks((s) => [...s, { ...data, id: uid(), note: data.note || "", assignees: data.assignees || [] }]); log && log("Tambah pekerjaan", `${A2.label}: ${data.name}`); }
    setModal(null);
  };
  const delTask = (id) => {
    const t = tasks.find((x) => x.id === id);
    setTasks((s) => s.filter((x) => x.id !== id && x.parent !== id));
    log && log("Hapus pekerjaan", `${A2.label}: ${t ? t.name : id}`);
  };
  const moveKanban = (id, col) => {
    setTasks((s) => s.map((t) => {
      if (t.id !== id) return t;
      let pct = t.percent;
      if (col === STATUS.done) pct = 100; else if (col === STATUS.todo) pct = 0;
      else if (col === STATUS.doing && (pct === 0 || pct === 100)) pct = 50;
      return { ...t, status: col, percent: pct };
    }));
    const t = tasks.find((x) => x.id === id); log && log("Ubah status Kanban", `${t ? t.name : id} → ${col}`);
  };
  const saveNote = (patch) => {
    setTasks((s) => s.map((t) => t.id === note.id ? { ...t, ...patch } : t));
    log && log("Catatan & penugasan", `${note.name} · ${(patch.assignees || []).length} orang`);
    setNote(null);
  };
  const list = tasks.filter((t) => t.act === act);
  const leaves = list.filter((t) => !list.some((x) => x.parent === t.id));
  const counts = {}; KCOLS.forEach((k) => (counts[k] = 0));
  leaves.forEach((t) => (counts[t.status] = (counts[t.status] || 0) + 1));
  const pct = progressOf(tasks, act);
  const TabBtn = ({ id, icon, label }) => <button onClick={() => setTab(id)} style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "8px 14px", borderRadius: 10, border: `1px solid ${tab === id ? C.violet : C.line}`, background: tab === id ? C.violetSoft : "#fff", color: tab === id ? C.violet : C.slate, fontWeight: 700, fontSize: 13, cursor: "pointer" }}><Ic name={icon} size={15} /> {label}</button>;
  return <div className="g1">
    <div className="g4">
      <Stat label="Progres Kegiatan" value={pct + "%"} sub={`${list.filter((t) => !t.parent).length} pekerjaan · ${leaves.length} item`} icon="trending" color={A2.color} />
      <Stat label={STATUS.doing} value={counts[STATUS.doing]} icon="kanban" color={C.blue} />
      <Stat label={STATUS.done} value={counts[STATUS.done]} icon="check" color={C.green} />
      <Stat label={STATUS.cancel} value={counts[STATUS.cancel]} icon="x" color={C.red} />
    </div>
    <Card>
      <CardHead icon={A2.icon} color={A2.color} title={`Kegiatan ${A2.label}`} right={
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {tab === "gantt" && <Btn kind="ghost" onClick={onExport} disabled={exporting}><Ic name="download" size={16} /> {exporting ? "Menyiapkan…" : "Unduh PNG"}</Btn>}
          {can.manage && <Btn onClick={() => setModal({ task: null })}><Ic name="plus" size={16} /> Tambah Pekerjaan</Btn>}
        </div>} />
      <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
        <TabBtn id="gantt" icon="calendar" label="Gantt Chart" />
        <TabBtn id="kanban" icon="kanban" label="Kanban" />
        <TabBtn id="week" icon="clock" label="Kalender Mingguan" />
      </div>
      <div style={{ fontSize: 12.5, color: C.slate, marginBottom: 12 }}>
        {tab === "gantt"
          ? (can.manage
            ? "Sumbu waktu: bulan + minggu ke- dalam tahun (arahkan kursor ke nomor minggu untuk melihat tanggalnya). Seret bar sub pekerjaan untuk menggeser jadwal, tarik ujung kanan untuk mengubah durasi. Bar pekerjaan utama dihitung otomatis dari sub pekerjaannya."
            : "Sumbu waktu: bulan + minggu ke- dalam tahun (arahkan kursor ke nomor minggu untuk melihat tanggalnya). Role Admin hanya dapat melihat jadwal.")
          : (can.manage
            ? "Seret kartu antar kolom untuk mengubah status. Ikon mata = detail, ikon pensil = catatan & penugasan."
            : "Seret kartu antar kolom untuk mengubah status (diizinkan untuk Admin). Ikon mata untuk melihat detail dan catatan.")}
      </div>
      {tab === "gantt" && <Gantt tasks={tasks} act={act} statusDate={PROJECT.statusDate} editable={can.manage} onChange={updTask} onEdit={(t) => setModal({ task: t })} onDelete={delTask} onAddSub={(p) => setModal({ task: { name: "", act, parent: p.id, start: p.start, finish: p.finish, percent: 0, status: STATUS.todo, note: "", assignees: [], prio: "Sedang" } })} />}
      {tab === "kanban" && <Kanban tasks={tasks} act={act} users={users} onMove={moveKanban} onView={setView} onNote={setNote} onAdd={() => setModal({ task: null })} canMove={can.kanban} canNote={can.manage} />}
      {tab === "week" && <WeekCalendar tasks={tasks} act={act} users={users} onView={setView} />}
    </Card>
    {modal && can.manage && <TaskModal task={modal.task && modal.task.id ? modal.task : (modal.task || null)} act={act} tasks={tasks} onClose={() => setModal(null)} onSave={saveTask} />}
    {view && <TaskViewModal task={view} tasks={tasks} users={users} onClose={() => setView(null)} />}
    {note && can.manage && <TaskNoteModal task={note} users={users} onSave={saveNote} onClose={() => setNote(null)} />}
  </div>;
}

/* ===== APP ===== */
function App() {
  const [user, setUser] = useState(null);
  const [booting, setBooting] = useState(LIVE);
  const [ready, setReady] = useState(!LIVE);
  const [loadErr, setLoadErr] = useState("");
  const [denied, setDenied] = useState("");
  const [page, setPage] = useState("dashboard");
  const [tasks, setTasks] = useState(SEED_TASKS);
  const [rab, setRab] = useState(SEED_RAB);
  const [trans, setTrans] = useState(SEED_TRANS);
  const [fee, setFee] = useState(SEED_FEE);
  const [terms, setTerms] = useState(SEED_TERMS);
  const [docs, setDocs] = useState(SEED_DOCS);
  const [punch, setPunch] = useState(SEED_PUNCH);
  const [users, setUsers] = useState(SEED_USERS);
  const [mytasks, setMytasks] = useState(SEED_MYTASKS);
  const [logs, setLogs] = useState([]);
  const [exportAct, setExportAct] = useState(null);
  const [diag, setDiag] = useState(false);
  const syncSt = useSyncState();
  const ganttRef = useRef(null);
  const scWrapRef = useRef(null);
  const w = useWinW();
  const isMobile = w < 900;
  const [sidebar, setSidebar] = useState(true);
  useEffect(() => { setSidebar(!isMobile); }, [isMobile]);

  const userRef = useRef(null); userRef.current = user;
  const log = useMemo(() => (action, detail) => {
    const u = userRef.current;
    setLogs((s) => [{ id: uid(), ts: nowISO(), actor: u ? (u.name || u.email) : "Sistem", action, detail: detail || "" }, ...s].slice(0, 1000));
  }, []);

  const scToday = useMemo(() => todayMarkerData(rab, fee, terms, trans), [rab, fee, terms, trans]);
  const sc = useMemo(() => sCurve(rab, fee, terms, trans), [rab, fee, terms, trans]);
  const cTotal = sumCost(rab), trTotal = sumCost(trans);
  const proj = cTotal + fee + trTotal;
  const overall = useMemo(() => progressOf(tasks, null), [tasks]);
  const nextPay = terms.filter((t) => D(t.date) >= D(PROJECT.statusDate)).sort((a, b) => D(a.date) - D(b.date))[0];
  const punchOpen = punch.filter((p) => p.status !== PST.done).length;
  const myOpen = user ? mytasks.filter((t) => (t.owner || "").toLowerCase() === (user.email || "").toLowerCase() && !t.done).length : 0;

  const exportSCurvePNG = () => {
    const svg = scWrapRef.current && scWrapRef.current.querySelector("svg");
    if (!svg || typeof XMLSerializer === "undefined") { alert("Grafik belum siap. Coba lagi."); return; }
    const vb = svg.viewBox.baseVal;
    const wd = vb && vb.width ? vb.width : 1080, h = vb && vb.height ? vb.height : 260;
    const clone = svg.cloneNode(true);
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    clone.setAttribute("width", wd); clone.setAttribute("height", h);
    const xml = new XMLSerializer().serializeToString(clone);
    const src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
    const img = new Image();
    img.onload = () => {
      const scale = 2, headerH = 70, footerH = 30;
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(wd * scale); canvas.height = Math.round((h + headerH + footerH) * scale);
      const ctx = canvas.getContext("2d"); ctx.scale(scale, scale);
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, wd, h + headerH + footerH);
      ctx.fillStyle = C.ink; ctx.font = "700 17px Inter, Arial, sans-serif"; ctx.textBaseline = "alphabetic";
      ctx.fillText("Kurva-S — " + PROJECT.name, 18, 28);
      ctx.fillStyle = C.slate; ctx.font = "500 12px Inter, Arial, sans-serif";
      ctx.fillText("Kontraktor · Konsultan · Transisi · Total — posisi per " + tglPanjang(), 18, 48);
      ctx.drawImage(img, 0, headerH, wd, h);
      ctx.fillStyle = C.slate; ctx.font = "500 10.5px Inter, Arial, sans-serif";
      ctx.fillText("Hari ini: " + SERIES.map(([k]) => k + " " + scToday.vals[k] + "%").join(" · "), 18, h + headerH + 20);
      const a = document.createElement("a"); a.href = canvas.toDataURL("image/png"); a.download = "S-Curve-MRT-Jakarta.png"; a.click();
      log("Unduh PNG", "Kurva-S");
    };
    img.onerror = () => alert("Gagal membuat PNG kurva-S.");
    img.src = src;
  };

  useEffect(() => {
    if (!exportAct) return;
    const t = setTimeout(() => {
      const node = ganttRef.current;
      if (!node || !window.html2canvas) { setExportAct(null); alert("Modul export belum siap. Coba lagi."); return; }
      window.html2canvas(node, { backgroundColor: "#ffffff", scale: 2, logging: false }).then((canvas) => {
        const maxW = 1500, k = Math.min(1, maxW / canvas.width);
        const out = document.createElement("canvas"); out.width = Math.round(canvas.width * k); out.height = Math.round(canvas.height * k);
        const ctx = out.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, out.width, out.height); ctx.imageSmoothingQuality = "high"; ctx.drawImage(canvas, 0, 0, out.width, out.height);
        const a = document.createElement("a"); a.href = out.toDataURL("image/png"); a.download = `Gantt-${actOf(exportAct).label}.png`; a.click();
        log("Unduh PNG", `Gantt ${actOf(exportAct).label}`);
        setExportAct(null);
      }).catch(() => { setExportAct(null); alert("Gagal membuat PNG."); });
    }, 120);
    return () => clearTimeout(t);
  }, [exportAct]);

  /* sesi Supabase */
  useEffect(() => {
    if (!LIVE) return;
    let unsub;
    sb.auth.getSession().then(({ data }) => {
      const s = data && data.session;
      if (s && s.user) setUser({ name: s.user.email, role: ROLE.admin, email: s.user.email, pending: true });
      setBooting(false);
    }).catch(() => setBooting(false));
    const r = sb.auth.onAuthStateChange((_e, s) => {
      if (s && s.user) setUser((u) => (u && u.email === s.user.email ? u : { name: s.user.email, role: ROLE.admin, email: s.user.email, pending: true }));
      else { setUser(null); setReady(false); }
    });
    unsub = r && r.data && r.data.subscription;
    return () => { try { unsub && unsub.unsubscribe(); } catch (e) {} };
  }, []);

  /* muat data + tentukan role */
  useEffect(() => {
    if (!LIVE || !user || ready) return;
    let alive = true; setLoadErr("");
    loadAll().then((d) => {
      if (!alive) return;
      setTasks(d.tasks); setRab(d.rab); setTrans(d.trans); setTerms(d.terms); setDocs(d.docs); setPunch(d.punch);
      setMytasks(d.mytasks); setLogs(d.logs);
      if (d.meta && d.meta.fee != null) setFee(Number(d.meta.fee));
      const email = (user.email || "").toLowerCase();
      let list = d.users;
      let me = list.find((u) => (u.email || "").toLowerCase() === email);
      /* GERBANG AKSES: user hanya boleh masuk bila terdaftar & aktif di
         Manajemen User. User pertama (daftar masih kosong) otomatis jadi
         Project Management supaya portal bisa di-bootstrap. */
      if (!me && list.length === 0) { me = { id: uid(), name: email.split("@")[0], email, role: ROLE.pm, active: true }; list = [...list, me]; }
      if (!me) { sb.auth.signOut().catch(() => {}); setDenied("Akun " + email + " belum terdaftar di portal. Minta Project Management menambahkan Anda lewat menu Manajemen User."); return; }
      if (!me.active) { sb.auth.signOut().catch(() => {}); setDenied("Akses untuk " + email + " sedang dinonaktifkan. Hubungi Project Management."); return; }
      setUsers(list);
      setUser({ name: me.name, email: me.email, role: me.role });
      setReady(true);
    }).catch((e) => { if (alive) setLoadErr(e.message || "Gagal memuat data dari Supabase."); });
    return () => { alive = false; };
  }, [user, ready]);

  /* autosave */
  useSync("app_tasks", tasks, taskToRow, ready);
  useSync("app_rab", rab, costToRow, ready);
  useSync("app_trans", trans, costToRow, ready);
  useSync("app_terms", terms, termToRow, ready);
  useSync("app_docs", docs, docToRow, ready);
  useSync("app_punch", punch, punchToRow, ready);
  useSync("app_users", users, userToRow, ready);
  useSync("app_mytasks", mytasks, myToRow, ready);
  useSync("app_logs", logs, logToRow, ready);
  useEffect(() => { if (!LIVE || !ready) return; const h = setTimeout(() => saveMetaFee(fee), 700); return () => clearTimeout(h); }, [fee, ready]);

  const loggedRef = useRef(false);
  useEffect(() => { if (user && !user.pending && !loggedRef.current) { loggedRef.current = true; log("Masuk aplikasi", `${user.name} · ${user.role}`); } }, [user]);

  if (booting) return <div className="boot">Memeriksa sesi…</div>;
  if (denied) return <div className="boot"><div style={{ maxWidth: 420 }}>
    <div style={{ color: C.red, fontWeight: 800, fontSize: 15, marginBottom: 8 }}>Akses ditolak</div>
    <div style={{ marginBottom: 16 }}>{denied}</div>
    <Btn kind="ghost" onClick={() => { setDenied(""); setUser(null); }}>Kembali ke halaman masuk</Btn>
  </div></div>;
  if (!user) return <Login onLogin={setUser} live={LIVE} />;
  if (LIVE && !ready) return <div className="boot">{loadErr ? ("⚠ " + loadErr + " — muat ulang halaman.") : "Memuat data proyek…"}</div>;

  const isPM = user.role === ROLE.pm;
  /* HAK AKSES
     Project Management : CRUD penuh semua fitur.
     Admin              : hanya update dokumen, bukti pembayaran, dan status Kanban. */
  const can = { manage: isPM, kanban: true, proof: true, docs: true };
  const NAV = [
    { id: "dashboard", label: "Dashboard", icon: "dashboard" },
    { sec: "KEGIATAN" },
    ...ACTS.map((a) => ({ id: "act:" + a.key, label: a.label, icon: a.icon })),
    { sec: "UMUM" },
    { id: "biaya", label: "Biaya", icon: "wallet" },
    { id: "punchlist", label: "Punchlist", icon: "clipboard", badge: punchOpen },
    { id: "arsip", label: "Arsip Dokumen", icon: "folder" },
    { sec: "PERSONAL" },
    { id: "mytasks", label: "Tugas Saya", icon: "tasks", badge: myOpen },
    { id: "logs", label: "Log Aktivitas", icon: "history" },
    ...(isPM ? [{ id: "users", label: "Manajemen User", icon: "users" }] : []),
  ];
  const cur = NAV.find((n) => n.id === page) || NAV[0];
  const go = (id) => { setPage(id); if (isMobile) setSidebar(false); };
  const doLogout = async () => { log("Keluar aplikasi", user.name); if (LIVE) { try { await sb.auth.signOut(); } catch (e) {} setReady(false); } setUser(null); loggedRef.current = false; };
  const actKey = page.indexOf("act:") === 0 ? page.slice(4) : null;

  return <div style={{ fontFamily: "Inter, system-ui, sans-serif", color: C.text, background: C.bg, minHeight: "100vh", display: "flex" }}>
    {sidebar && isMobile && <div onClick={() => setSidebar(false)} style={{ position: "fixed", inset: 0, background: "rgba(19,41,61,.45)", zIndex: 60 }} />}
    {sidebar && <aside style={{ width: 236, background: "#fff", borderRight: `1px solid ${C.line}`, flexShrink: 0, display: "flex", flexDirection: "column", position: isMobile ? "fixed" : "sticky", left: 0, top: 0, height: "100vh", zIndex: 61, overflowY: "auto" }}>
      <div style={{ padding: 18, display: "flex", alignItems: "center", gap: 10, borderBottom: `1px solid ${C.line}` }}>
        <Logo size={36} radius={10} />
        <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontWeight: 800, fontSize: 14.5, color: C.ink }}>Selamat Bekerja!</div></div>
        {isMobile && <button onClick={() => setSidebar(false)} style={iconBtn}><Ic name="x" size={18} /></button>}
      </div>
      <nav style={{ padding: 12, flex: 1 }}>
        {NAV.map((n, i) => n.sec
          ? <div key={"s" + i} style={{ fontSize: 10, fontWeight: 800, color: "#9AAABC", letterSpacing: .6, padding: "12px 12px 5px" }}>{n.sec}</div>
          : <button key={n.id} onClick={() => go(n.id)} style={{ width: "100%", display: "flex", alignItems: "center", gap: 11, padding: "10px 12px", marginBottom: 3, borderRadius: 10, border: "none", cursor: "pointer", fontSize: 13.5, fontWeight: 600, textAlign: "left", color: page === n.id ? C.violet : C.slate, background: page === n.id ? C.violetSoft : "transparent" }}>
            <Ic name={n.icon} size={18} />{n.label}
            {n.badge > 0 && <span style={{ marginLeft: "auto", fontSize: 10.5, fontWeight: 700, color: "#fff", background: C.red, borderRadius: 99, padding: "1px 7px" }}>{n.badge}</span>}
          </button>)}
      </nav>
      <div style={{ padding: 14, borderTop: `1px solid ${C.line}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
          <div style={{ width: 32, height: 32, borderRadius: 99, background: isPM ? C.blueSoft : C.greenSoft, color: isPM ? C.blue : C.green, display: "grid", placeItems: "center", fontSize: 13, fontWeight: 800, flexShrink: 0 }}>{(user.name || "?")[0].toUpperCase()}</div>
          <div style={{ minWidth: 0 }}><div style={{ fontSize: 12.5, fontWeight: 700, color: C.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{user.name}</div><div style={{ fontSize: 10.5, color: C.slate }}>{user.role}</div></div>
        </div>
        <button onClick={doLogout} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 7, padding: 8, borderRadius: 9, border: `1px solid ${C.line}`, background: "#fff", color: C.slate, cursor: "pointer", fontSize: 12.5, fontWeight: 600 }}><Ic name="logout" size={14} /> Keluar</button>
      </div>
    </aside>}

    <main style={{ flex: 1, minWidth: 0, width: "100%" }}>
      <header style={{ background: "#fff", borderBottom: `1px solid ${C.line}`, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 20, gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
          <button onClick={() => setSidebar((s) => !s)} title="Menu" style={{ ...iconBtn, border: `1px solid ${C.line}`, width: 36, height: 36, color: C.ink, flexShrink: 0 }}><Ic name="menu" size={18} /></button>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 16.5, fontWeight: 800, letterSpacing: -.3, color: C.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{cur.label}</div>
            <div style={{ fontSize: 12, color: C.slate, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{PROJECT.name}</div>
          </div>
        </div>
        <SyncBadge onOpen={() => setDiag(true)} />
      </header>

      <div className="wrap">
        {LIVE && syncSt.state === "error" && <div style={{ display: "flex", alignItems: "flex-start", gap: 9, background: "#FDECEF", border: `1px solid ${C.red}`, borderRadius: 12, padding: "10px 13px", marginBottom: 16, fontSize: 12.5, color: C.ink }}>
          <span style={{ color: C.red, flexShrink: 0 }}><Ic name="alert" size={16} /></span>
          <div style={{ minWidth: 0 }}><b>Perubahan gagal disimpan ke Supabase.</b> {syncSt.msg}
            <div style={{ marginTop: 6 }}><Btn size="sm" kind="ghost" onClick={() => setDiag(true)}>Buka Diagnostik</Btn></div></div>
        </div>}
        {!LIVE && <div style={{ display: "flex", alignItems: "flex-start", gap: 9, background: "#FCF3E2", border: `1px solid ${C.amber}`, borderRadius: 12, padding: "10px 13px", marginBottom: 16, fontSize: 12.5, color: C.ink }}>
          <span style={{ color: C.amber, flexShrink: 0 }}><Ic name="alert" size={16} /></span>
          <div><b>Mode DEMO — data tidak tersimpan.</b> Perubahan hanya ada di browser dan kembali ke data contoh saat halaman dimuat ulang. Isi SUPABASE_URL & SUPABASE_ANON_KEY di index.html untuk menyambung ke server.
            <div style={{ marginTop: 6 }}><Btn size="sm" kind="ghost" onClick={() => setDiag(true)}>Cek koneksi</Btn></div></div>
        </div>}
        {!isPM && <div style={{ display: "flex", alignItems: "center", gap: 9, background: C.blueSoft, border: `1px solid ${C.line}`, borderRadius: 12, padding: "9px 13px", marginBottom: 16, fontSize: 12.5, color: C.ink }}>
          <span style={{ color: C.blue, flexShrink: 0 }}><Ic name="alert" size={16} /></span>
          <span>Role <b>Admin</b>: dapat memperbarui <b>dokumen</b>, <b>bukti pembayaran</b>, dan <b>status Kanban</b>. Data lain hanya bisa dilihat.</span>
        </div>}
        {page === "dashboard" && <div className="g1">
          <div style={{ background: `linear-gradient(120deg,${C.blueSoft},${C.greenSoft})`, borderRadius: 20, padding: "22px 24px", border: `1px solid ${C.line}` }}>
            <div style={{ display: "inline-flex", alignItems: "center", gap: 7, background: "#fff", padding: "4px 11px", borderRadius: 99, fontSize: 11.5, fontWeight: 600, marginBottom: 14, color: C.ink, border: `1px solid ${C.line}` }}><span style={{ width: 7, height: 7, borderRadius: 99, background: C.green }} /> Status per {fmtDate(PROJECT.statusDate)}</div>
            <div style={{ fontSize: 24, fontWeight: 800, letterSpacing: -.6, color: C.ink }}>{PROJECT.name}</div>
            <div style={{ fontSize: 13.5, color: C.slate, marginTop: 2 }}>{PROJECT.sub}</div>
            <div style={{ display: "flex", gap: 28, marginTop: 18, flexWrap: "wrap" }}>
              {[["Nilai Proyek", rpShort(proj), C.ink], ["Progres Keseluruhan", overall + "%", C.green], ["Kontraktor", rpShort(cTotal), C.green], ["Konsultan", rpShort(fee), C.blue], ["Transisi", rpShort(trTotal), C.orange]].map(([l, v, c], i) => <div key={i}><div style={{ fontSize: 11.5, color: C.slate, fontWeight: 600 }}>{l}</div><div style={{ fontSize: 21, fontWeight: 800, color: c, fontVariantNumeric: "tabular-nums", letterSpacing: -.5, marginTop: 2 }}>{v}</div></div>)}
            </div>
          </div>

          <div className="g4">
            <Stat label="Total Aktivitas" value={tasks.length} sub={`${tasks.filter((t) => !t.parent).length} pekerjaan utama`} icon="calendar" color={C.ink} />
            <Stat label="Punchlist Aktif" value={punchOpen} sub={`${punch.length} total temuan`} icon="clipboard" color={C.amber} />
            <Stat label="Pembayaran Berikutnya" value={nextPay ? rpShort((nextPay.percent / 100) * fee) : "-"} sub={nextPay ? `${nextPay.desc} · ${fmtDate(nextPay.date)}` : "selesai"} icon="dollar" color={C.green} />
            <Stat label="Progres Keseluruhan" value={overall + "%"} sub="tertimbang durasi" icon="check" color={C.green} />
          </div>

          <Card>
            <CardHead icon="trending" title="Progres per Kegiatan" right={<span style={{ fontSize: 12.5, color: C.slate }}>klik untuk membuka</span>} />
            <div className="g3">
              {ACTS.map((a) => { const p = progressOf(tasks, a.key); const n = tasks.filter((t) => t.act === a.key).length; return (
                <button key={a.key} onClick={() => go("act:" + a.key)} style={{ textAlign: "left", border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, background: "#fff", cursor: "pointer" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 9 }}><span style={{ width: 28, height: 28, borderRadius: 8, background: a.soft, color: a.color, display: "grid", placeItems: "center" }}><Ic name={a.icon} size={15} /></span><span style={{ fontWeight: 700, fontSize: 14, color: C.ink }}>{a.label}</span><span style={{ marginLeft: "auto", fontWeight: 800, fontSize: 15, color: a.color, fontVariantNumeric: "tabular-nums" }}>{p}%</span></div>
                  <div style={{ marginTop: 10, height: 7, background: C.bg, borderRadius: 99, overflow: "hidden" }}><div style={{ width: `${p}%`, height: "100%", background: a.color }} /></div>
                  <div style={{ fontSize: 11.5, color: C.slate, marginTop: 7 }}>{n} aktivitas</div>
                </button>); })}
            </div>
          </Card>

          <Card>
            <CardHead icon="trending" title="S-Curve — Kontraktor · Konsultan · Transisi · Total" right={<div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}><div style={{ display: "flex", gap: 12, fontSize: 12, flexWrap: "wrap" }}>{SERIES.map(([l, c]) => <span key={l} style={{ display: "flex", alignItems: "center", gap: 6, color: C.slate, fontWeight: 600 }}><span style={{ width: 14, height: 3, background: c, borderRadius: 2 }} />{l}</span>)}</div><Btn kind="ghost" size="sm" onClick={exportSCurvePNG}><Ic name="download" size={15} /> Unduh PNG</Btn></div>} />
            <div ref={scWrapRef} style={{ minWidth: 0 }}><SCurveChart data={sc} today={scToday} /></div>
          </Card>
        </div>}

        {actKey && <ActivityPage act={actKey} tasks={tasks} setTasks={setTasks} users={users} can={can} log={log} exporting={exportAct === actKey} onExport={() => setExportAct(actKey)} />}
        {page === "biaya" && <Costs rab={rab} setRab={setRab} trans={trans} setTrans={setTrans} fee={fee} setFee={setFee} terms={terms} setTerms={setTerms} can={can} log={log} />}
        {page === "punchlist" && <Punchlist punch={punch} setPunch={setPunch} tasks={tasks} can={can} log={log} />}
        {page === "arsip" && <Arsip docs={docs} setDocs={setDocs} log={log} />}
        {page === "mytasks" && <MyTasks mytasks={mytasks} setMytasks={setMytasks} users={users} user={user} isPM={isPM} log={log} />}
        {page === "logs" && <Logs logs={logs} />}
        {page === "users" && isPM && <UsersPage users={users} setUsers={setUsers} mytasks={mytasks} me={user} log={log} />}
        {page === "users" && !isPM && <Card><Empty text="Halaman ini khusus role Project Management." /></Card>}
      </div>
    </main>

    {diag && <DiagModal onClose={() => setDiag(false)} />}
    {exportAct && <div style={{ position: "fixed", left: -99999, top: 0, zIndex: -1 }}>
      <div ref={ganttRef} style={{ background: "#fff", padding: 18, display: "inline-block" }}>
        <div style={{ fontWeight: 800, fontSize: 16, color: C.ink, fontFamily: "Inter, sans-serif" }}>{PROJECT.name}</div>
        <div style={{ fontSize: 11.5, color: C.slate, marginBottom: 12, fontFamily: "Inter, sans-serif" }}>Gantt Chart — Kegiatan {actOf(exportAct).label} · status per {fmtDate(PROJECT.statusDate)}</div>
        <Gantt tasks={tasks} act={exportAct} statusDate={PROJECT.statusDate} editable={false} forExport />
      </div>
    </div>}
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
