function Kanban({ tasks, act, users, onMove, onView, onNote, onAdd, canMove, canNote }) {
  const list = tasks.filter((t) => t.act === act);
  const leaves = list.filter((t) => !list.some((x) => x.parent === t.id));
  const idx = new Map(leaves.map((t, i) => [t.id, i]));
  const nameOfParent = (t) => { const p = list.find((x) => x.id === t.parent); return p ? p.name : null; };
  const [over, setOver] = useState(null);
  const A2 = actOf(act);
  return <div className="g4">
    {KCOLS.map((col) => {
      const items = leaves.filter((t) => t.status === col);
      const m = SMETA[col];
      return <div key={col}
        onDragOver={(e) => { if (!canMove) return; e.preventDefault(); setOver(col); }}
        onDragLeave={() => setOver((o) => (o === col ? null : o))}
        onDrop={(e) => { if (!canMove) return; e.preventDefault(); const id = e.dataTransfer.getData("text/plain"); setOver(null); if (id) onMove(id, col); }}
        style={{ background: over === col ? m.bg : "#FBFCFE", border: `1px ${over === col ? "solid" : "dashed"} ${over === col ? m.color : C.line}`, borderRadius: 16, padding: 12, minHeight: 200, transition: ".15s", minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, padding: "0 2px" }}>
          <span style={{ width: 4, height: 15, borderRadius: 3, background: m.color, flexShrink: 0 }} />
          <span style={{ fontWeight: 700, fontSize: 13, color: C.ink, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{col}</span>
          <span style={{ fontSize: 11, fontWeight: 700, color: m.color, background: m.bg, borderRadius: 6, padding: "1px 7px" }}>{items.length}</span>
          {canNote && <button title="Tambah pekerjaan" onClick={onAdd} style={{ ...iconBtn, marginLeft: "auto", padding: 3 }}><Ic name="plus" size={15} /></button>}
        </div>
        <div style={{ display: "grid", gap: 9 }}>
          {items.map((t) => {
            const ci = KCOLS.indexOf(t.status);
            const canceled = t.status === STATUS.cancel;
            const late = !canceled && t.percent < 100 && D(t.finish) < todayNoon();
            return <div key={t.id} draggable={canMove} onDragStart={(e) => e.dataTransfer.setData("text/plain", t.id)}
              onDoubleClick={() => onView(t)}
              style={{ border: `1px solid ${C.line}`, borderRadius: 13, padding: "11px 12px", background: "#fff", cursor: canMove ? "grab" : "default", boxShadow: "0 1px 3px rgba(16,42,67,.06)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
                <PrioChip prio={t.prio || "Sedang"} />
                <Chip text={A2.label} c={A2.color} b={A2.soft} />
                {late && <Chip text="Terlambat" c={C.red} b="#FDECEF" />}
                <span style={{ marginLeft: "auto", fontSize: 10.5, fontWeight: 700, color: "#9AAABC", letterSpacing: .3 }}>{codeOf(t, idx.get(t.id) || 0)}</span>
              </div>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 6 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 700, color: canceled ? C.slate : C.ink, textDecoration: canceled ? "line-through" : "none", lineHeight: 1.35 }}>{t.name}</div>
                  <div style={{ fontSize: 11.5, color: C.slate, marginTop: 2 }}>{nameOfParent(t) ? "↳ " + nameOfParent(t) : "Pekerjaan utama"}</div>
                </div>
                <div style={{ display: "flex", gap: 1, flexShrink: 0 }}>
                  <button title="Lihat detail" onClick={() => onView(t)} style={{ ...iconBtn, color: C.violet, padding: 4 }}><Ic name="eye" size={14} /></button>
                  {canNote && <button title="Catatan & penugasan" onClick={() => onNote(t)} style={{ ...iconBtn, padding: 4 }}><Ic name="pencil" size={13} /></button>}
                </div>
              </div>
              {t.note && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 8, background: C.bg, borderRadius: 8, padding: "6px 8px", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{t.note}</div>}
              <div style={{ marginTop: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 }}>
                  <span style={{ fontSize: 10.5, color: C.slate, fontWeight: 600, display: "inline-flex", alignItems: "center", gap: 4 }}><Ic name="trending" size={11} /> Progres</span>
                  <span style={{ fontSize: 10.5, fontWeight: 800, color: canceled ? C.red : C.ink }}>{canceled ? "batal" : t.percent + "%"}</span>
                </div>
                <Bar pct={canceled ? 0 : t.percent} color={m.bar} />
              </div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginTop: 10, paddingTop: 9, borderTop: `1px solid ${C.line}` }}>
                <Avatars emails={t.assignees} users={users} size={21} />
                <span style={{ fontSize: 10.5, color: late ? C.red : C.slate, fontWeight: 600, display: "inline-flex", alignItems: "center", gap: 4, whiteSpace: "nowrap" }}><Ic name="clock" size={11} /> {fmtDate(t.finish)}</span>
              </div>
              {canMove && <div style={{ display: "flex", gap: 6, marginTop: 9 }}>
                <Btn kind="ghost" size="sm" onClick={() => ci > 0 && onMove(t.id, KCOLS[ci - 1])} disabled={ci === 0} style={{ flex: 1, justifyContent: "center", opacity: ci === 0 ? .4 : 1, padding: "4px 8px" }}><Ic name="chevL" size={12} /></Btn>
                <Btn kind="ghost" size="sm" onClick={() => ci < KCOLS.length - 1 && onMove(t.id, KCOLS[ci + 1])} disabled={ci === KCOLS.length - 1} style={{ flex: 1, justifyContent: "center", opacity: ci === KCOLS.length - 1 ? .4 : 1, padding: "4px 8px" }}><Ic name="chevR" size={12} /></Btn>
              </div>}
            </div>;
          })}
          {items.length === 0 && <div style={{ fontSize: 11.5, color: "#A9B7C6", textAlign: "center", padding: "18px 0" }}>Tidak ada pekerjaan</div>}
          {canNote && <AddNew onClick={onAdd} label="Tambah pekerjaan" />}
        </div>
      </div>;
    })}
  </div>;
}

/* ===== KALENDER MINGGUAN ===== */
const DAYS_ID = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu", "Minggu"];
function WeekCalendar({ tasks, act, users, onView }) {
  const [off, setOff] = useState(0);
  const w = useWinW();
  const narrow = w < 900;
  const base = mondayOf(todayNoon());
  const start = addDays(base, off * 7);
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const list = tasks.filter((t) => t.act === act);
  const leaves = list.filter((t) => !list.some((x) => x.parent === t.id));
  const idx = new Map(leaves.map((t, i) => [t.id, i]));
  const A2 = actOf(act);
  const todayISO = iso(todayNoon());
  const onDay = (d) => leaves.filter((t) => D(t.start) <= d && D(t.finish) >= d);
  const weekTasks = leaves.filter((t) => D(t.finish) >= start && D(t.start) <= days[6]);
  return <div>
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <Btn kind="ghost" size="sm" onClick={() => setOff((x) => x - 1)}><Ic name="chevL" size={14} /></Btn>
        <Btn kind="ghost" size="sm" onClick={() => setOff(0)}>Minggu ini</Btn>
        <Btn kind="ghost" size="sm" onClick={() => setOff((x) => x + 1)}><Ic name="chevR" size={14} /></Btn>
      </div>
      <div style={{ fontSize: 13, fontWeight: 700, color: C.ink }}>
        Minggu ke-{isoWeek(start)} · {fmtDate(iso(start))} – {fmtDate(iso(days[6]))}
        <span style={{ fontWeight: 500, color: C.slate, marginLeft: 8, fontSize: 12 }}>{weekTasks.length} pekerjaan aktif</span>
      </div>
    </div>
    <div className="scrollx" style={{ border: `1px solid ${C.line}`, borderRadius: 14, background: "#fff" }}>
      <div style={{ display: "grid", gridTemplateColumns: `repeat(7, minmax(${narrow ? 150 : 120}px, 1fr))`, minWidth: narrow ? 1050 : 780 }}>
        {days.map((d, i) => {
          const isToday = iso(d) === todayISO;
          return <div key={i} style={{ borderRight: i < 6 ? `1px solid ${C.line}` : "none", background: isToday ? C.violetSoft : "#FBFCFE", padding: "10px 8px", textAlign: "center", borderBottom: `1px solid ${C.line}` }}>
            <div style={{ fontSize: 11.5, fontWeight: 700, color: isToday ? C.violet : C.slate }}>{DAYS_ID[i]}</div>
            <div style={{ fontSize: 16, fontWeight: 800, color: isToday ? C.violet : C.ink, marginTop: 2 }}>{d.getDate()}</div>
            <div style={{ fontSize: 10.5, color: C.slate }}>{MON[d.getMonth()]} {String(d.getFullYear()).slice(2)}</div>
            {isToday && <div style={{ marginTop: 6, fontSize: 9.5, fontWeight: 800, color: "#fff", background: C.violet, borderRadius: 99, padding: "2px 8px", display: "inline-block" }}>HARI INI</div>}
          </div>;
        })}
        {days.map((d, i) => {
          const items = onDay(d);
          const isToday = iso(d) === todayISO;
          return <div key={"c" + i} style={{ borderRight: i < 6 ? `1px solid ${C.line}` : "none", background: isToday ? "#FCFCFF" : "#fff", padding: 8, minHeight: 330, display: "grid", gap: 7, alignContent: "start" }}>
            {items.map((t) => {
              const m = SMETA[t.status] || SMETA[STATUS.todo];
              const isStart = iso(D(t.start)) === iso(d);
              const isEnd = iso(D(t.finish)) === iso(d);
              return <button key={t.id} onClick={() => onView(t)} title={`${t.name} · ${fmtDate(t.start)} → ${fmtDate(t.finish)} · ${t.percent}%`}
                style={{ textAlign: "left", border: `1px solid ${C.line}`, borderLeft: `3px solid ${m.bar}`, borderRadius: 9, background: t.status === STATUS.cancel ? "#FFF7F8" : "#fff", padding: "7px 8px", cursor: "pointer", boxShadow: "0 1px 2px rgba(16,42,67,.05)" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 4, flexWrap: "wrap" }}>
                  <span style={{ width: 6, height: 6, borderRadius: 99, background: m.bar, flexShrink: 0 }} />
                  <span style={{ fontSize: 9.5, fontWeight: 800, color: "#9AAABC" }}>{codeOf(t, idx.get(t.id) || 0)}</span>
                  {isStart && <Chip text="Mulai" c={C.green} b={C.greenSoft} />}
                  {isEnd && <Chip text="Selesai" c={C.violet} b={C.violetSoft} />}
                </div>
                <div style={{ fontSize: 11.5, fontWeight: 700, color: t.status === STATUS.cancel ? C.slate : C.ink, textDecoration: t.status === STATUS.cancel ? "line-through" : "none", lineHeight: 1.3 }}>{t.name}</div>
                <div style={{ marginTop: 6 }}><Bar pct={t.percent} color={m.bar} /></div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 6, gap: 4 }}>
                  <Avatars emails={t.assignees} users={users} size={17} />
                  <span style={{ fontSize: 9.5, fontWeight: 700, color: C.slate }}>{t.percent}%</span>
                </div>
              </button>;
            })}
            {items.length === 0 && <div style={{ fontSize: 11, color: "#B8C4D2", textAlign: "center", paddingTop: 16 }}>—</div>}
          </div>;
        })}
      </div>
    </div>
    <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 10, fontSize: 11.5, color: C.slate, alignItems: "center" }}>
      {KCOLS.map((st) => <span key={st} style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 10, height: 4, borderRadius: 2, background: SMETA[st].bar }} /> {st}</span>)}
      <span style={{ marginLeft: "auto" }}>Pekerjaan tampil di setiap hari sepanjang rentang jadwalnya · klik kartu untuk detail</span>
    </div>
  </div>;
}

/* ===== BUKTI PEMBAYARAN (PDF) ===== */
function ProofCell({ row, onSet, log, label }) {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const pick = async (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = ""; if (!file) return;
    setErr("");
    if (file.type !== "application/pdf") { setErr("Harus PDF"); return; }
    if (file.size > 40 * 1048576) { setErr("Maks 40 MB"); return; }
    setBusy(true);
    try { const url = await uploadFile(file, "bukti"); onSet({ proofUrl: url, proofName: file.name }); log && log("Unggah bukti bayar", `${label}: ${file.name}`); }
    catch (x) { setErr("Gagal unggah"); }
    setBusy(false);
  };
  if (row.proofUrl) return <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
    <a href={row.proofUrl} target="_blank" rel="noreferrer" title={row.proofName || "Bukti pembayaran"} style={{ ...iconBtn, color: C.green, textDecoration: "none" }}><Ic name="file" size={15} /></a>
    <button title="Hapus bukti" onClick={() => { onSet({ proofUrl: null, proofName: null }); log && log("Hapus bukti bayar", label); }} style={{ ...iconBtn, color: C.red, padding: 3 }}><Ic name="x" size={12} /></button>
  </div>;
  return <div>
    <label title="Unggah bukti pembayaran (PDF)" style={{ ...iconBtn, color: busy ? C.slate : C.blue, cursor: busy ? "wait" : "pointer" }}>
      <Ic name="upload" size={15} />
      <input type="file" accept="application/pdf" onChange={pick} disabled={busy} style={{ display: "none" }} />
    </label>
    {err && <div style={{ fontSize: 10, color: C.red }}>{err}</div>}
  </div>;
}

/* ===== BIAYA ===== */
function Cell({ value, onChange, type = "text", align = "left", readOnly }) {
  if (readOnly) return <div style={{ padding: "6px 7px", fontSize: 13, color: C.ink, textAlign: align, fontVariantNumeric: "tabular-nums", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{type === "date" ? fmtDate(value) : value}</div>;
  return <input type={type} value={value} onChange={(e) => onChange(type === "number" ? Number(e.target.value) : e.target.value)}
    style={{ width: "100%", border: "1px solid transparent", background: "transparent", padding: "6px 7px", borderRadius: 8, fontSize: 13, color: C.ink, textAlign: align, fontFamily: "inherit", fontVariantNumeric: "tabular-nums", outline: "none" }}
    onFocus={(e) => { e.target.style.border = `1px solid ${C.blue}`; e.target.style.background = "#fff"; }}
    onBlur={(e) => { e.target.style.border = "1px solid transparent"; e.target.style.background = "transparent"; }} />;
}
function CostTable({ title, icon, color, rows, setRows, log, tag, addLabel, footer, can }) {
  const th = { textAlign: "left", fontSize: 11, fontWeight: 700, color: C.slate, padding: "8px 6px", borderBottom: `1px solid ${C.line}`, textTransform: "uppercase", letterSpacing: .3, whiteSpace: "nowrap" };
  const td = { padding: "2px 6px", borderBottom: `1px solid ${C.line}`, fontSize: 13, color: C.ink };
  const upd = (id, k, v) => setRows((s) => s.map((r) => r.id === id ? { ...r, [k]: v } : r));
  const total = sumCost(rows);
  return <Card>
    <CardHead icon={icon} color={color} title={title} right={<div style={{ fontSize: 13, color: C.slate }}>Total <b style={{ color }}>{rp(total)}</b></div>} />
    <div className="scrollx"><table style={{ width: "100%", borderCollapse: "collapse", minWidth: 820 }}>
      <thead><tr><th style={th}>Paket Pekerjaan</th><th style={{ ...th, textAlign: "right" }}>Qty</th><th style={{ ...th, textAlign: "right" }}>Harga Satuan</th><th style={{ ...th, textAlign: "right" }}>Nilai</th><th style={th}>Mulai</th><th style={th}>Selesai</th><th style={{ ...th, textAlign: "center" }}>Bukti</th><th style={th}></th></tr></thead>
      <tbody>{rows.map((r) => <tr key={r.id}>
        <td style={{ ...td, minWidth: 190 }}><Cell readOnly={!can.manage} value={r.item} onChange={(v) => upd(r.id, "item", v)} /></td>
        <td style={{ ...td, width: 76 }}><Cell readOnly={!can.manage} type="number" align="right" value={r.qty} onChange={(v) => upd(r.id, "qty", v)} /></td>
        <td style={{ ...td, width: 116 }}><Cell readOnly={!can.manage} type="number" align="right" value={r.rate} onChange={(v) => upd(r.id, "rate", v)} /></td>
        <td style={{ ...td, textAlign: "right", fontWeight: 700, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>{rp(r.qty * r.rate)}</td>
        <td style={{ ...td, width: 138 }}><Cell readOnly={!can.manage} type="date" value={r.start} onChange={(v) => upd(r.id, "start", v)} /></td>
        <td style={{ ...td, width: 138 }}><Cell readOnly={!can.manage} type="date" value={r.finish} onChange={(v) => upd(r.id, "finish", v)} /></td>
        <td style={{ ...td, width: 66, textAlign: "center" }}><div style={{ display: "flex", justifyContent: "center" }}><ProofCell row={r} label={`${tag} — ${r.item}`} log={log} onSet={(p) => setRows((s) => s.map((x) => x.id === r.id ? { ...x, ...p } : x))} /></div></td>
        <td style={{ ...td, width: 34 }}>{can.manage && <button onClick={() => { setRows((s) => s.filter((x) => x.id !== r.id)); log && log("Hapus item biaya", `${tag}: ${r.item}`); }} style={{ ...iconBtn, color: C.red }}><Ic name="trash" size={14} /></button>}</td>
      </tr>)}
      {rows.length === 0 && <tr><td colSpan={8}><Empty text="Belum ada item biaya." /></td></tr>}
      </tbody>
    </table></div>
    {can.manage && <Btn kind="ghost" size="sm" onClick={() => { setRows((s) => [...s, { id: uid(), item: "Item baru", qty: 1, rate: 0, start: PROJECT.statusDate, finish: PROJECT.statusDate, proofUrl: null, proofName: null }]); log && log("Tambah item biaya", tag); }} style={{ marginTop: 12 }}><Ic name="plus" size={14} /> {addLabel}</Btn>}
    {footer}
  </Card>;
}
function Costs({ rab, setRab, trans, setTrans, acosts, setAcosts, fee, setFee, terms, setTerms, can, log }) {
  const th = { textAlign: "left", fontSize: 11, fontWeight: 700, color: C.slate, padding: "8px 6px", borderBottom: `1px solid ${C.line}`, textTransform: "uppercase", letterSpacing: .3, whiteSpace: "nowrap" };
  const td = { padding: "2px 6px", borderBottom: `1px solid ${C.line}`, fontSize: 13, color: C.ink };
  const uT = (id, k, v) => setTerms((s) => s.map((t) => t.id === id ? { ...t, [k]: v } : t));
  const tp = terms.reduce((a, t) => a + Number(t.percent || 0), 0);
  const cT = sumCost(rab), trT = sumCost(trans);
  const extra = ACTS.filter((a) => BUILTIN_KEYS.indexOf(a.key) < 0);
  const rowsOf = (k) => acosts.filter((r) => r.act === k);
  const setRowsOf = (k) => (fn) => setAcosts((s) => { const mine = s.filter((r) => r.act === k); const next = (typeof fn === "function" ? fn(mine) : fn).map((r) => ({ ...r, act: k })); return [...s.filter((r) => r.act !== k), ...next]; });
  const grand = cT + fee + trT + sumCost(acosts);
  const payData = useMemo(() => paymentMonths(rab, fee, terms, trans, acosts), [rab, fee, terms, trans, acosts]);
  return <div className="g1">
    <div className="g4">
      <Stat label="Nilai Proyek" value={rpShort(grand)} sub={`${ACTS.length} kegiatan`} icon="dollar" color={C.ink} />
      {ACTS.map((a) => {
        const v = a.key === "konsultan" ? fee : (a.key === "kontraktor" ? cT : (a.key === "transisi" ? trT : sumCost(rowsOf(a.key))));
        const n = a.key === "konsultan" ? `${terms.length} termin` : `${(a.key === "kontraktor" ? rab : a.key === "transisi" ? trans : rowsOf(a.key)).length} item`;
        return <Stat key={a.key} label={"Biaya " + a.label} value={rpShort(v)} sub={n} icon={a.icon} color={a.color} />;
      })}
    </div>

    <Card>
      <CardHead icon="dollar" color={C.green} title="Grafik Pembayaran per Kegiatan" right={<span style={{ fontSize: 12, color: C.slate }}>klik kegiatan untuk memfilter</span>} />
      <div style={{ fontSize: 12, color: C.slate, marginBottom: 10 }}>Membandingkan nominal pembayaran (sumbu Y) dengan waktu tagihan dibayar per bulan (sumbu X). Pilih “Semua Kegiatan” untuk melihat perbandingan lengkap beserta totalnya, atau satu kegiatan untuk grafiknya sendiri.</div>
      <PaymentChart data={payData} acts={ACTS} />
    </Card>

    <CostTable title={"Biaya " + actOf("kontraktor").label + " (RAB)"} icon={actOf("kontraktor").icon} color={actOf("kontraktor").color} rows={rab} setRows={setRab} log={log} can={can} tag={actOf("kontraktor").label} addLabel="Tambah baris RAB" />

    <Card>
      <CardHead icon={actOf("konsultan").icon} color={actOf("konsultan").color} title={"Biaya " + actOf("konsultan").label + " (Termin)"} right={<div style={{ display: "flex", alignItems: "center", gap: 8 }}><span style={{ fontSize: 12.5, color: C.slate }}>Total Fee</span>{can.manage ? <Input type="number" value={fee} onChange={(e) => setFee(Number(e.target.value))} style={{ width: 160, textAlign: "right", fontWeight: 700, fontVariantNumeric: "tabular-nums" }} /> : <b style={{ fontSize: 14, color: C.blue }}>{rp(fee)}</b>}</div>} />
      <div className="scrollx"><table style={{ width: "100%", borderCollapse: "collapse", minWidth: 760 }}>
        <thead><tr><th style={{ ...th, width: 66 }}>Tahap</th><th style={th}>Deskripsi</th><th style={{ ...th, textAlign: "right", width: 84 }}>Bobot %</th><th style={{ ...th, textAlign: "right" }}>Nilai</th><th style={th}>Tgl Bayar (BAST)</th><th style={{ ...th, textAlign: "center" }}>Bukti</th><th style={th}></th></tr></thead>
        <tbody>{terms.map((t) => <tr key={t.id}>
          <td style={td}><Cell readOnly={!can.manage} value={t.term} onChange={(v) => uT(t.id, "term", v)} /></td>
          <td style={{ ...td, minWidth: 170 }}><Cell readOnly={!can.manage} value={t.desc} onChange={(v) => uT(t.id, "desc", v)} /></td>
          <td style={{ ...td, width: 84 }}><Cell readOnly={!can.manage} type="number" align="right" value={t.percent} onChange={(v) => uT(t.id, "percent", v)} /></td>
          <td style={{ ...td, textAlign: "right", fontWeight: 700, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>{rp((t.percent / 100) * fee)}</td>
          <td style={{ ...td, width: 146 }}><Cell readOnly={!can.manage} type="date" value={t.date} onChange={(v) => uT(t.id, "date", v)} /></td>
          <td style={{ ...td, width: 66, textAlign: "center" }}><div style={{ display: "flex", justifyContent: "center" }}><ProofCell row={t} label={`Konsultan — ${t.term} ${t.desc}`} log={log} onSet={(p) => setTerms((s) => s.map((x) => x.id === t.id ? { ...x, ...p } : x))} /></div></td>
          <td style={{ ...td, width: 34 }}>{can.manage && <button onClick={() => { setTerms((s) => s.filter((x) => x.id !== t.id)); log && log("Hapus termin", t.term); }} style={{ ...iconBtn, color: C.red }}><Ic name="trash" size={14} /></button>}</td>
        </tr>)}
          <tr><td colSpan={2} style={{ ...td, fontWeight: 700 }}>Total bobot</td><td style={{ ...td, textAlign: "right", fontWeight: 700 }}>{tp}%</td><td style={{ ...td, textAlign: "right", fontWeight: 700, color: C.blue }}>{rp(terms.reduce((a, t) => a + (t.percent / 100) * fee, 0))}</td><td style={td} colSpan={3}></td></tr>
        </tbody></table></div>
      {can.manage && <Btn kind="ghost" size="sm" onClick={() => { setTerms((s) => [...s, { id: uid(), term: "T" + (s.length + 1), desc: "Tahap baru", percent: 0, date: PROJECT.statusDate, proofUrl: null, proofName: null }]); log && log("Tambah termin", "Konsultan"); }} style={{ marginTop: 12 }}><Ic name="plus" size={14} /> Tambah termin</Btn>}
      {tp !== 100 && <div style={{ fontSize: 12, color: C.amber, marginTop: 8 }}>Catatan: total bobot termin = {tp}% (belum 100%).</div>}
    </Card>

    <CostTable title={"Biaya " + (actOf("transisi").label)} icon={actOf("transisi").icon} color={actOf("transisi").color} rows={trans} setRows={setTrans} log={log} can={can} tag={actOf("transisi").label} addLabel="Tambah biaya transisi" />

    {extra.map((a) => <CostTable key={a.key} title={"Biaya " + a.label} icon={a.icon} color={a.color} rows={rowsOf(a.key)} setRows={setRowsOf(a.key)} log={log} can={can} tag={a.label} addLabel={"Tambah biaya " + a.label} />)}
  </div>;
}

/* ===== ARSIP DOKUMEN ===== */
const CATS = ["Kontrak", "Desain", "RAB", "Izin", "BAST", "Invoice", "Laporan", "Lainnya"];
function Arsip({ docs, setDocs, log }) {
  const [pending, setPending] = useState(null);
  const [cat, setCat] = useState("Kontrak");
  const [err, setErr] = useState("");
  const [preview, setPreview] = useState(null);
  const [busy, setBusy] = useState(false);
  const pick = (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = ""; if (!file) return;
    setErr("");
    if (file.type !== "application/pdf") { setErr("Hanya file PDF yang didukung."); return; }
    if (file.size > 40 * 1048576) { setErr(`Ukuran ${mb(file.size)} melebihi batas 40 MB.`); return; }
    setPending({ file, name: file.name.replace(/\.pdf$/i, "") });
  };
  const commit = async () => {
    if (!pending || busy) return;
    setBusy(true);
    try {
      const url = await uploadFile(pending.file, "docs");
      const nm = pending.name.trim() || pending.file.name;
      setDocs((s) => [{ id: uid(), name: nm, file: pending.file.name, category: cat, size: pending.file.size, date: PROJECT.statusDate, url }, ...s]);
      log && log("Unggah dokumen", `${nm} (${cat})`);
      setPending(null);
    } catch (e) { setErr("Gagal mengunggah: " + (e.message || "")); }
    setBusy(false);
  };
  const remove = (d) => { if (d.url && d.url.indexOf("blob:") === 0) { try { URL.revokeObjectURL(d.url); } catch (x) {} } setDocs((s) => s.filter((x) => x.id !== d.id)); log && log("Hapus dokumen", d.name); };
  const th = { textAlign: "left", fontSize: 11, fontWeight: 700, color: C.slate, padding: "10px 8px", borderBottom: `1px solid ${C.line}`, textTransform: "uppercase", letterSpacing: .3, whiteSpace: "nowrap" };
  const td = { padding: "10px 8px", borderBottom: `1px solid ${C.line}`, fontSize: 13, color: C.ink };
  return <div className="g1">
    <Card>
      <CardHead icon="upload" title="Unggah Dokumen" />
      {!pending ? (
        <div className="rowwrap">
          <label style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "9px 15px", background: C.blue, color: "#fff", borderRadius: 10, fontWeight: 600, fontSize: 13.5, cursor: "pointer" }}>
            <Ic name="upload" size={16} /> Pilih file PDF
            <input type="file" accept="application/pdf" onChange={pick} style={{ display: "none" }} />
          </label>
          <span style={{ fontSize: 12, color: C.slate }}>Format PDF · maksimal 40 MB</span>
        </div>
      ) : (
        <div style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 12, padding: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, fontSize: 12.5, color: C.slate }}><span style={{ color: C.red }}><Ic name="file" size={16} /></span> {pending.file.name} · {mb(pending.file.size)}</div>
          <div className="g2">
            <Field label="Nama Dokumen" req><Input value={pending.name} onChange={(e) => setPending((p) => ({ ...p, name: e.target.value }))} placeholder="mis. Kontrak Konsultan MRT" /></Field>
            <Field label="Kategori"><Sel value={cat} onChange={(e) => setCat(e.target.value)}>{CATS.map((c) => <option key={c}>{c}</option>)}</Sel></Field>
          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 12 }}><Btn kind="ghost" size="sm" onClick={() => setPending(null)}>Batal</Btn><Btn size="sm" onClick={commit} disabled={busy} style={{ opacity: busy ? .7 : 1 }}><Ic name="check" size={14} /> {busy ? "Mengunggah…" : "Unggah"}</Btn></div>
        </div>
      )}
      {err && <div style={{ marginTop: 12, padding: "10px 12px", background: "#FDECEF", color: C.red, borderRadius: 10, fontSize: 12.5, fontWeight: 600 }}>{err}</div>}
    </Card>
    <Card>
      <CardHead icon="folder" title="Arsip Dokumen" right={<span style={{ fontSize: 12.5, color: C.slate }}>{docs.length} berkas</span>} />
      <div className="scrollx"><table style={{ width: "100%", borderCollapse: "collapse", minWidth: 680 }}>
        <thead><tr><th style={th}>Nama Dokumen</th><th style={th}>Kategori</th><th style={{ ...th, textAlign: "right" }}>Ukuran</th><th style={th}>Tanggal</th><th style={{ ...th, textAlign: "right" }}>Aksi</th></tr></thead>
        <tbody>{docs.map((d) => <tr key={d.id}>
          <td style={td}><div style={{ display: "flex", alignItems: "center", gap: 9 }}><span style={{ color: C.red }}><Ic name="file" size={18} /></span><div style={{ minWidth: 0 }}><div style={{ fontWeight: 600 }}>{d.name} {d.example && <span style={{ fontSize: 10, fontWeight: 700, color: C.amber, background: "#FCF3E2", padding: "1px 7px", borderRadius: 99 }}>contoh</span>}</div><div style={{ fontSize: 11, color: C.slate }}>{d.file}</div></div></div></td>
          <td style={td}><Pill text={d.category} color={C.blue} bg={C.blueSoft} /></td>
          <td style={{ ...td, textAlign: "right", fontVariantNumeric: "tabular-nums", color: C.slate }}>{mb(d.size)}</td>

/* bukti penyelesaian temuan: PNG/JPG/PDF maks 3 MB; batal = status kembali */
function PunchProofModal({ item, onDone, onCancel }) {
  const [file, setFile] = useState(null);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const pick = (e) => {
    const fl = e.target.files && e.target.files[0]; e.target.value = ""; if (!fl) return;
    setErr("");
    const ok = ["image/png", "image/jpeg", "image/jpg", "application/pdf"];
    if (ok.indexOf(fl.type) < 0) { setErr("Format harus PNG, JPG, atau PDF."); return; }
    if (fl.size > 3 * 1048576) { setErr(`Ukuran ${mb(fl.size)} melebihi batas 3 MB.`); return; }
    setFile(fl);
  };
  const submit = async () => {
    if (!file) { setErr("Bukti penyelesaian wajib diunggah."); return; }
    setBusy(true);
    try { const url = await uploadFile(file, "punch-bukti"); onDone({ proofUrl: url, proofName: file.name }); }
    catch (e) { setErr("Gagal mengunggah: " + (e.message || "")); setBusy(false); }
  };
  return <Modal title="Bukti Penyelesaian Temuan" onClose={onCancel} width={470}>
    <div style={{ fontSize: 13.5, fontWeight: 700, color: C.ink, marginBottom: 4 }}>{item.title}</div>

    </div>
    <label style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "18px 14px", border: `1.5px dashed ${file ? C.green : C.line}`, borderRadius: 12, cursor: "pointer", background: file ? C.greenSoft : C.bg }}>
      <Ic name={file ? "check" : "upload"} size={17} />
      <span style={{ fontSize: 13, fontWeight: 600, color: file ? C.green : C.ink }}>{file ? `${file.name} · ${mb(file.size)}` : "Pilih berkas bukti (PNG / JPG / PDF, maks 3 MB)"}</span>
      <input type="file" accept="image/png,image/jpeg,application/pdf" onChange={pick} style={{ display: "none" }} />
    </label>
    {err && <div style={{ color: C.red, fontSize: 12.5, marginTop: 10, fontWeight: 600 }}>{err}</div>}
    <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 18 }}>
      <Btn kind="ghost" onClick={onCancel}>Batal</Btn>
      <Btn kind="green" onClick={submit} disabled={busy || !file} style={{ opacity: busy || !file ? .6 : 1 }}>{busy ? "Mengunggah…" : "Tandai Selesai"}</Btn>
    </div>
  </Modal>;
}

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <Sel value={fStage} onChange={(e) => setFStage(e.target.value)} style={{ width: 190, padding: "7px 10px" }}><option value="">Semua tahap</option>{allStages.map((n) => <option key={n}>{n}</option>)}</Sel>
          <Sel value={fStatus} onChange={(e) => setFStatus(e.target.value)} style={{ width: 135, padding: "7px 10px" }}><option value="">Semua status</option>{[PST.open, PST.prog, PST.done].map((s) => <option key={s}>{s}</option>)}</Sel>
        </div>} />
      <div className="scrollx"><table style={{ width: "100%", borderCollapse: "collapse", minWidth: 760 }}>
        <thead><tr><th style={th}>Temuan</th><th style={th}>Tahap</th><th style={th}>Severity</th><th style={{ ...th, width: 150 }}>Status</th><th style={th}>Target</th><th style={{ ...th, width: 60 }}>Bukti</th><th style={{ ...th, width: 60 }}></th></tr></thead>
        <tbody>{list.map((p) => <tr key={p.id}>
          <td style={td}><div style={{ display: "flex", gap: 10 }}>{p.photo && <img src={p.photo} alt="" style={{ width: 42, height: 42, objectFit: "cover", borderRadius: 8, border: `1px solid ${C.line}`, flexShrink: 0 }} />}<div><div style={{ fontWeight: 600 }}>{p.title}</div>{p.loc && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 2 }}>Lokasi: {p.loc}</div>}{p.note && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 2 }}>{p.note}</div>}</div></div></td>
          <td style={{ ...td, fontSize: 12.5, color: C.slate }}>{p.stage}</td>
          <td style={td}><Pill text={p.severity} color={SEVC[p.severity]} bg={SEVC[p.severity] + "1A"} /></td>
          <td style={td}><Sel value={p.status} disabled={!can.manage} onChange={(e) => setStatus(p.id, e.target.value)} style={{ padding: "5px 8px", fontSize: 12.5, color: PMETA[p.status].color, fontWeight: 700, background: PMETA[p.status].bg, border: `1px solid ${C.line}` }}>{[PST.open, PST.prog, PST.done].map((s) => <option key={s} style={{ color: C.ink, background: "#fff" }}>{s}</option>)}</Sel></td>
          <td style={{ ...td, fontVariantNumeric: "tabular-nums", color: C.slate, whiteSpace: "nowrap" }}>{fmtDate(p.due)}</td>
          <td style={td}>{p.proofUrl
            ? <a href={p.proofUrl} target="_blank" rel="noreferrer" title={p.proofName} style={{ ...iconBtn, color: C.green, textDecoration: "none" }}><Ic name="file" size={15} /></a>
            : <span style={{ fontSize: 11, color: "#B8C4D2" }}>—</span>}</td>
          <td style={td}>{can.manage && <div style={{ display: "flex", gap: 2 }}><button onClick={() => setModal({ item: p })} style={iconBtn}><Ic name="pencil" size={14} /></button><button onClick={() => { setPunch((s) => s.filter((x) => x.id !== p.id)); log && log("Hapus temuan", p.title); }} style={{ ...iconBtn, color: C.red }}><Ic name="trash" size={14} /></button></div>}</td>
        </tr>)}
        {list.length === 0 && <tr><td colSpan={7}><Empty text="Tidak ada temuan untuk kegiatan / filter ini." /></td></tr>}
        </tbody></table></div>
    </Card>
    {modal && can.manage && <PunchModal item={modal.item} stages={allStages} act={actTab} onSave={save} onClose={() => setModal(null)} />}
    {proof && <PunchProofModal item={proof.item} onDone={finishWithProof} onCancel={() => { setProof(null); log && log("Batal selesaikan temuan", `${proof.item.title} — status kembali ke ${proof.prev}`); }} />}
    {reportCfg && <PunchReportModal stages={allStages} defaultStage={fStage} onClose={() => setReportCfg(false)} onMake={(cfg) => { setReport(cfg); setReportCfg(false); log && log("Cetak laporan punchlist", cfg.stage || "Semua tahap"); }} />}
    {report && <PunchReport punch={actPunch} stage={report.stage} loc={report.loc} onClose={() => setReport(null)} />}
  </div>;
}

/* ===== TUGAS SAYA (checklist ala OneNote) ===== */
/* modal CRUD tugas pribadi */
function MyTaskModal({ item, users, me, isPM, onSave, onClose }) {
  const isNew = !item;
  const [f, setF] = useState(item || { text: "", owner: uname(me), status: MST.todo, prio: "Sedang", due: "", note: "" });
  const [err, setErr] = useState("");
  const set = (k, v) => setF((s) => ({ ...s, [k]: v }));
  const save = () => {
    if (!f.text.trim()) { setErr("Nama tugas wajib diisi."); return; }
    onSave({ ...f, text: f.text.trim(), owner: (isPM ? (f.owner || uname(me)) : uname(me)).toLowerCase(), done: f.status === MST.done });
  };
  return <Modal title={isNew ? "Tugas Baru" : "Edit Tugas"} onClose={onClose} width={500}>
    <ReqNote />
    <Field label="Nama tugas" req><Input autoFocus value={f.text} onChange={(e) => set("text", e.target.value)} placeholder="mis. Review gambar kerja Lt.21" onKeyDown={(e) => e.key === "Enter" && save()} /></Field>
    <div style={{ marginTop: 12 }}><Field label="Penanggung jawab">
      {isPM
        ? <Sel value={f.owner} onChange={(e) => set("owner", e.target.value)}>{users.filter((u) => u.active && !u.pending).map((u) => <option key={u.id} value={uname(u)}>{u.name} — {u.role}</option>)}</Sel>
        : <Input value={me.name + " (Anda)"} disabled />}
    </Field>{!isPM && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 4 }}>Role Admin hanya dapat membuat tugas untuk diri sendiri.</div>}</div>
    <div className="g3" style={{ marginTop: 12, gap: 12 }}>
      <Field label="Status"><Sel value={f.status} onChange={(e) => set("status", e.target.value)}>{MCOLS.map((x) => <option key={x}>{x}</option>)}</Sel></Field>
      <Field label="Prioritas"><Sel value={f.prio} onChange={(e) => set("prio", e.target.value)}>{PRIO.map((x) => <option key={x}>{x}</option>)}</Sel></Field>
      <Field label="Tenggat"><Input type="date" value={f.due || ""} onChange={(e) => set("due", e.target.value)} /></Field>
    </div>
    <div style={{ marginTop: 12 }}><Field label="Catatan (opsional)"><Area value={f.note || ""} onChange={(e) => set("note", e.target.value)} placeholder="Detail atau langkah pengerjaan" style={{ minHeight: 72 }} /></Field></div>
    {err && <div style={{ color: C.red, fontSize: 12.5, marginTop: 10 }}>{err}</div>}
    <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 18 }}>
      <Btn kind="ghost" onClick={onClose}>Batal</Btn><Btn onClick={save}>{isNew ? "Tambah" : "Simpan"}</Btn>
    </div>
  </Modal>;
}
function MyTasks({ mytasks, setMytasks, tasks, setTasks, users, user, isPM, log }) {
  const [view, setView] = useState("list");        // list | kanban
  const [scope, setScope] = useState("me");
  const [folded, setFolded] = useState({});
  const [modal, setModal] = useState(null);
  const [over, setOver] = useState(null);
  const [drag, setDrag] = useState(null);
  const me = uname(user);
  const meUser = findUser(users, user.id) || findUser(users, me) || user;
  const canEdit = isPM;                            // Admin: hanya tambah + ubah status
  /* PENUGASAN PIC: pekerjaan dari Gantt/Kanban tempat user menjadi PIC
     ikut tampil di sini. Statusnya dua arah — diubah di sini berubah juga
     di Gantt/Kanban, dan sebaliknya, karena sumbernya satu: state tasks. */
  const assigned = useMemo(() => {
    const leaves = tasks.filter((t) => !tasks.some((x) => x.parent === t.id));
    return leaves
      .filter((t) => (isPM && scope === "all") ? (t.assignees || []).length > 0 : (meUser && isAssigned(users, t.assignees, meUser)))
      .map((t) => ({
        id: "w:" + t.id, work: true, workId: t.id, text: t.name, owner: (t.assignees || [])[0] || (meUser ? meUser.id : me),
        assignees: t.assignees || [], status: W2M[t.status] || MST.todo, prio: t.prio || "Sedang",
        due: t.finish, note: t.note || "", act: t.act, percent: t.percent,
        todos: t.todos || [], actualFinish: t.actualFinish || "",
      }));
  }, [tasks, scope, me, isPM]);
  const personal = (isPM && scope === "all") ? mytasks : mytasks.filter((t) => { const o = (t.owner || "").toLowerCase(); return o === me || o === String(user.id).toLowerCase() || (meUser && o === String(meUser.id).toLowerCase()); });
  const scoped = [...assigned, ...personal];
  const userOf = (em) => findUser(users, em);
  const stOfT = (t) => t.status || MST.todo;

  const upd = (id, patch) => setMytasks((s) => s.map((t) => t.id === id ? { ...t, ...patch } : t));
  const moveTo = (id, st) => {
    const cur = scoped.find((x) => x.id === id); if (!cur || stOfT(cur) === st) return;
    if (cur.work) {
      /* pekerjaan: tulis balik ke tasks supaya Gantt & Kanban ikut berubah */
      const ws = M2W[st] || STATUS.todo;
      setTasks((s) => s.map((t) => {
        if (t.id !== cur.workId) return t;
        let pct = t.percent, todos = t.todos || [];
        if (ws === STATUS.done) { pct = 100; todos = todos.map((x) => ({ ...x, done: true })); }
        else if (ws === STATUS.todo) { pct = 0; todos = todos.map((x) => ({ ...x, done: false })); }
        else if (ws === STATUS.doing && (pct === 0 || pct === 100)) pct = todos.length ? Math.round(todos.filter((x) => x.done).length / todos.length * 100) : 50;
        return { ...t, status: ws, percent: pct, todos };
      }));
      log && log("Ubah status pekerjaan (Tugas Saya)", `${cur.text} → ${ws}`);
      return;
    }
    upd(id, { status: st, done: st === MST.done });
    log && log("Ubah status tugas", `${cur.text} → ${st}`);
  };
  const cycle = (t) => { const i = MCOLS.indexOf(stOfT(t)); moveTo(t.id, MCOLS[(i + 1) % MCOLS.length]); };
  const save = (data) => {
    if (data.workId) {
      /* pekerjaan: tulis balik to-do, catatan, persen, dan status ke state tasks */
      setTasks((s) => s.map((t) => {
        if (t.id !== data.workId) return t;
        return { ...t, todos: data.todos, note: data.note, percent: data.percent, status: data.status, actualFinish: data.status === STATUS.done ? nowISO().slice(0, 10) : (t.actualFinish || "") };
      }));
      log && log("Update pekerjaan (Tugas Saya)", scoped.find((x) => x.workId === data.workId)?.text + " " + data.percent + "%");
      setModal(null); return;
    }
    if (data.id) { setMytasks((s) => s.map((t) => t.id === data.id ? { ...t, ...data } : t)); log && log("Edit tugas", data.text); }
    else { setMytasks((s) => [...s, { ...data, id: uid() }]); log && log("Tambah tugas", `${data.text}${data.owner !== me ? " → " + data.owner : ""}`); }
    setModal(null);
  };
  const del = (t) => {
    if (!canEdit || t.work) return;
    if (!window.confirm(`Hapus tugas "${t.text}"?`)) return;
    setMytasks((s) => s.filter((x) => x.id !== t.id)); log && log("Hapus tugas", t.text);
  };

  const dragProps = (t) => ({
    draggable: true,
    onDragStart: (e) => { e.dataTransfer.setData("text/plain", t.id); e.dataTransfer.effectAllowed = "move"; setDrag(t.id); },
    onDragEnd: () => { setDrag(null); setOver(null); },
  });
  const dropProps = (st) => ({
    onDragOver: (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; setOver(st); },
    onDragLeave: () => setOver((o) => (o === st ? null : o)),
    onDrop: (e) => { e.preventDefault(); const id = e.dataTransfer.getData("text/plain"); setOver(null); setDrag(null); if (id) moveTo(id, st); },
  });

  const total = scoped.length, done = scoped.filter((t) => stOfT(t) === MST.done).length;
  const late = scoped.filter((t) => t.due && stOfT(t) !== MST.done && D(t.due) < todayNoon()).length;
  const th = { textAlign: "left", fontSize: 10.5, fontWeight: 700, color: "#8A99AB", padding: "8px 10px", textTransform: "uppercase", letterSpacing: .4, whiteSpace: "nowrap" };

  const OwnerCell = ({ owner }) => { const u = userOf(owner); return u
    ? <span style={{ display: "inline-flex", alignItems: "center", gap: 7 }}><span style={{ width: 24, height: 24, borderRadius: 99, background: u.role === ROLE.pm ? C.blueSoft : C.greenSoft, color: u.role === ROLE.pm ? C.blue : C.green, display: "grid", placeItems: "center", fontSize: 11, fontWeight: 800, flexShrink: 0 }}>{(u.name || "?")[0].toUpperCase()}</span><span style={{ fontSize: 12.5 }}>{u.name}</span></span>
    : <span style={{ fontSize: 12, color: C.slate }}>{owner}</span>; };
  const StatusDot = ({ t, m }) => <button onClick={() => cycle(t)} title="Klik untuk pindah status"
    style={{ width: 20, height: 20, borderRadius: 99, border: `2px solid ${m.bar}`, background: stOfT(t) === MST.done ? m.bar : "#fff", color: "#fff", cursor: "pointer", display: "grid", placeItems: "center", flexShrink: 0, padding: 0 }}>
    {stOfT(t) === MST.done && <Ic name="check" size={11} />}
    {stOfT(t) === MST.doing && <span style={{ width: 8, height: 8, borderRadius: 99, background: m.bar }} />}
  </button>;

  return <div className="g1">
    <div className="g4">
      <Stat label="Total Tugas" value={total} sub={`${assigned.length} dari pekerjaan · ${personal.length} pribadi`} icon="tasks" color={C.ink} />
      <Stat label={MST.done} value={done} sub={total ? Math.round(done / total * 100) + "% tuntas" : "—"} icon="check" color={MMETA[MST.done].bar} />
      <Stat label={MST.doing} value={scoped.filter((t) => stOfT(t) === MST.doing).length} icon="half" color={MMETA[MST.doing].bar} />
      <Stat label="Lewat Tenggat" value={late} icon="alert" color={C.red} />
    </div>

    <Card style={{ padding: 0, overflow: "hidden" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "16px 18px", borderBottom: `1px solid ${C.line}`, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
          <span style={{ width: 30, height: 30, borderRadius: 9, background: C.violetSoft, color: C.violet, display: "grid", placeItems: "center", flexShrink: 0 }}><Ic name="tasks" size={16} /></span>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 15, color: C.ink }}>Tugas Saya</div>
            <div style={{ fontSize: 11.5, color: C.slate, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{scope === "all" ? "Semua tugas tim" : `${user.name} · ${uname(user)}`}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          <div style={{ display: "flex", gap: 4, background: C.bg, padding: 3, borderRadius: 10, border: `1px solid ${C.line}` }}>
            {[["list", "tasks", "Daftar"], ["kanban", "kanban", "Kanban"]].map(([id, ic, lb]) => <button key={id} onClick={() => setView(id)}
              style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "6px 12px", borderRadius: 8, border: "none", background: view === id ? "#fff" : "transparent", color: view === id ? C.violet : C.slate, fontWeight: 700, fontSize: 12.5, cursor: "pointer", boxShadow: view === id ? "0 1px 3px rgba(16,42,67,.1)" : "none" }}><Ic name={ic} size={14} /> {lb}</button>)}
          </div>
          {isPM && <Sel value={scope} onChange={(e) => setScope(e.target.value)} style={{ width: 166, padding: "7px 10px" }}>
            <option value="me">Hanya tugas saya</option><option value="all">Semua tugas tim</option>
          </Sel>}
          <Btn onClick={() => setModal({ item: null })}><Ic name="plus" size={15} /> Tugas Baru</Btn>
        </div>
      </div>

      {!canEdit && <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 18px", background: C.blueSoft, borderBottom: `1px solid ${C.line}`, fontSize: 12, color: C.ink }}>
        <span style={{ color: C.blue, flexShrink: 0 }}><Ic name="alert" size={14} /></span>
        Role Admin: dapat <b>menambah tugas</b> untuk diri sendiri, <b>mengubah status</b> (klik lingkaran atau seret kartu), dan <b>mencentang to-do</b> pekerjaan yang ditugaskan.
      </div>}

      {/* ---------- TAMPILAN DAFTAR ---------- */}
      {view === "list" && MCOLS.map((st) => {
        const items = scoped.filter((t) => stOfT(t) === st);

        const hidden = folded[st];
        const isOver = over === st;

          <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "11px 14px", background: isOver ? m.bg : m.head, borderLeft: `4px solid ${m.bar}` }}>
            <button onClick={() => setFolded((s) => ({ ...s, [st]: !s[st] }))} style={{ ...iconBtn, padding: 2, color: m.color, transform: hidden ? "rotate(-90deg)" : "none", transition: ".15s" }}><Ic name="chevD" size={15} /></button>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12, fontWeight: 800, color: m.color, background: m.bg, borderRadius: 99, padding: "4px 11px" }}><Ic name={m.icon} size={12} /> {st}</span>
            <span style={{ fontSize: 11.5, color: m.color, fontWeight: 700 }}>{items.length}</span>
            {isOver && <span style={{ fontSize: 11.5, fontWeight: 700, color: m.color, marginLeft: 4 }}>lepaskan di sini →</span>}
          </div>
          {!hidden && <div className="scrollx">
            <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 760 }}>
              <thead><tr style={{ background: m.head }}>
                <th style={{ ...th, width: "42%" }}>Nama Tugas</th><th style={th}>Penanggung Jawab</th><th style={th}>Tenggat</th><th style={th}>Prioritas</th><th style={{ ...th, width: 76 }}>Aksi</th>
              </tr></thead>
              <tbody>
                {items.map((t, i) => {
                  const isLate = t.due && st !== MST.done && D(t.due) < todayNoon();
                  const td = { padding: "10px", fontSize: 13, color: C.ink, borderTop: `1px solid ${m.line}`, verticalAlign: "middle", background: drag === t.id ? m.bg : (i % 2 ? "#fff" : m.row) };
                  return <tr key={t.id} {...dragProps(t)} style={{ cursor: "grab", opacity: drag === t.id ? .5 : 1 }}>
                    <td style={td}><div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ color: "#B8C4D2", flexShrink: 0, display: "grid", placeItems: "center" }} title="Seret untuk pindah status"><Ic name="grip" size={14} /></span>
                      <StatusDot t={t} m={m} />
                      <div style={{ minWidth: 0 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>

                          {t.work && <Chip text={actOf(t.act).label} c={actOf(t.act).color} b={actOf(t.act).soft} dot />}

                            </div>
                          : t.note && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 340 }}>{t.note}</div>}
                      </div>
                    </div></td>
                    <td style={td}><OwnerCell owner={t.owner} /></td>

                      : <span style={{ fontSize: 12, color: "#A9B7C6" }}>—</span>}</td>
                    <td style={td}><PrioChip prio={t.prio || "Sedang"} /></td>
                    <td style={td}><div style={{ display: "flex", gap: 2 }}>
                      <button title={t.work ? "Edit to-do & catatan" : (canEdit ? "Edit tugas" : "Lihat tugas")} onClick={() => setModal({ item: t })} style={{ ...iconBtn, color: (canEdit || t.work) ? C.violet : C.slate }}><Ic name={(canEdit || t.work) ? "pencil" : "eye"} size={14} /></button>
                      {canEdit && !t.work && <button title="Hapus" onClick={() => del(t)} style={{ ...iconBtn, color: C.red }}><Ic name="trash" size={14} /></button>}
                    </div></td>
                  </tr>;
                })}
                {items.length === 0 && <tr><td colSpan={5} style={{ padding: "14px 16px", fontSize: 12.5, color: "#A9B7C6", borderTop: `1px solid ${m.line}`, background: m.row }}>Belum ada tugas — seret tugas ke sini atau tambahkan baru.</td></tr>}
                <tr><td colSpan={5} style={{ padding: "8px 12px", borderTop: `1px solid ${m.line}`, background: m.row }}>
                  <button onClick={() => setModal({ item: null, status: st })} style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "none", border: "none", color: m.color, fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}><Ic name="plus" size={14} /> Tambah Tugas</button>
                </td></tr>
              </tbody>
            </table>
          </div>}
        </div>;
      })}

      {/* ---------- TAMPILAN KANBAN ---------- */}
      {view === "kanban" && <div style={{ padding: 16 }}>
        <div className="g4">
          {MCOLS.map((st) => {
            const items = scoped.filter((t) => stOfT(t) === st);
            const m = MMETA[st];
            const isOver = over === st;
            return <div key={st} {...dropProps(st)}
              style={{ background: isOver ? m.bg : m.row, border: `1px ${isOver ? "solid" : "dashed"} ${isOver ? m.bar : m.line}`, borderTop: `3px solid ${m.bar}`, borderRadius: 14, padding: 12, minHeight: 240, transition: ".12s", minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 800, color: m.color }}><Ic name={m.icon} size={13} /> {st}</span>
                <span style={{ fontSize: 11, fontWeight: 800, color: m.color, background: m.bg, borderRadius: 6, padding: "1px 7px" }}>{items.length}</span>
                <button title="Tambah tugas" onClick={() => setModal({ item: null, status: st })} style={{ ...iconBtn, marginLeft: "auto", padding: 3, color: m.color }}><Ic name="plus" size={15} /></button>
              </div>
              <div style={{ display: "grid", gap: 9 }}>
                {items.map((t) => {
                  const isLate = t.due && st !== MST.done && D(t.due) < todayNoon();
                  return <div key={t.id} {...dragProps(t)} onDoubleClick={() => setModal({ item: t })}
                    style={{ background: "#fff", border: `1px solid ${m.line}`, borderLeft: `3px solid ${m.bar}`, borderRadius: 12, padding: "11px 12px", cursor: "grab", opacity: drag === t.id ? .5 : 1, boxShadow: "0 1px 3px rgba(16,42,67,.06)" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
                      <PrioChip prio={t.prio || "Sedang"} />
                      {t.work && <Chip text={actOf(t.act).label} c={actOf(t.act).color} b={actOf(t.act).soft} dot />}
                      {isLate && <Chip text="Terlambat" c={C.red} b="#FDECEF" />}
                      <span style={{ marginLeft: "auto", display: "flex", gap: 1 }}>
                        <button title={t.work ? "Edit to-do" : (canEdit ? "Edit" : "Lihat")} onClick={() => setModal({ item: t })} style={{ ...iconBtn, padding: 3, color: (canEdit || t.work) ? C.violet : C.slate }}><Ic name={(canEdit || t.work) ? "pencil" : "eye"} size={13} /></button>
                        {canEdit && !t.work && <button title="Hapus" onClick={() => del(t)} style={{ ...iconBtn, padding: 3, color: C.red }}><Ic name="trash" size={13} /></button>}
                      </span>
                    </div>
                    <div style={{ display: "flex", alignItems: "flex-start", gap: 9 }}>
                      <StatusDot t={t} m={m} />
                      <div style={{ minWidth: 0, flex: 1 }}>
                        <div style={{ fontSize: 13, fontWeight: 700, lineHeight: 1.35, color: st === MST.done ? C.slate : C.ink, textDecoration: st === MST.done ? "line-through" : "none" }}>{t.text}</div>
                        {t.note && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 4, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{t.note}</div>}
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginTop: 10, paddingTop: 9, borderTop: `1px solid ${m.line}` }}>
                      <OwnerCell owner={t.owner} />
                      <span style={{ fontSize: 10.5, fontWeight: 700, color: isLate ? C.red : C.slate, display: "inline-flex", alignItems: "center", gap: 4, whiteSpace: "nowrap" }}><Ic name="clock" size={11} /> {t.due ? fmtDate(t.due) : "tanpa tenggat"}</span>
                    </div>
                  </div>;
                })}
                {items.length === 0 && <div style={{ fontSize: 11.5, color: "#A9B7C6", textAlign: "center", padding: "20px 0" }}>Seret tugas ke sini</div>}
                <AddNew onClick={() => setModal({ item: null, status: st })} label="Tambah tugas" />
              </div>
            </div>;
          })}
        </div>
      </div>}
    </Card>

    {modal && modal.item && modal.item.work
      ? <WorkTaskModal task={modal.item} onSave={save} onClose={() => setModal(null)} />
      : modal && (canEdit || !modal.item)
        ? <MyTaskModal item={modal.item ? { ...modal.item } : (modal.status ? { text: "", owner: me, status: modal.status, prio: "Sedang", due: "", note: "" } : null)}
            users={users} me={{ email: me, name: user.name }} isPM={isPM} onSave={save} onClose={() => setModal(null)} />
        : modal && <MyTaskView task={modal.item} owner={userOf(modal.item.owner)} onClose={() => setModal(null)} />}
  </div>;
}

/* ===== MODAL PEKERJAAN DI TUGAS SAYA (edit checklist & catatan) ===== */
function WorkTaskModal({ task, onSave, onClose }) {
  const [todos, setTodos] = useState((task.todos || []).map((x) => ({ ...x })));
  const [note, setNote] = useState(task.note || "");
  const toggle = (id) => setTodos((s) => s.map((x) => x.id === id ? { ...x, done: !x.done } : x));
  const doneN = todos.filter((x) => x.done).length;
  const autoPct = todos.length ? Math.round(doneN / todos.length * 100) : task.percent;
  const allDone = todos.length > 0 && doneN === todos.length;
  const share = todos.length ? 100 / todos.length : 0;
  const m = SMETA[task.status] || SMETA[STATUS.todo];
  const pm = PRIOC[task.prio] || PRIOC.Sedang;
  const save = () => {
    const pct = todos.length ? Math.round(todos.filter((x) => x.done).length / todos.length * 100) : task.percent;
    const st = pct >= 100 ? STATUS.done : pct > 0 ? STATUS.doing : STATUS.todo;
    onSave({ workId: task.workId, todos, note, percent: pct, status: st });
  };
  return <Modal title="Detail Pekerjaan" onClose={onClose} width={560}>
    <div style={{ fontSize: 16, fontWeight: 800, color: C.ink, lineHeight: 1.35 }}>{task.text}</div>
    <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 6, flexWrap: "wrap" }}>
      <Chip text={actOf(task.act).label} c={actOf(task.act).color} b={actOf(task.act).soft} dot />
      <Chip text={"Prioritas " + (task.prio || "Sedang")} c={pm.c} b={pm.b} dot />
      <span style={{ fontSize: 11.5, color: C.slate }}>{fmtDate(task.due)}</span>
    </div>

    {/* Progress bar */}
    <div style={{ marginTop: 16, display: "flex", alignItems: "center", gap: 10 }}>
      <div style={{ flex: 1 }}><Bar pct={autoPct} color={autoPct >= 100 ? C.green : C.violet} /></div>
      <span style={{ fontSize: 13, fontWeight: 800, color: autoPct >= 100 ? C.green : C.ink, fontVariantNumeric: "tabular-nums" }}>{doneN}/{todos.length} · {autoPct}%</span>
    </div>
    {allDone && <div style={{ display: "flex", alignItems: "center", gap: 7, marginTop: 8, fontSize: 12.5, fontWeight: 700, color: C.green, background: C.greenSoft, borderRadius: 9, padding: "8px 12px" }}>
      <Ic name="check" size={14} /> Semua to-do selesai! Status akan otomatis menjadi "Selesai" saat disimpan.
    </div>}

    {/* To-do checklist */}
    {todos.length > 0 && <div style={{ marginTop: 16, border: `1px solid ${C.line}`, borderRadius: 12, padding: 12, background: "#FBFCFE" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: C.ink }}>To-do list pekerjaan</div>
        <div style={{ fontSize: 11.5, color: C.slate }}>Centang yang sudah selesai</div>
      </div>
      <div style={{ display: "grid", gap: 5 }}>
        {todos.map((x) => <button key={x.id} onClick={() => toggle(x.id)}
          style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "9px 10px", borderRadius: 9, border: `1px solid ${x.done ? C.green + "44" : C.line}`, background: x.done ? C.greenSoft : "#fff", cursor: "pointer", textAlign: "left" }}>
          <span style={{ width: 20, height: 20, borderRadius: 6, border: `2px solid ${x.done ? C.green : "#C7D2DE"}`, background: x.done ? C.green : "#fff", color: "#fff", display: "grid", placeItems: "center", flexShrink: 0 }}>
            {x.done && <Ic name="check" size={11} />}
          </span>
          <span style={{ flex: 1, fontSize: 13, fontWeight: 600, color: x.done ? C.slate : C.ink, textDecoration: x.done ? "line-through" : "none", lineHeight: 1.35 }}>{x.text}</span>
          <span style={{ fontSize: 11, fontWeight: 700, color: x.done ? C.green : "#A9B7C6", flexShrink: 0 }}>{x.done ? "+" + share.toFixed(1) + "%" : share.toFixed(1) + "%"}</span>
        </button>)}
      </div>
    </div>}
    {todos.length === 0 && <div style={{ marginTop: 14, fontSize: 12.5, color: C.slate, background: C.bg, borderRadius: 10, padding: "10px 12px", border: `1px solid ${C.line}` }}>
      Pekerjaan ini belum memiliki to-do list. Tambahkan melalui menu kegiatan di Gantt Chart.
    </div>}

    {/* Catatan */}
    <div style={{ marginTop: 16 }}>
      <Field label="Catatan pekerjaan"><Area value={note} onChange={(e) => setNote(e.target.value)} placeholder="Catatan pelaksanaan, kendala, dll." style={{ minHeight: 80 }} /></Field>
    </div>

    <div style={{ fontSize: 11.5, color: C.slate, marginTop: 12, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 10, padding: "9px 12px" }}>
      Perubahan di sini otomatis tersinkron ke Gantt Chart dan Kanban. Progres dihitung otomatis dari to-do yang dicentang.
    </div>
    <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 18 }}>
      <Btn kind="ghost" onClick={onClose}>Batal</Btn>
      <Btn onClick={save}>Simpan</Btn>
    </div>
  </Modal>;
}

/* ===== MANAJEMEN USER (khusus Project Management) ===== */
function UserModal({ item, existing, onSaved, onClose }) {
  const isNew = !item;
  const [f, setF] = useState(item || { id: uid(), name: "", username: "", role: ROLE.admin, active: true, pending: true });
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const set = (k, v) => setF((s) => ({ ...s, [k]: v }));
  const save = async () => {
    setErr("");
    const un = (f.username || "").trim().toLowerCase();
    if (!f.name.trim()) { setErr("Nama karyawan wajib diisi."); return; }
    if (!un) { setErr("Username wajib diisi."); return; }
    if (!validUser(un)) { setErr("Username 3–24 karakter: huruf kecil, angka, titik, garis bawah, atau strip."); return; }
    if (isNew && existing.some((u) => uname(u) === un)) { setErr("Username sudah dipakai."); return; }
    if (isNew || pw) {
      if (pw.length < 8) { setErr("Password minimal 8 karakter."); return; }
      if (pw !== pw2) { setErr("Konfirmasi password tidak sama."); return; }
    }
    setBusy(true);
    try {
      const r = await portalUpsertUser({ ...f, username: un }, (isNew || pw) ? pw : null);
      if (!r.ok) { setErr(r.msg || "Gagal menyimpan."); setBusy(false); return; }
      onSaved({ ...f, username: un, pending: isNew ? true : (f.pending || false) }, isNew ? ("User " + f.name + " dibuat \u2014 menunggu persetujuan Project Management sebelum bisa login.") : ("Perubahan untuk " + f.name + " tersimpan."), isNew);
    } catch (e) { setErr(e.message || "Gagal menyimpan."); setBusy(false); }
  };
  return <Modal title={isNew ? "Tambah User" : "Edit User"} onClose={onClose} width={470}>
    <ReqNote />
    <Field label="Nama Karyawan" req><Input autoFocus value={f.name} onChange={(e) => set("name", e.target.value)} placeholder="mis. Budi Santoso" /></Field>
    <div style={{ marginTop: 12 }}><Field label="Username" req>
      <Input value={f.username || ""} onChange={(e) => set("username", e.target.value.toLowerCase())} disabled={!isNew} placeholder="mis. budi.santoso" />
    </Field>{!isNew && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 4 }}>Username tidak bisa diubah karena dipakai untuk login.</div>}</div>
    <div className="g2" style={{ marginTop: 12 }}>
      <Field label={isNew ? "Password" : "Password baru"} req={isNew}><Input type="password" value={pw} onChange={(e) => setPw(e.target.value)} placeholder={isNew ? "minimal 8 karakter" : "kosongkan bila tidak diubah"} /></Field>
      <Field label="Konfirmasi Password" req={isNew}><Input type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} placeholder="ulangi password" onKeyDown={(e) => e.key === "Enter" && save()} /></Field>
    </div>
    <div className={isNew ? "" : "g2"} style={{ marginTop: 12 }}>
      <Field label="Role" req><Sel value={f.role} onChange={(e) => set("role", e.target.value)}>{[ROLE.pm, ROLE.admin].map((r) => <option key={r}>{r}</option>)}</Sel></Field>
      {!isNew && <Field label="Status akses"><Sel value={f.active ? "Aktif" : "Nonaktif"} onChange={(e) => set("active", e.target.value === "Aktif")}><option>Aktif</option><option>Nonaktif</option></Sel></Field>}
    </div>
    <div style={{ marginTop: 12, fontSize: 12, color: C.slate, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 10, padding: "10px 12px" }}>
      {isNew ? "Akun dibuat langsung di portal ini. Akun baru akan berstatus \"Menunggu Persetujuan\" dan harus disetujui oleh Project Management sebelum user bisa login."
             : "Kosongkan kolom password bila tidak ingin menggantinya. Status “Nonaktif” langsung memblokir login user ini."}
    </div>
    {err && <div style={{ color: C.red, fontSize: 12.5, marginTop: 10, lineHeight: 1.55, background: "#FDECEF", border: `1px solid ${C.red}44`, borderRadius: 10, padding: "10px 12px" }}>{err}</div>}
    <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 18 }}>
      <Btn kind="ghost" onClick={onClose}>Batal</Btn>
      <Btn onClick={save} disabled={busy} style={{ opacity: busy ? .7 : 1 }}>{busy ? "Menyimpan…" : (isNew ? "Buat User" : "Simpan")}</Btn>
    </div>
  </Modal>;
}
/* ganti password sendiri — memperbarui hash di app_users */
function PasswordModal({ me, onClose, log }) {
  const [a, setA] = useState(""), [b, setB] = useState(""), [err, setErr] = useState(""), [ok, setOk] = useState(""), [busy, setBusy] = useState(false);
  const submit = async () => {
    setErr(""); setOk("");
    if (a.length < 8) { setErr("Password baru minimal 8 karakter."); return; }
    if (a !== b) { setErr("Konfirmasi password tidak sama."); return; }
    if (!LIVE) { setOk("Mode DEMO — perubahan tidak disimpan."); return; }
    setBusy(true);
    try {
      const r = await portalUpsertUser(me, a);
      if (!r.ok) throw new Error(r.msg);
      setOk("Password berhasil diubah."); log && log("Ubah password", "akun sendiri");
    } catch (e) { setErr(e.message || "Gagal mengubah password."); }
    setBusy(false);
  };
  return <Modal title="Ubah Password" onClose={onClose} width={420}>
    <ReqNote />
    <Field label="Password baru" req><Input type="password" value={a} onChange={(e) => setA(e.target.value)} placeholder="minimal 8 karakter" /></Field>
    <div style={{ marginTop: 12 }}><Field label="Konfirmasi password baru" req><Input type="password" value={b} onChange={(e) => setB(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} /></Field></div>
    {err && <div style={{ color: C.red, fontSize: 12.5, marginTop: 10 }}>{err}</div>}
    {ok && <div style={{ color: C.green, fontSize: 12.5, marginTop: 10 }}>{ok}</div>}
    <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 18 }}><Btn kind="ghost" onClick={onClose}>Tutup</Btn><Btn onClick={submit} disabled={busy}>{busy ? "Menyimpan…" : "Simpan"}</Btn></div>
  </Modal>;
}
function UsersPage({ users, setUsers, mytasks, me, log }) {

      </div>
      <div style={{ display: "grid", gap: 8 }}>
        {pendingUsers.map((u) => <div key={u.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", border: "1px solid " + C.amber + "50", borderRadius: 12, background: "#FFFCF5", flexWrap: "wrap" }}>
          <div style={{ width: 36, height: 36, borderRadius: 99, background: u.role === ROLE.pm ? C.blueSoft : C.greenSoft, color: u.role === ROLE.pm ? C.blue : C.green, display: "grid", placeItems: "center", fontSize: 14, fontWeight: 800, flexShrink: 0 }}>{(u.name || "?")[0].toUpperCase()}</div>
          <div style={{ flex: 1, minWidth: 120 }}>
            <div style={{ fontSize: 13.5, fontWeight: 700, color: C.ink }}>{u.name}</div>

/* ===== KELOLA KEGIATAN (khusus Project Management) ===== */
function ActModal({ item, acts, onSave, onClose }) {
  const isNew = !item;
  const [f, setF] = useState(item || { label: "", color: ACT_PALETTE[3].color, soft: ACT_PALETTE[3].soft, icon: "kanban", builtin: false });
  const [err, setErr] = useState("");
  const set = (k, v) => setF((s) => ({ ...s, [k]: v }));
  const save = () => {
    const label = (f.label || "").trim();
    if (!label) { setErr("Nama kegiatan wajib diisi."); return; }
    if (acts.some((a) => a.label.toLowerCase() === label.toLowerCase() && a.id !== (item && item.id))) { setErr("Nama kegiatan sudah dipakai."); return; }
    onSave({ ...f, label });
  };
  return <Modal title={isNew ? "Tambah Kegiatan" : "Edit Kegiatan"} onClose={onClose} width={520}>
    <ReqNote />
    <Field label="Nama kegiatan" req><Input autoFocus value={f.label} onChange={(e) => set("label", e.target.value)} placeholder="mis. SmartOffice" onKeyDown={(e) => e.key === "Enter" && save()} /></Field>
    <div style={{ marginTop: 14 }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: C.slate, marginBottom: 6 }}>Warna identitas</div>
      <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
        {ACT_PALETTE.map((p) => <button key={p.color} title={p.name} onClick={() => setF((s) => ({ ...s, color: p.color, soft: p.soft }))}
          style={{ width: 32, height: 32, borderRadius: 9, background: p.color, border: f.color === p.color ? `3px solid ${C.ink}` : "2px solid #fff", boxShadow: "0 1px 3px rgba(16,42,67,.2)", cursor: "pointer" }} />)}
      </div>
    </div>
    <div style={{ marginTop: 14 }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: C.slate, marginBottom: 6 }}>Ikon</div>
      <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
        {ACT_ICON_CHOICES.map((ic) => <button key={ic} onClick={() => set("icon", ic)}
          style={{ width: 36, height: 36, borderRadius: 9, background: f.icon === ic ? f.soft : "#fff", color: f.icon === ic ? f.color : C.slate, border: `1px solid ${f.icon === ic ? f.color : C.line}`, cursor: "pointer", display: "grid", placeItems: "center" }}><Ic name={ic} size={17} /></button>)}
      </div>
    </div>
    <div style={{ marginTop: 16, padding: "12px 14px", borderRadius: 12, background: f.soft, border: `1px solid ${f.color}33`, display: "flex", alignItems: "center", gap: 10 }}>
      <span style={{ width: 32, height: 32, borderRadius: 9, background: "#fff", color: f.color, display: "grid", placeItems: "center", flexShrink: 0 }}><Ic name={f.icon} size={17} /></span>
      <div><div style={{ fontWeight: 800, fontSize: 14, color: f.color }}>{f.label || "Nama kegiatan"}</div><div style={{ fontSize: 11.5, color: C.slate }}>Pratinjau tampilan menu & Gantt</div></div>
    </div>
    {item && item.builtin && <div style={{ fontSize: 12, color: C.slate, marginTop: 12, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 10, padding: "10px 12px" }}>Kegiatan bawaan — nama, warna, dan ikon boleh diubah, tetapi tidak dapat dihapus karena terhubung ke tabel biaya RAB/Termin/Transisi.</div>}
    {err && <div style={{ color: C.red, fontSize: 12.5, marginTop: 10 }}>{err}</div>}
    <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 18 }}><Btn kind="ghost" onClick={onClose}>Batal</Btn><Btn onClick={save}>{isNew ? "Tambah Kegiatan" : "Simpan"}</Btn></div>
  </Modal>;
}
function ActsPage({ acts, setActs, tasks, setTasks, acosts, setAcosts, log, onOpen }) {
  const [modal, setModal] = useState(null);
  const save = (data) => {
    if (data.id) { setActs((s) => s.map((a) => a.id === data.id ? { ...a, ...data } : a)); log && log("Edit kegiatan", data.label); }
    else {
      let key = slugKey(data.label), n = 2;
      while (acts.some((a) => a.key === key)) key = slugKey(data.label) + "-" + (n++);
      setActs((s) => [...s, { ...data, id: uid(), key, builtin: false }]);
      log && log("Tambah kegiatan", `${data.label} (${key})`);
    }
    setModal(null);
  };
  const del = (a) => {
    const n = tasks.filter((t) => t.act === a.key).length;
    const c = acosts.filter((x) => x.act === a.key).length;
    if (!window.confirm(`Hapus kegiatan "${a.label}"?\n\n${n} pekerjaan dan ${c} item biaya di dalamnya ikut terhapus permanen.`)) return;
    setActs((s) => s.filter((x) => x.id !== a.id));
    setTasks((s) => s.filter((t) => t.act !== a.key));
    setAcosts((s) => s.filter((x) => x.act !== a.key));
    log && log("Hapus kegiatan", `${a.label} (+${n} pekerjaan)`);
  };
  const move = (i, d) => { const j = i + d; if (j < 0 || j >= acts.length) return; const l = acts.slice(); const t = l[i]; l[i] = l[j]; l[j] = t; setActs(l); };
  const th = { textAlign: "left", fontSize: 10.5, fontWeight: 700, color: "#8A99AB", padding: "10px", borderBottom: `1px solid ${C.line}`, textTransform: "uppercase", letterSpacing: .4, whiteSpace: "nowrap" };
  const td = { padding: "11px 10px", borderBottom: `1px solid ${C.line}`, fontSize: 13, color: C.ink };
  return <div className="g1">
    <div className="g4">
      <Stat label="Total Kegiatan" value={acts.length} icon="kanban" color={C.ink} />
      <Stat label="Kegiatan Bawaan" value={acts.filter((a) => a.builtin).length} icon="check" color={C.blue} />
      <Stat label="Kegiatan Tambahan" value={acts.filter((a) => !a.builtin).length} icon="plus" color={C.violet} />
      <Stat label="Total Pekerjaan" value={tasks.length} icon="calendar" color={C.green} />
    </div>
    <Card>
      <CardHead icon="kanban" color={C.violet} title="Kelola Kegiatan" right={<Btn onClick={() => setModal({})}><Ic name="plus" size={16} /> Tambah Kegiatan</Btn>} />
      <div style={{ fontSize: 12.5, color: C.slate, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 10, padding: "10px 12px", marginBottom: 14 }}>
        Setiap kegiatan yang ditambahkan otomatis mendapat modul lengkap: <b>Gantt Chart</b>, <b>Kanban</b>, <b>Kalender Mingguan</b>, tabel <b>Biaya</b> tersendiri, dan ikut dihitung di Dashboard, Master Schedule, serta Kurva-S.
      </div>
      <div className="scrollx"><table style={{ width: "100%", borderCollapse: "collapse", minWidth: 700 }}>
        <thead><tr><th style={{ ...th, width: 60 }}>Urutan</th><th style={th}>Kegiatan</th><th style={th}>Jenis</th><th style={{ ...th, textAlign: "right" }}>Pekerjaan</th><th style={{ ...th, textAlign: "right" }}>Progres</th><th style={{ ...th, width: 96 }}></th></tr></thead>
        <tbody>{acts.map((a, i) => { const n = tasks.filter((t) => t.act === a.key).length; return <tr key={a.id}>
          <td style={td}><div style={{ display: "flex", gap: 1 }}>
            <button onClick={() => move(i, -1)} disabled={i === 0} style={{ ...iconBtn, padding: 2, opacity: i === 0 ? .3 : 1 }}><Ic name="chevD" size={13} /></button>
            <button onClick={() => move(i, 1)} disabled={i === acts.length - 1} style={{ ...iconBtn, padding: 2, opacity: i === acts.length - 1 ? .3 : 1, transform: "rotate(180deg)" }}><Ic name="chevD" size={13} /></button>
          </div></td>
          <td style={td}><button onClick={() => onOpen("act:" + a.key)} style={{ display: "flex", alignItems: "center", gap: 10, background: "none", border: "none", cursor: "pointer", padding: 0, textAlign: "left" }}>
            <span style={{ width: 32, height: 32, borderRadius: 9, background: a.soft, color: a.color, display: "grid", placeItems: "center", flexShrink: 0 }}><Ic name={a.icon} size={16} /></span>
            <span><span style={{ display: "block", fontWeight: 700, color: C.ink }}>{a.label}</span><span style={{ display: "block", fontSize: 11, color: C.slate }}>{a.key}</span></span>
          </button></td>
          <td style={td}><Pill text={a.builtin ? "Bawaan" : "Tambahan"} color={a.builtin ? C.blue : C.violet} bg={a.builtin ? C.blueSoft : C.violetSoft} /></td>
          <td style={{ ...td, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{n}</td>
          <td style={{ ...td, textAlign: "right", fontWeight: 700, color: a.color, fontVariantNumeric: "tabular-nums" }}>{progressOf(tasks, a.key)}%</td>
          <td style={td}><div style={{ display: "flex", gap: 2, justifyContent: "flex-end" }}>
            <button title="Edit" onClick={() => setModal({ item: a })} style={iconBtn}><Ic name="pencil" size={14} /></button>
            <button title={a.builtin ? "Kegiatan bawaan tidak dapat dihapus" : "Hapus kegiatan"} onClick={() => del(a)} disabled={a.builtin}
              style={{ ...iconBtn, color: a.builtin ? "#C7D2DE" : C.red, cursor: a.builtin ? "not-allowed" : "pointer" }}><Ic name="trash" size={14} /></button>
          </div></td>
        </tr>; })}</tbody>
      </table></div>
    </Card>
    {modal && <ActModal item={modal.item} acts={acts} onSave={save} onClose={() => setModal(null)} />}
  </div>;
}
